<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17324D">
<title>Δρομολόγιο</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Δρομολόγιο">
<meta name="description" content="Πελάτες, εργασίες, υπενθυμίσεις, διαδρομές και ταμείο.">
<link rel="icon" id="favIcon">
<link rel="apple-touch-icon" id="favIcon2">
<style>
:root{--brand:#17324D;--onbrand:#fff;--accent:#F2B632;--onaccent:#17324D;--paper:#EDF1F2;--card:#fff;--ink:#17324D;--muted:#5E7185;--line:#D6DEE3;--red:#C8412B;--green:#2E7D5B;--loc:#2468B5;--z:1}
*{box-sizing:border-box}
html,body{margin:0}
body.hasbg::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg) center/cover no-repeat;opacity:var(--bgop,.1);pointer-events:none}
body{font-family:system-ui,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.zm{zoom:var(--z)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--onbrand);display:flex;align-items:center;gap:2px;padding:9px 6px 9px 14px;padding-top:calc(9px + env(safe-area-inset-top))}
.mark{flex:none;width:38px;height:38px;margin-right:10px;border-radius:10px;object-fit:cover}
.htitle{flex:1;min-width:0;line-height:1.1}
.htitle h1{margin:0;font-size:19px;font-weight:850;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{display:block;font-size:12px;opacity:.78;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;flex:none;background:none;border:0;color:var(--onbrand);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px}
.hbtn .dot{position:absolute;top:3px;right:1px;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:800;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.hbtn .dot.red{background:var(--red);color:#fff}
.hbtn.warn{color:var(--accent)}
.hbtn.bad{color:#FF8A7A}
.hbtn.ok{opacity:.4}
.hbtn.ok .pipdot{display:none}
.hbtn .pipdot{position:absolute;bottom:5px;right:6px;width:9px;height:9px;border-radius:50%;background:currentColor}
main{max-width:720px;margin:0 auto;padding:14px 14px 120px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;transition:none;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;padding:7px 1px 8px;color:var(--muted);font-size:clamp(8.5px,2.35vw,11.5px);letter-spacing:-.2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button.on{color:var(--ink);font-weight:800}
nav button.on svg{color:var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
nav button.on::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:38px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,transparent);z-index:-1}
nav button{position:relative;isolation:isolate}
nav .ndot{position:absolute;top:2px;left:50%;margin-left:4px;background:var(--accent);color:var(--onaccent);font-size:10.5px;font-weight:800;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
nav .ndot.red{background:var(--red);color:#fff}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--onaccent);box-shadow:0 5px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.sec{font-size:15px;font-weight:700;color:var(--muted);margin:20px 2px 8px}
.sec.red{color:var(--red)}
.sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
.pad{padding:4px 16px 16px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.title{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px}
.snip{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:8px;border:2px solid color-mix(in srgb,var(--muted) 60%,var(--card));background:var(--card);color:#fff;font-weight:800;font-size:15px;line-height:1;padding:0}
.task.p3 .check{border-color:var(--red)}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.hi{color:var(--red);font-weight:900}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:2px;white-space:nowrap}
.tag.late,.tag.noloc{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red)}
.tag.progress{background:color-mix(in srgb,var(--accent) 30%,var(--card));color:var(--ink)}
.tag.done,.tag.paid{background:color-mix(in srgb,var(--green) 15%,var(--card));color:var(--green)}
.tag.cancelled{background:var(--paper);color:var(--muted)}
.tag.waiting{background:color-mix(in srgb,var(--loc) 15%,var(--card));color:var(--loc)}
.task.waiting{background:color-mix(in srgb,var(--loc) 5%,var(--card))}
.waitbtn{flex:none;width:34px;height:34px;margin-top:1px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center}
.waitbtn.on{background:color-mix(in srgb,var(--loc) 16%,var(--card));border-color:var(--loc);color:var(--loc)}
.task.cancelled .title{text-decoration:line-through;color:var(--muted)}
.today-date{font-size:clamp(19px,6.2vw,30px);font-weight:850;line-height:1.15;margin:8px 2px 4px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-sub{color:var(--muted);margin:0 2px}
.ctarow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.cta2{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);padding:13px 12px;text-align:left}
.cta2 svg{color:var(--accent);margin-bottom:2px}
.cta2 b{font-size:15.5px;line-height:1.2}
.cta2 small{font-size:12px;opacity:.8;line-height:1.25}
.cta2:active{transform:scale(.97)}
.routecta{width:100%;margin:16px 0 4px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);text-align:left;padding:16px;display:flex;gap:14px;align-items:center}
.routecta svg{color:var(--accent);flex:none}
.routecta b{font-size:17px}
.routecta small{opacity:.8;font-size:13.5px}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:6px 2px}
.verline{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 6px;opacity:.8}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.avatar.busy{background:var(--accent);color:var(--onaccent)}
.whos{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
.who{width:20px;height:20px;border-radius:50%;color:#1b2733;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.3px}
.pplrow{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px 7px 8px;font-weight:750;font-size:14px;display:flex;align-items:center;gap:7px}
.pbtn .dotc{width:18px;height:18px;border-radius:50%}
.pbtn.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--ink)}
.pbtn .dotc{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px}
.palette button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.palette button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.rcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:1px}
.mv{width:34px;height:19px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;font-size:9px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.mv:active{background:var(--paper)}
.posn{width:34px;height:24px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;font-size:13px;font-weight:800;padding:0}
.meta1{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.chiprow .tag{margin:0}
.tag.amt0{background:var(--paper);color:var(--ink)}
.minibtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700}
.minibtn.in{background:color-mix(in srgb,var(--green) 14%,var(--card));border-color:color-mix(in srgb,var(--green) 40%,var(--card));color:var(--green)}
.minibtn.full{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:color-mix(in srgb,var(--accent) 55%,var(--card))}
.owe-mini{font-size:12.5px;color:var(--red);font-weight:700}
.row.task{padding:11px 12px 12px 14px;gap:9px}
.row.task .title{font-size:15px;line-height:1.3}
.goto{flex:none;width:34px;height:34px;margin-top:1px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--loc);display:flex;align-items:center;justify-content:center}
.nearbadge{color:var(--loc);font-weight:700}
.stars{display:flex;gap:2px;align-items:center}
.stars button{background:none;border:0;padding:2px;line-height:1;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars .diam{margin-left:6px;color:color-mix(in srgb,var(--loc) 30%,var(--line))}
.stars .diam.on{color:var(--loc)}
.stars.big button{padding:4px 3px}
.stars.ro{pointer-events:none}
.starwrap{display:flex;align-items:center;gap:10px;padding:10px 14px}
.starwrap .lbl{color:var(--muted);font-size:13.5px;flex:1}
.count{color:var(--ink);font-weight:700}
.count.late{color:var(--red)}
.callbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--green)}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;margin-bottom:6px}
.cl-name{font-size:26px;font-weight:850;line-height:1.15;margin:0 2px 2px;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin:14px 0}
.actions.four{grid-template-columns:repeat(4,1fr);gap:6px}
.actions.four .act{padding:9px 2px;font-size:11.5px;gap:3px}
.act.off{opacity:.4;pointer-events:none}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.twobtn .btn{width:100%}
.row.ent{align-items:center;padding:10px 14px}
.row.ent.cx .title,.row.ent.cx .amt{text-decoration:line-through;opacity:.55}
.entic{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.entic.in{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.entic.out{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
.amt{flex:none;font-weight:800;font-size:15px}
.amt.in{color:var(--green)}
.amt.out{color:var(--red)}
.bigsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sumcard span{display:block;color:var(--muted);font-size:13px}
.sumcard b{font-size:20px;font-weight:850;letter-spacing:-.3px}
.sumcard b.in{color:var(--green)}
.sumcard b.out{color:var(--red)}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:13.5px}
.kv b{font-weight:650;text-align:right;overflow-wrap:anywhere}
.kv b.money{color:var(--green);font-size:16px}
.kv b.owe{color:var(--red);font-size:16px}
.notes{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:650}
.quick button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.filterbar{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:750;font-size:15px}
.filterbar i{font-style:normal;color:var(--muted)}
.filterbar .fcnt{margin-left:auto;background:var(--paper);border-radius:20px;padding:2px 10px;font-size:13px;color:var(--muted)}
.filterbar svg{color:var(--muted)}
.optrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:13px 14px;font-size:15.5px;font-weight:600}
.optrow:last-child{border-bottom:0}
.optrow.on{font-weight:850;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.optrow .tick{margin-left:auto;color:var(--green);font-weight:900}
.optrow .n{color:var(--muted);font-weight:600;font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.hs{position:sticky;top:var(--hdr,62px);z-index:4;background:var(--paper);margin:-14px -14px 4px;padding:12px 14px 8px}
.hs-track{height:4px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.hs-thumb{position:absolute;top:0;bottom:0;left:0;background:var(--brand);border-radius:2px}
.hs.nofl .hs-track{display:none}
.toggle{display:flex;align-items:center;gap:9px;font-size:14px;margin:10px 2px;color:var(--ink);font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand);flex:none}
label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
input.warn{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--card))}
.tf{position:relative;display:block;width:100%}
.two .tf,.inrow .tf{flex:1;min-width:0}
.tf input{padding-right:52px}
.tf input::-webkit-calendar-picker-indicator{opacity:0;width:44px;margin:0}
.tfbtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;
  background:color-mix(in srgb,var(--loc) 14%,var(--card));color:var(--loc);display:flex;align-items:center;justify-content:center}
.tfbtn:active{transform:translateY(-50%) scale(.92)}
textarea{resize:vertical}
input[type=range]{padding:0;border:0;accent-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.tw{grid-template-columns:minmax(0,1fr) 128px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input,.inrow select,.inrow textarea{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750;font-size:15px;white-space:nowrap}
.btn.small{padding:7px 12px;font-size:14px}
.btn.wide{width:100%;margin-top:14px;white-space:normal}
.btn.big{padding:13px 20px;font-size:16.5px}
.sh-foot .amber{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pulse{animation:glow 1.1s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 40%,transparent)}}
.hintbar{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 20%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 55%,var(--card));border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.btn:disabled{opacity:.6}
.btn:active{transform:scale(.97);filter:brightness(.93)}
.gobtn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;padding:16px;font-size:17px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.gobtn:active{transform:scale(.97)}
.gobtn.busy{opacity:.75}
.primary{background:var(--brand);color:var(--onbrand)}
.ghost{background:var(--paper);color:var(--ink)}
.danger{background:transparent;color:var(--red)}
.amber{background:var(--accent);color:var(--onaccent)}
.softin{background:color-mix(in srgb,var(--green) 18%,var(--card));color:var(--green);border:1.5px solid color-mix(in srgb,var(--green) 45%,var(--card))}
.softout{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--card))}
.filebtn{margin:0;display:block;text-align:center;color:var(--ink);font-size:15px;cursor:pointer}
h3.sub{font-size:16px;margin:24px 0 4px}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:11px 6px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--onbrand)}
.seg.prio button{font-weight:850;font-size:15.5px;color:var(--ink)}
.seg.prio button[data-v="1"].on{background:var(--muted);color:#fff}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kb{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font-weight:700;font-size:13.5px;color:var(--ink)}
.kb.in.on{background:var(--green);border-color:var(--green);color:#fff}
.kb.out.on{background:var(--red);border-color:var(--red);color:#fff}
.seg.prio button[data-v="2"].on{background:var(--green);color:#fff}
.seg.prio button[data-v="3"]{color:var(--red)}
.seg.prio button[data-v="3"].on{background:var(--red);color:#fff}
label{letter-spacing:.2px}
.modal,.alert{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:none;justify-content:center}
.modal{align-items:flex-end}
body.overnav nav{z-index:22;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
body.typing main{padding-bottom:75vh}
body.typing main>*:not(#remForm){opacity:.18;transition:opacity .15s}
body.typing #remForm{box-shadow:0 6px 20px rgba(0,0,0,.14)}
.modal.overnav .sheet{margin-bottom:var(--navh,58px)}
.modal.open,.alert.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:min(92vh,var(--vvh,100vh));border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:8px;padding:18px 18px 4px;font-size:19px;font-weight:850}
.sh-head .t{flex:1}
.sh-body{padding:0 18px 16px;overflow:auto}
.sh-fixed{border-top:1px solid var(--line);box-shadow:0 -6px 14px rgba(0,0,0,.06);padding:12px 18px;background:color-mix(in srgb,var(--paper) 55%,var(--card))}
.sh-fixed:empty{display:none}
.sh-fixed.last{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sh-fixed input,.sh-fixed select{padding:10px}
.sh-fixed .two{margin:8px 0;grid-template-columns:minmax(0,1fr) 118px}
.fx-title{font-weight:800;font-size:14px;margin-bottom:8px}
.sh-foot{display:flex;gap:8px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.alert{z-index:30;align-items:center;padding:20px}
#exitDlg{z-index:35}
.alertbox.urgentbox{border-top-color:var(--red)}
.alertbox.urgentbox .al-kind,.alertbox.urgentbox .al-title{color:var(--red)}
.alertbox{background:var(--card);border-radius:16px;border-top:8px solid var(--accent);width:100%;max-width:420px;padding:20px}
.al-kind{color:var(--muted);font-weight:700;font-size:13.5px}
.al-title{font-size:22px;font-weight:850;margin:6px 0;overflow-wrap:anywhere}
.al-sub{color:var(--muted)}
.al-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:flex-end}
.choose{display:grid;gap:10px;padding-top:10px}
.choose button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-weight:750;font-size:16px}
.choose small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.x{flex:none;background:none;border:0;color:var(--muted);width:34px;height:34px;border-radius:8px;font-size:16px}
.x.bin{display:flex;align-items:center;justify-content:center}
.rem.over .x.bin{color:var(--red)}
.rem.over{background:color-mix(in srgb,var(--red) 22%,var(--card));box-shadow:inset 6px 0 0 var(--red);border-bottom-color:color-mix(in srgb,var(--red) 35%,var(--card))}
.rem.over .meta span{color:var(--red)}
.panel.overpanel{border:2px solid var(--red)}
.rem.over .title{color:var(--red);font-weight:800}
.rem-sub{font-size:13px;font-weight:750;color:var(--muted);margin:14px 2px 6px}
.readbtn{flex:none;border:0;background:var(--red);color:#fff;font-weight:750;font-size:13px;border-radius:8px;padding:7px 10px;margin-top:1px}
.archlink{display:flex;align-items:center;gap:10px;width:100%;margin:14px 0 4px;border:0;border-radius:12px;padding:13px 14px;font-weight:800;font-size:15px;
  background:var(--brand);color:var(--onbrand);box-shadow:0 3px 8px rgba(0,0,0,.18)}
.archlink .cnt{margin-left:auto;background:var(--accent);color:var(--onaccent);border-radius:20px;padding:2px 10px;font-size:13px}
.archlink:active{transform:scale(.98)}
.row.arch{padding:9px 10px 9px 14px;align-items:center}
.row.arch .title{font-size:14.5px;font-weight:600}
.row.arch .meta{margin-top:1px;font-size:12.5px}
.mini{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center}
.mini.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--card))}
.swatch{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.banner.warnbar{background:color-mix(in srgb,var(--red) 15%,var(--card));border-color:color-mix(in srgb,var(--red) 45%,var(--card))}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--accent) 22%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 60%,var(--card));border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.det{margin-top:14px;background:var(--paper);border-radius:10px;padding:10px 12px}
.det summary{font-weight:700;cursor:pointer}
.danger-zone{margin-top:22px;border:2px solid color-mix(in srgb,var(--red) 55%,var(--card));background:color-mix(in srgb,var(--red) 7%,var(--card));border-radius:14px;padding:12px 14px 16px}
.dz-head{color:var(--red);font-weight:850;font-size:15.5px;margin-bottom:4px}
.dzbtn{width:100%;margin-top:10px;background:var(--red);color:#fff;text-align:center}
.danger-zone .det{background:transparent;padding:8px 0 0}
.danger-zone .det summary{color:var(--red);font-size:14px}
.contactsbtn{width:100%;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--green) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--green) 45%,var(--card));color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:750;font-size:15px;margin-top:8px;text-align:left}
.contactsbtn.small{width:auto;margin:0;padding:6px 12px 6px 6px;gap:8px;white-space:nowrap}
.cicon{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.contactsbtn.small .cicon{width:30px;height:30px}
/* τοποθεσία */
.lw-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lwbtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 8px;font-weight:750;font-size:14px;text-decoration:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center;line-height:1.2}
.lwbtn svg{flex:none}
.lwbtn.here{background:var(--loc);border-color:var(--loc);color:#fff}
.lwbtn.pick{background:color-mix(in srgb,var(--loc) 12%,var(--card));border-color:color-mix(in srgb,var(--loc) 45%,var(--card));color:var(--loc)}
.lw-status{font-size:13.5px;margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--paper)}
.lw-status:empty{display:none}
.lw-status{white-space:pre-line}
.lw-status.ok{background:color-mix(in srgb,var(--green) 12%,var(--card));color:var(--green);font-weight:650}
.lw-status.warn{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red);font-weight:650}
.lk{background:none;border:0;padding:0;margin-left:6px;text-decoration:underline;color:inherit;font-weight:750;font-size:13.5px}
.choice{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid color-mix(in srgb,var(--loc) 45%,var(--card));background:color-mix(in srgb,var(--loc) 8%,var(--card));color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;font-weight:600}
.choice .cp{flex:none;color:var(--loc)}
.choice:active{transform:scale(.985)}
.lw-status.pick{background:color-mix(in srgb,var(--loc) 12%,var(--card));color:var(--loc);font-weight:700}
/* έξυπνη συμπλήρωση */
.aibox{margin-top:10px;border:2px solid var(--accent);border-radius:14px;padding:10px 12px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.aihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.micbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:var(--onbrand);display:flex;align-items:center;justify-content:center}
.micbtn.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 25%,transparent)}}
/* εμφάνιση */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.preset{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--ink)}
.preset span{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.preset em{flex-basis:100%;font-style:normal;font-weight:700;font-size:13px;text-align:left;margin-top:4px}
.preset.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--accent)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colorrow{display:flex;align-items:center;gap:10px;margin:0;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink);font-weight:650;font-size:13.5px}
.colorrow input{width:38px;height:32px;padding:0;border:0;background:none;flex:none}
/* χάρτης */
.mapdlg{position:fixed;inset:0;z-index:28;background:var(--card);display:none;flex-direction:column}
.mapdlg.open{display:flex}
.map-top{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--brand);color:var(--onbrand)}
.map-top b{flex:1;font-size:15px}
.map-top .x{color:var(--onbrand)}
#mapBox,#jmBox{flex:1}
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:700}
.daystrip button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.daystrip button i{font-style:normal;opacity:.75;font-weight:600}
.jpin{background:none;border:0}
.jpop b{font-size:15px}
.jpop .meta{margin-top:3px}
.jpop .row2{display:flex;gap:6px;margin-top:8px}
.jpop button,.jpop a{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none}
.map-bot{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.map-bot .tf{flex:1;min-width:0}
.map-bot .tf input{padding:10px 40px 10px 10px;font-size:15px}
.map-bot .tf .tfbtn{width:32px;height:32px}
#jobsDlg .map-bot .btn{flex:none;padding:10px 12px;font-size:14px;gap:6px}
.map-bot .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.mkpin{background:none;border:0}
.updbar{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:26;display:flex;gap:10px;align-items:center;
  background:var(--brand);color:var(--onbrand);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.updbar span{flex:1}
.stickbar{position:fixed;left:0;right:0;bottom:0;z-index:24;display:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 92%,var(--paper));border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.12)}
.stickbar .btn{width:100%;padding:14px;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px}
body.typing .stickbar:not([hidden]){display:block}
body.typing nav{display:none}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);max-width:88vw;background:var(--brand);color:var(--onbrand);padding:11px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;font-size:14px}
.modal.open~.toast,.mapdlg.open~.toast{top:calc(70px + env(safe-area-inset-top));bottom:auto}
.toast.show{opacity:1}
/* διαδρομή */
.sum{margin:16px 2px 10px;font-size:14.5px}
.route{padding:4px 0}
.node{display:flex;gap:10px;padding:0 14px 0 0}
.rail{position:relative;width:46px;flex:none;display:flex;justify-content:center;padding:12px 0}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:14px;margin-left:-7px;background:var(--brand)}
.rail::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,var(--accent) 0 9px,transparent 9px 17px)}
.node:first-child .rail::before,.node:first-child .rail::after{top:50%}
.node:last-child .rail::before,.node:last-child .rail::after{bottom:50%}
.pin{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--card);border:3px solid var(--brand);display:flex;align-items:center;justify-content:center;font-weight:850;font-size:14px;align-self:flex-start}
.pin.end{background:var(--accent);color:var(--onaccent)}
.node .body{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.node:last-child .body{border-bottom:0}
.node.off .pin{background:var(--paper);color:var(--muted);border-color:var(--muted)}
.node.off .title{color:var(--muted)}
.stoptask{display:block;width:100%;text-align:left;background:var(--paper);border:0;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:14px;color:var(--ink)}
.stoptask.late{box-shadow:inset 3px 0 0 var(--red)}
.urgent{color:var(--red);font-weight:750}
.stopbtn{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.golink{display:block;text-align:center;text-decoration:none;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    if(err.code===1)toast(st==="granted"?T("Η άδεια υπάρχει, αλλά το σύστημα δεν έδωσε θέση. Άνοιξε την Τοποθεσία του κινητού και ξαναδοκίμασε."):T("Δεν δόθηκε άδεια τοποθεσίας. Όταν εμφανιστεί το μήνυμα του Chrome, πάτα «Να επιτρέπεται»."));
    else if(err.code===3)toast(T("Η θέση άργησε να βρεθεί. Βγες σε ανοιχτό χώρο ή δοκίμασε ξανά."));
    else toast(T("Δεν βρέθηκε θέση. Έλεγξε ότι η τοποθεσία του κινητού είναι ανοιχτή."));
  };
  // πρώτα ακριβής θέση· αν αποτύχει για άλλο λόγο εκτός από άρνηση, δοκιμάζουμε πιο χαλαρά
  navigator.geolocation.getCurrentPosition(ok,err=>{
    if(err.code===1)return fail(err);
    navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:false,timeout:20000,maximumAge:300000});
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
/* αναγνώριση συντεταγμένων σε πολλές μορφές, όπως στην εφαρμογή ψαρέματος */
function parseCoords(s){
  s=String(s||"").trim();if(!s)return null;let m;
  const ok=(a,b)=>{a=+a;b=+b;return isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0)?{lat:a,lng:b}:null};
  if(/goo\.gl|maps\.app/i.test(s))return"short";
  if((m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)))return ok(m[1],m[2]);
  if((m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)))return ok(m[1],m[2]);
  if((m=s.match(/[?&](?:q|query|ll|destination|center|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)))return ok(m[1],m[2]);
  const parts=[...s.matchAll(/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['’′]\s*(\d{1,2}(?:[.,]\d+)?)?\s*(?:["”″]|'')?\s*([NSEWΒΝΑΔ])?/gi)];
  if(parts.length>=2){const cv=p=>{let v=+p[1]+(+p[2])/60+(p[3]?+p[3].replace(",",".")/3600:0);if(/[SWΝΔ]/.test(p[4]||""))v=-v;return v};return ok(cv(parts[0]),cv(parts[1]))}
  if((m=s.match(/(-?\d{1,2}[.,]\d{2,})\s*[,;\s]\s*(-?\d{1,3}[.,]\d{2,})/)))return ok(m[1].replace(",","."),m[2].replace(",","."));
  return null;
}
// «Αγίου Νικολάου 5, Ντράφι 190 09» -> οδός, περιοχή, ΤΚ
function splitAddress(txt){
  let t=String(txt||"").replace(/\s+/g," ").trim();if(!t)return null;
  let zip="";
  t=t.replace(/\b(\d{3})\s?(\d{2})\b/,(m,a,b)=>{zip=a+b;return ""}).replace(/\s+/g," ").trim();
  t=t.replace(/(^|,)\s*(Ελλάδα|Greece|GR)\s*(,|$)/i,"$1").replace(/,\s*,/g,",").replace(/^[,\s]+|[,\s]+$/g,"");
  const parts=t.split(",").map(x=>x.trim()).filter(Boolean);
  let street="",area="";
  if(parts.length>=2){street=parts[0];area=parts[parts.length-1];
    const known=parts.slice(1).map(findArea).filter(Boolean)[0];if(known)area=known.name}
  else if(parts.length===1){
    const a=areaInText(parts[0]);
    if(a&&norm(parts[0])!==norm(a.name)){area=a.name;street=parts[0].replace(new RegExp(escRe(a.name),"i"),"").replace(/[,\s]+$/,"").trim()}
    else if(a){area=a.name}else street=parts[0];
  }
  return(street||area||zip)?{street,area,zip}:null;
}
function applySplit(txt,fStreet,fArea,fZip){
  const d=splitAddress(txt);if(!d)return false;
  const got=[];
  const set=(id,v)=>{const el=$("#"+id);if(el&&v){el.value=v;return true}return false};
  if(d.street&&set(fStreet,d.street))got.push(T("οδός"));
  if(d.area&&set(fArea,d.area))got.push(T("περιοχή"));
  if(d.zip&&set(fZip,d.zip))got.push(T("ΤΚ"));
  if(got.length>1){sheetDirty=true;toast(T("Χωρίστηκε σε: {x}.",{x:got.join(", ")}));if(LW&&LW.upd)LW.upd();return true}
  return false;
}

async function reverseFill(p,silent){

let JM=null,jmLayer=null,jmDay=null;

function jmJobs(){
  return S.tasks.filter(x=>{

function jmDaysList(){

/* ---------- Χρόνος εργασιών ---------- */
function taskState(x){if(x.status==="cancelled")return"cancelled";if(x.status==="done")return"done";
  if(x.status==="waiting")return"waiting";if(x.end&&new Date(x.end)<new Date())return"late";return x.status}
const isWaiting=x=>x.status==="waiting";
function touchesToday(x){
  const sod=new Date();sod.setHours(0,0,0,0);const eod=new Date(sod);eod.setDate(eod.getDate()+1);
  const s=x.start?new Date(x.start):null,e=x.end?new Date(x.end):null;
  if(s&&e)return s<eod&&e>=sod;if(s)return s>=sod&&s<eod;if(e)return e>=sod&&e<eod;return false;
}
const dueTime=x=>x.end?+new Date(x.end):x.start?+new Date(x.start):Infinity;
const byAuto=(a,b)=>((isWaiting(a)?1:0)-(isWaiting(b)?1:0))||(dueTime(a)-dueTime(b))||((b.priority||2)-(a.priority||2));
const byDue=(a,b)=>((isWaiting(a)?1:0)-(isWaiting(b)?1:0))||(S.settings.manualOrder?((a.ord??1e9)-(b.ord??1e9))||byAuto(a,b):byAuto(a,b));
const openOrdered=()=>S.tasks.filter(isOpen).sort(byDue);
const freezeOrder=()=>{const l=openOrdered();l.forEach((x,i)=>{x.ord=i});return l};
const posOf=id=>{const i=openOrdered().findIndex(x=>x.id===id);return i<0?0:i+1};
// ανταλλαγή με τη γειτονική γραμμή που βλέπει ο χρήστης, σε όποια λίστα κι αν είναι
function moveTask(id,dir,el){
  const row=el&&el.closest?el.closest(".row.task"):null;
  let other=null;
  if(row){let n=dir==="up"?row.previousElementSibling:row.nextElementSibling;
    while(n&&!n.classList.contains("task"))n=dir==="up"?n.previousElementSibling:n.nextElementSibling;
    if(n){const b=n.querySelector("[data-act=moveTask]");other=b&&b.dataset.id}}
  const list=freezeOrder();
  if(!other){const i=list.findIndex(x=>x.id===id),j=i+(dir==="up"?-1:1);
    if(j<0||j>=list.length){toast(dir==="up"?T("Είναι ήδη πρώτη."):T("Είναι ήδη τελευταία."));return}
    other=list[j].id}
  const a=S.tasks.find(x=>x.id===id),b=S.tasks.find(x=>x.id===other);
  if(!a||!b)return;const t=a.ord;a.ord=b.ord;b.ord=t;
  S.settings.manualOrder=true;persist();render();
}
function moveTaskTo(id,pos){
  const list=freezeOrder(),i=list.findIndex(x=>x.id===id);
  if(i<0)return;pos=Math.max(1,Math.min(list.length,pos|0));
  const [x]=list.splice(i,1);list.splice(pos-1,0,x);
  list.forEach((t,k)=>{t.ord=k});
  S.settings.manualOrder=true;persist();render();toast(T("Πήγε στη θέση {n}.",{n:pos}));
}
function posSheet(id){
  const x=S.tasks.find(y=>y.id===id);if(!x)return;const total=openOrdered().length,cur=posOf(id);
  openSheet({title:T("Θέση στη λίστα"),saveLabel:T("Μετακίνηση"),saveStyle:"amber",
    body:`<p class="note">${esc(x.title)}</p>
    <label for="pos_n">${T("Βάλε τη σε ποια θέση, από 1 έως {n}",{n:total})}</label>
    <input id="pos_n" type="number" inputmode="numeric" min="1" max="${total}" value="${cur}">
    <div class="quick">${[1,2,3].filter(n=>n<=total).map(n=>`<button type="button" data-pos="${n}">${n}</button>`).join("")}
      ${total>3?`<button type="button" data-pos="${total}">${T("τελευταία")}</button>`:""}</div>`,
    onSave:()=>{const v=parseInt(val("pos_n"));if(!v){toast(T("Γράψε αριθμό θέσης."));return false}moveTaskTo(id,v)}});
  $("#shBody").querySelector(".quick").onclick=e=>{const b=e.target.closest("[data-pos]");if(b){$("#pos_n").value=b.dataset.pos;sheetDirty=true}};
}
const remActive=r=>!r.done&&!r.deleted;
const remDue=r=>new Date(r.snoozeUntil||r.when);
const noTime=r=>!r.when;
const isDaily=r=>r.repeat==="day";
const remOver=r=>remActive(r)&&!!r.when&&remDue(r)<=new Date();
const byWhen=(a,b)=>(noTime(a)?Infinity:+remDue(a))-(noTime(b)?Infinity:+remDue(b));

/* ---------- Γραμμές λίστας ---------- */
function whenText(x){
  if(!x.start&&!x.end)return"";
  const f=t=>new Date(t).toLocaleString(LOC(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const hm=t=>new Date(t).toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"});
  if(x.start&&x.end){
    const sd=new Date(x.start),ed=new Date(x.end);
    if(+sd===+ed)return f(x.start);
    return sd.toDateString()===ed.toDateString()?f(x.start)+" – "+hm(x.end):f(x.start)+" → "+f(x.end);
  }
  return x.start?f(x.start):T("έως")+" "+f(x.end);
}

/* ---------- Σήμερα ---------- */
function vToday(){
  const now=new Date(),open=S.tasks.filter(isOpen);
  const waiting=open.filter(isWaiting).sort(byDue);
  const act2=open.filter(x=>!isWaiting(x));
  const late=act2.filter(x=>taskState(x)==="late").sort(byDue);
  const today=act2.filter(x=>!late.includes(x)&&touchesToday(x)).sort(byDue);
  const prog=act2.filter(x=>x.status==="progress"&&!late.includes(x)&&!today.includes(x)&&(x.priority||2)!==3);
  const urgent=act2.filter(x=>(x.priority||2)===3&&!late.includes(x)&&!today.includes(x)).sort(byDue);
  const noDate=act2.filter(x=>!x.start&&!x.end&&x.status!=="progress"&&!urgent.includes(x))
    .sort((a,b)=>S.settings.manualOrder?byDue(a,b):((b.priority||2)-(a.priority||2)||(a.createdAt||0)-(b.createdAt||0)));
  const overR=S.reminders.filter(remOver).sort(byWhen);
  const next=S.reminders.filter(r=>remActive(r)&&!remOver(r)&&!noTime(r))
    .sort((a,b)=>(isDaily(a)-isDaily(b))||byWhen(a,b)).slice(0,4);
  let h=`<div class="today-date">${cap(now.toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"}))}</div>
  <p class="today-sub">${open.length?pl(open.length,"{n} ανοιχτή εργασία","{n} ανοιχτές εργασίες"):T("Καμία ανοιχτή εργασία")}</p>`;
  if(overR.length)h+=sec(T("Έληξαν, δεν τις έχεις διαβάσει"),"red")+`<div class="panel overpanel">${overR.map(remRow).join("")}</div>`;
  h+=`<div class="ctarow">
    <button class="cta2" data-act="pickDest" data-mode="go">${ic("route",26)}<b>${T("Πού πηγαίνεις;")}</b><small>${T("δες τι πιάνεις στο δρόμο")}</small></button>
    <button class="cta2" data-act="jobsMap">${ic("map",26)}<b>${T("Χάρτης δουλειών")}</b><small>${T("πινέζες και παλιότερες μέρες")}</small></button></div>`;
  if(localFile())h+=`<div class="banner warnbar"><span><b>${T("Τρέχει ως τοπικό αρχείο.")}</b> ${T("Η τοποθεσία, οι επαφές και η μόνιμη αποθήκευση δεν δουλεύουν έτσι. Ανέβασε την εφαρμογή στο διαδίκτυο και άνοιξέ τη από τη διεύθυνσή της.")}</span></div>`;
  const hasData=S.clients.length||S.tasks.length||S.reminders.length;
  if(hasData&&S.meta.changes>=S.settings.backupEvery)h+=`<div class="banner"><span>${S.meta.lastBackup?pl(S.meta.changes,"{n} αλλαγή από το τελευταίο αντίγραφο ασφαλείας.","{n} αλλαγές από το τελευταίο αντίγραφο ασφαλείας."):T("Δεν έχεις κρατήσει ακόμα αντίγραφο ασφαλείας.")}</span><button class="btn amber small" data-act="backup">${T("Αντίγραφο τώρα")}</button></div>`;
  if(late.length)h+=sec(T("Εκπρόθεσμες"),"red")+panel(late.map(x=>taskRow(x,true,true)).join(""));
  if(today.length)h+=sec(T("Σήμερα"))+panel(today.map(x=>taskRow(x,true,true)).join(""));
  if(urgent.length)h+=sec(T("Επείγοντα"),"red")+panel(urgent.map(x=>taskRow(x,true,true)).join(""));
  if(prog.length)h+=sec(T("Σε εξέλιξη"))+panel(prog.map(x=>taskRow(x)).join(""));
  if(noDate.length)h+=sec(T("Χωρίς ημερομηνία"))+panel(noDate.map(x=>taskRow(x,true,true)).join(""));
  if(!late.length&&!today.length&&!prog.length&&!noDate.length&&!urgent.length)h+=sec(T("Σήμερα"))+panel(`<div class="empty">${T("Τίποτα για σήμερα. Πάτα + για νέα εργασία, πελάτη ή υπενθύμιση.")}</div>`);
  if(waiting.length)h+=sec(T("Σε αναμονή απάντησης πελάτη"))+panel(waiting.map(x=>taskRow(x,true,true)).join(""));
  h+=sec(T("Επόμενες υπενθυμίσεις"))+panel(next.length?next.map(remRow).join(""):`<div class="empty">${T("Καμία υπενθύμιση. Πάτα το κουδούνι στην κάτω μπάρα για να προσθέσεις.")}</div>`);
  return h;
}

function routeStops(A,B,limit){
  const direct=km(A,B),map=new Map();let noLoc=0;
  S.tasks.filter(isOpen).forEach(x=>{const L=taskLoc(x);if(!L){noLoc++;return}
    const key=L.lat.toFixed(4)+","+L.lng.toFixed(4);if(!map.has(key))map.set(key,{key,loc:L,tasks:[]});map.get(key).tasks.push(x)});
  const stops=[],atDest=[];
  map.forEach(s=>{
    if(km(s.loc,B)<0.2){atDest.push(...s.tasks);return}
    const dA=km(A,s.loc),dB=km(s.loc,B),det=Math.max(0,dA+dB-direct);
    const soon=s.tasks.some(x=>x.end&&new Date(x.end)-Date.now()<86400000);
    if(det<=limit||(soon&&det<=limit*2)){s.detour=det;s.soon=soon;s.pos=dA/((dA+dB)||1);stops.push(s)}
  });
  stops.sort((a,b)=>a.pos-b.pos);
  return{direct,stops,noLoc,atDest};
}

  });
  h+=`<div class="node"><div class="rail"><div class="pin end">${T("Β")}</div></div><div class="body"><div class="title">${esc(B.label)}</div><div class="meta"><span>${T("Προορισμός")}</span></div>${atDest.map(stopTaskBtn).join("")}</div></div></div>`;

const digits=s=>String(s||"").replace(/[^\d+]/g,"").replace(/^(\+|00)30/,"");

  (ct.tel||[]).forEach(p=>{const n=digits(p);if(!n)return;if(/^69/.test(n)){if(!d.mobile)d.mobile=p.trim()}else if(!d.phone)d.phone=p.trim()});

}

/* ---------- Έξυπνη συμπλήρωση εργασίας ---------- */
const nrm1=s=>[...String(s)].map(ch=>ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()||ch).join("");
const LT="[a-zα-ωϊϋ]";
function stemOf(w){w=norm(w);const m=w.match(/^(.{4,}?)(ος|ας|ης|ου|ων|ες|ο|α|η|ι|ς)$/);return m?m[1]:w}
function bestMatch(n,items){let best=null;
  items.forEach(it=>{const ws=norm(it.name).split(/\s+/).filter(Boolean);if(!ws.length)return;
    const re=new RegExp("(^|[^a-zα-ωϊϋ0-9])("+ws.map(w=>escRe(stemOf(w))+LT+"*").join("\\s+")+")");const m=re.exec(n);

let alertQ=[],alertShown=null,lastOver=-1;

function checkDue(){
  const now=new Date(),oc=S.reminders.filter(remOver).length;
  if(oc!==lastOver){lastOver=oc;if(!$("#modal").classList.contains("open"))render()}
  S.reminders.forEach(r=>{

    const due=+remDue(r),rb=Math.max(0,r.remindBefore||0);

  if(!alertShown)showNextAlert();
}

  else{const x=S.tasks.find(y=>y.id===a.id);if(!x)return showNextAlert();const c=x.clientId&&getClient(x.clientId);
    const mins=Math.round((new Date(x.start)-Date.now())/60000);kind=mins>1?T("Η εργασία ξεκινάει σε {n} λεπτά",{n:mins}):T("Ώρα έναρξης εργασίας");title=x.title;

  $("#alertBody").classList.toggle("urgentbox",a.type==="rem"&&!a.pre);
  $("#alert").classList.add("open");beep();

$("#alert").addEventListener("click",e=>{

  const x=a.type==="rem"?S.reminders.find(r=>r.id===a.id):S.tasks.find(y=>y.id===a.id);
  if(x){
    if(a.type==="near"){
      if(act==="done"){route.toPlace=null;const L=taskLoc(x);if(L){route.toPlace={lat:L.lat,lng:L.lng,label:x.title+" ("+L.label+")"};route.to=route.toPlace.label;

const ejCfg=()=>({service:S.settings.ejService||EJ_SERVICE,template:S.settings.ejTemplate||EJ_TEMPLATE,key:S.settings.ejKey||EJ_KEY});
const mailReady=()=>{const c=ejCfg();return !!(c.service&&c.template&&c.key)};
function backupStatus(){const m=S.meta;return(m.lastBackup?T("Τελευταίο αντίγραφο: {d}.",{d:fmt(m.lastBackup)}):T("Δεν έχει κρατηθεί ακόμα αντίγραφο από αυτή τη συσκευή."))+" "+T("Αλλαγές από τότε: {n}.",{n:m.changes})}
function markBackup(){S.meta.changes=0;S.meta.lastBackup=new Date().toISOString();write();render();if($("#bkStatus"))$("#bkStatus").textContent=backupStatus()}
const backupPayload=()=>JSON.stringify(Object.assign({efarmogi:"dromologio",ekdosi:2,dimiourgia:new Date().toISOString()},S));
const fileName=ext=>`dromologio-antigrafo-${toLocalInput(new Date()).slice(0,10)}.${ext}`;
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupPayload()],{type:"application/json"}));
  a.download=fileName("json");document.body.appendChild(a);a.click();a.remove();markBackup();toast(T("Το αρχείο αποθηκεύτηκε στις λήψεις του κινητού."))}
async function sendEmailBackup(silent){
  const s=S.settings;
  if(!mailReady()){if(!silent)toast(T("Η αποστολή στο ταχυδρομείο δεν έχει ενεργοποιηθεί ακόμα στην εφαρμογή."));return false}
  if(!/^\S+@\S+\.\S+$/.test(s.backupEmail)){if(!silent)toast(T("Γράψε σωστό ηλεκτρονικό ταχυδρομείο."));return false}
  const data=backupPayload(),date=new Date().toLocaleString(LOC());
  try{
    const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({service_id:ejCfg().service,template_id:ejCfg().template,user_id:ejCfg().key,template_params:{user_email:s.backupEmail,to_email:s.backupEmail,
        app_name:S.settings.look.title||T("Δρομολόγιο"),subject:T("Αντίγραφο ασφαλείας")+" "+date,date,file_name:fileName("json"),message:data,backup_data:data}})});
    if(r.ok){markBackup();if(!silent)toast(T("Το αντίγραφο στάλθηκε στο {e}.",{e:s.backupEmail}));return true}
    if(!silent)toast(r.status===413?T("Τα δεδομένα είναι πολλά για αποστολή. Χρησιμοποίησε την κοινοποίηση αρχείου."):T("Η αποστολή απέτυχε, κωδικός σφάλματος {c}.",{c:r.status}));
  }catch(e){if(!silent)toast(T("Δεν υπάρχει σύνδεση στο διαδίκτυο. Δοκίμασε ξανά ή αποθήκευσε αρχείο."))}
  return false;
}
let autoTimer=null;
function scheduleAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(async()=>{
  const s=S.settings,m=S.meta;if(!s.autoEmail||!s.backupEmail||!mailReady()||m.changes<s.backupEvery||!navigator.onLine)return;
  if(Date.now()-(m.lastAuto||0)<30*60000)return;m.lastAuto=Date.now();write();
  if(await sendEmailBackup(true))toast(T("Στάλθηκε αυτόματα αντίγραφο στο ταχυδρομείο σου."))},4000)}
function parseBackup(text){
  let s=String(text||"").trim();const i=s.indexOf("{"),j=s.lastIndexOf("}");if(i<0||j<i)return null;s=s.slice(i,j+1);
  let d;try{d=JSON.parse(s)}catch(e){try{d=JSON.parse(s.replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/&#39;/g,"'"))}catch(e2){return null}}
  const find=(o,depth=0)=>{if(!o||typeof o!=="object"||depth>4)return null;
    if(Array.isArray(o.clients)||Array.isArray(o.tasks)||Array.isArray(o.reminders))return o;
    for(const k of Object.keys(o)){let x=o[k];if(typeof x==="string"&&x.trim().startsWith("{")){try{x=JSON.parse(x)}catch(e){x=null}}const r=find(x,depth+1);if(r)return r}return null};
  return find(d);
}
function restoreFrom(text){
  const d=parseBackup(text);if(!d){toast(T("Δεν βρέθηκαν δεδομένα της εφαρμογής σε αυτό το αρχείο."));return}
  const c=(d.clients||[]).length,k=(d.tasks||[]).length,r=(d.reminders||[]).length;
  const hasNow=S.clients.length||S.tasks.length||S.reminders.length;
  if(!confirm(T("Βρέθηκαν {c} πελάτες, {k} εργασίες και {r} υπενθυμίσεις.",{c,k,r})+"\n\n"+(hasNow?T("Θα αντικαταστήσουν τα τωρινά δεδομένα. Συνέχεια;"):T("Να γίνει η επαναφορά;"))))return;
  ["efarmogi","ekdosi","dimiourgia"].forEach(x=>delete d[x]);
  const keepLook=S.settings.look,keepLang=S.settings.lang,hadLook=d.settings&&d.settings.look;
  S=fix(d);if(!hadLook)S.settings.look=keepLook;if(!d.settings||!d.settings.lang)S.settings.lang=keepLang;LANG=S.settings.lang;
  S.meta.changes=0;write();applyLook();closeSheet();view="today";render();toast(T("Τα δεδομένα επαναφέρθηκαν."));
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case"noop":return;
    case"go":if($("#modal").classList.contains("open"))closeSheet();view=el.dataset.view;clientId=null;if(view==="tasks")taskFilter="open";render();window.scrollTo(0,0);break;
    case"openClient":clientId=id;view="client";render();window.scrollTo(0,0);break;
    case"editClient":clientForm(getClient(id));break;
    case"newClient":clientForm();break;
    case"editTask":{const x=S.tasks.find(y=>y.id===id);if(x)taskForm(x);break}
    case"newTask":taskForm(null,el.dataset.client);break;
    case"toggleWait":{const x=S.tasks.find(y=>y.id===id);if(!x)return;
      if(isWaiting(x)){x.status="pending";toast(T("Επέστρεψε στις ενεργές."))}
      else{x.status="waiting";x.waitingSince=Date.now();toast(T("Μπήκε σε αναμονή απάντησης και πήγε στο τέλος."))}
      persist();render();break}
    case"toggleTask":{const x=S.tasks.find(y=>y.id===id);if(!x)return;
      if(x.status==="done"){x.status="pending";x.doneAt=null}else{x.status="done";x.doneAt=Date.now();toast(T("Η εργασία ολοκληρώθηκε."))}persist();render();break}
    case"markPaid":settleTask(id);break;
    case"filter":taskFilter=el.dataset.f;closeSheet();render();break;
    case"moveTask":moveTask(id,el.dataset.dir,el);break;
    case"posTask":posSheet(id);break;
    case"autoOrder":S.settings.manualOrder=false;S.tasks.forEach(x=>x.ord=null);persist();closeSheet();render();toast(T("Επέστρεψε η αυτόματη σειρά."));break;
    case"csort":clientSort=el.dataset.s;closeSheet();render();break;
    case"filterSheet":filterSheet(el.dataset.kind);break;
    case"toggleGroup":groupByArea=!groupByArea;closeSheet();render();break;
    case"period":moneyPeriod=el.dataset.p;closeSheet();render();break;
    case"newEntry":entryForm(null,{kind:el.dataset.kind,client:el.dataset.client,task:el.dataset.task});break;
    case"settleTask":settleTask(id);break;
    case"editEntry":{const e=S.ledger.find(x=>x.id===id);if(e)entryForm(e);break}
    case"newRem":view="reminders";render();setTimeout(()=>$("#r_text")?.focus(),80);break;
    case"importContacts":importContacts();break;
    case"syncContact":syncContact(id);break;
    case"settings":settingsSheet();break;
    case"lang":LANG=LANG==="en"?"el":"en";S.settings.lang=LANG;write();applyLook();render();if($("#modal").classList.contains("open")&&!sheetHasSave)closeSheet();break;
    case"look":lookSheet();break;
    case"notifs":notifSheet();break;
    case"install":doInstall();break;
    case"checkUpdate":checkUpdate();break;
    case"feedback":feedbackSheet();break;
    case"managePeople":peopleSheet();break;
    case"placeEdit":placeSheet(el.dataset.kind,el.dataset.i!=null?+el.dataset.i:null);break;
    case"backup":backupSheet();break;
    case"fab":fabAction();break;
    case"pickDest":destSheet(el.dataset.mode);break;
    case"destPlace":{route.toPlace={lat:+el.dataset.lat,lng:+el.dataset.lng,label:el.dataset.label};route.to=route.toPlace.label;
      closeSheet();view="route";render();window.scrollTo(0,0);calcRoute(true);
      if(!route.result)toast(T("Γράψε από πού ξεκινάς ή όρισε έδρα στις ρυθμίσεις."));break}
    case"destTask":{const x=S.tasks.find(y=>y.id===id),L=x&&taskLoc(x);if(!L)return;
      route.toPlace={lat:L.lat,lng:L.lng,label:x.title+" ("+L.label+")"};route.to=route.toPlace.label;closeSheet();view="route";render();window.scrollTo(0,0);calcRoute(true);
      if(!route.result)toast(T("Γράψε από πού ξεκινάς ή όρισε έδρα στις ρυθμίσεις."));break}
    case"jobsMap":openJobsMap();break;
    case"otherDest":closeSheet();route.toPlace=null;route.to="";view="route";render();window.scrollTo(0,0);
      setTimeout(()=>{const el=$("#rTo");if(el){el.focus();el.select&&el.select()}},120);break;
    case"showMe":getPos(p=>{myPos=p;openMapPicker(p,null,q=>{route.fromGeo={...q,label:MYLOC()};route.from=MYLOC();render();toast(T("Αφετηρία το σημείο που διάλεξες."))})});break;
    case"geoFrom":
      if(route.fromGeo&&baseLoc()){route.fromGeo=null;route.from=baseLoc().label;$("#rFrom").value=route.from;toast(T("Αφετηρία: {b}.",{b:route.from}));break}
      getPos(p=>{route.fromGeo={...p,label:MYLOC()};route.from=MYLOC();$("#rFrom").value=MYLOC();toast(T("Αφετηρία η θέση σου."))});break;
    case"calcRoute":{el.classList.add("busy");setTimeout(()=>el.classList.remove("busy"),260);calcRoute();
      const r=$("#routeRes");if(r&&r.firstChild)setTimeout(()=>r.scrollIntoView({behavior:"smooth",block:"start"}),80);break}
    case"toggleStop":{const k=el.dataset.key;route.off.has(k)?route.off.delete(k):route.off.add(k);$("#routeRes").innerHTML=routeResultHTML();break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(jobsMapOpen())closeJobsMap();else if(mapOpen())closeMap();else if($("#modal").classList.contains("open"))cancelSheet()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();checkDue()}});

/* ---------- Κουμπί «πίσω» του κινητού ---------- */
// Το Chrome προσπερνά εγγραφές ιστορικού που μπήκαν χωρίς άγγιγμα, γι' αυτό τις προσθέτουμε όταν αγγίζεις την οθόνη.
const BUF=3;let depth=0,leaving=false;
history.replaceState({g:0},"");
function topUp(){if(leaving||$("#exitDlg").classList.contains("open"))return;while(depth<BUF){depth++;history.pushState({g:depth},"")}}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,topUp,true));
window.addEventListener("popstate",e=>{
  depth=e.state&&typeof e.state.g==="number"?e.state.g:0;
  if(leaving)return;
  if($("#exitDlg").classList.contains("open")){$("#exitDlg").classList.remove("open");return}
  if(jobsMapOpen()){closeJobsMap();return}
  if(mapOpen()){closeMap();return}
  if($("#alert").classList.contains("open"))return;
  if($("#modal").classList.contains("open")){cancelSheet();return}
  if(view==="client"){view="clients";clientId=null;render();return}
  if(view!=="today"){view="today";clientId=null;render();window.scrollTo(0,0);return}
  $("#exitT").textContent=T("Έξοδος από την εφαρμογή;");$("#exitS").textContent=T("Τα δεδομένα σου μένουν αποθηκευμένα.");
  $("#exitNo").textContent=T("Όχι");$("#exitYes").textContent=T("Ναι, έξοδος");$("#exitDlg").classList.add("open");
});
$("#exitNo").onclick=()=>{$("#exitDlg").classList.remove("open");topUp()};
$("#exitYes").onclick=()=>{leaving=true;$("#exitDlg").classList.remove("open");const d=depth;history.go(-(d+1));
  setTimeout(()=>{if(d>0)history.go(-d);setTimeout(()=>{leaving=false;toast(T("Πάτα ξανά το πίσω για να βγεις."))},350)},450)};

/* ---------- Πληκτρολόγιο: κρατάμε ορατά τα κουμπιά του φύλλου ---------- */
const vv=window.visualViewport;
function fitViewport(){
  const R=document.documentElement.style;
  R.setProperty("--vvh",(vv?vv.height:window.innerHeight)+"px");
  const m=$("#modal");
  if(vv&&m.classList.contains("open")){m.style.height=vv.height+"px";m.style.top=vv.offsetTop+"px";m.style.bottom="auto"}
  else{m.style.height="";m.style.top="";m.style.bottom=""}
}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;
  if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))document.body.classList.remove("typing")},60));
if(vv){vv.addEventListener("resize",fitViewport);vv.addEventListener("scroll",fitViewport)}
window.addEventListener("resize",fitViewport);
document.addEventListener("focusin",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))document.body.classList.add("typing");
  if(!$("#modal").classList.contains("open"))return;
  fitViewport();
  const el=e.target;
  if(el&&el.closest&&el.closest("#shBody"))setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),280);
});
// στις κανονικές προβολές: το πεδίο που γράφεις ανεβαίνει πάνω από το πληκτρολόγιο
function keepVisible(el){
  if(!el||!el.getBoundingClientRect)return;
  fitViewport();
  const r=el.getBoundingClientRect(),vh=(vv?vv.height:innerHeight),hdr=$("header").getBoundingClientRect().height+8;
  if(r.bottom>vh-14||r.top<hdr)el.scrollIntoView({block:"center",behavior:"smooth"});
}
document.addEventListener("focusin",e=>{
  const el=e.target;
  if(!el||!el.closest||!el.closest("main"))return;
  if(!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return;
  [180,420,700].forEach(t=>setTimeout(()=>keepVisible(el),t));
});
const _openSheet=openSheet,_closeSheet=closeSheet;
openSheet=function(o){_openSheet(o);fitViewport()};
closeSheet=function(){_closeSheet();fitViewport()};

/* ---------- «Θύμισέ μου όταν φτάσω κοντά» ---------- */
let watchId=null,myPos=null;
const nearTasks=()=>S.tasks.filter(x=>isOpen(x)&&x.nearAlert>0&&taskLoc(x));
function updateWatch(){
  const want=nearTasks().length>0&&navigator.geolocation&&window.isSecureContext&&!geoBlockedByFrame();
  if(want&&watchId==null){
    watchId=navigator.geolocation.watchPosition(p=>{
      myPos={lat:p.coords.latitude,lng:p.coords.longitude};checkNear();
    },()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
  }else if(!want&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
}
function checkNear(){
  if(!myPos)return;
  nearTasks().forEach(x=>{
    const L=taskLoc(x),d=km(myPos,L)/1.3*1000; // πραγματική ευθεία απόσταση σε μέτρα
    if(d<=x.nearAlert){
      if(x.nearFired&&Date.now()-x.nearFired<2*3600000)return;
      x.nearFired=Date.now();write();
      const c=x.clientId&&getClient(x.clientId);
      const title=T("Είσαι κοντά: {a}",{a:L.label});
      const body=x.title+(c?" — "+c.name:"");
      playSound();if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
      phoneNotify(title,body,"near-"+x.id);
      alertQ.push({type:"near",id:x.id});if(!alertShown)showNextAlert();
    }else if(x.nearFired&&d>x.nearAlert*1.6){x.nearFired=0;write()}
  });
}
setInterval(()=>{updateWatch();checkNear()},45000);

function offerDraft(){
  const d=getDraft();if(!d||d.kind!=="task"||!d.data)return;
  const t=d.data.title||T("χωρίς τίτλο");
  if(confirm(T("Είχες ξεκινήσει μια εργασία («{t}») και δεν αποθηκεύτηκε. Να συνεχίσεις;",{t:t}))){taskForm(null,null,d.data)}
  else clearDraft();
}
applyLook();render();checkDue();fitViewport();updateWatch();setTimeout(offerDraft,700);
initSW();
setInterval(checkDue,15000);
</script>
