<style>
  :root{
    --steel:#22303c;
    --steel-2:#33465a;
    --amber:#e8a33d;
    --paper:#eceff3;
    --panel:#ffffff;
    --line:#d9dfe6;
    --ink:#16191d;
    --mute:#68737f;
    --alert:#b5432c;
    --ok:#2c7a52;
    --warn:#a8781a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    padding-bottom:78px;
  }
  header{
    background:var(--steel);color:#fff;
    padding:12px 14px 10px;
    position:sticky;top:0;z-index:40;
  }
  header .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.5px}
  header .ver{font-size:11px;color:#9fb0c0;font-weight:500}
  header .sub{font-size:12.5px;color:#a9bccd;margin-top:1px}
  .stripe{height:6px;background:repeating-linear-gradient(45deg,var(--amber) 0 11px,var(--steel) 11px 22px)}
  main{padding:12px 12px 20px;max-width:720px;margin:0 auto}
  h2{font-size:17px;margin:2px 0 10px;font-weight:700}
  h3{font-size:14.5px;margin:0 0 6px;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .card.tight{padding:10px}
  label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px;font-weight:600}
  input,select,textarea{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--steel-2);outline-offset:1px}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  button{
    font-family:inherit;font-size:15px;font-weight:600;border-radius:8px;
    padding:11px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--amber);border-color:#cf8d28;color:#2a1f08}
  button.dark{background:var(--steel);border-color:var(--steel);color:#fff}
  button.danger{background:#fff;border-color:#e0b6ae;color:var(--alert)}
  button.small{font-size:13px;padding:7px 10px;font-weight:600}
  button.wide{width:100%}
  .btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btnrow>button{flex:1;min-width:120px}
  .muted{color:var(--mute);font-size:13px}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--mute);font-size:14px}
  .tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;background:#eef2f6;color:var(--steel-2);border:1px solid var(--line);font-weight:600;margin:0 4px 4px 0}
  .plate{
    display:inline-block;font-weight:700;letter-spacing:1.2px;font-size:14px;
    background:#fff;border:2px solid var(--steel);border-radius:5px;padding:1px 7px;
    border-left:9px solid #1d4ea8;
  }
  .plate.bad{border-color:var(--alert);color:var(--alert);border-left-color:var(--alert)}
  .redbox{
    background:var(--alert);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
    border:none;width:100%;font-size:15px;font-weight:700;text-align:left;
  }
  .amberbox{background:#fdf8ec;color:var(--warn);border:1px solid #e6d0a3}
  .overlay{
    position:fixed;inset:0;z-index:80;background:rgba(20,26,32,.55);
    display:flex;align-items:flex-end;justify-content:center;padding:0;
  }
  .sheet{
    background:var(--panel);width:100%;max-width:720px;max-height:82vh;overflow:auto;
    border-radius:14px 14px 0 0;padding:14px 14px 18px;
  }
  .sheet h3{font-size:17px;margin-bottom:10px}
  .alertbox{border-left:4px solid var(--alert);background:#fdf3f1;border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13.5px}
  .alertbox.soon{border-left-color:var(--warn);background:#fdf8ec}
  .rowline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eef1f4;font-size:14px}
  .rowline:last-child{border-bottom:none}
  .rowline b{font-weight:700}
  .big{font-size:26px;font-weight:700;line-height:1.1}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}
  .stat .lab{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
  .chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14.5px}
  .chk input{width:20px;height:20px;flex:0 0 auto;margin-top:2px}
  .subtabs{display:flex;gap:6px;margin-bottom:10px}
  .subtabs button{flex:1;background:#e2e7ed;border-color:#e2e7ed;font-size:14px;padding:9px}
  .subtabs button.on{background:var(--steel);border-color:var(--steel);color:#fff}
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--steel);display:grid;grid-template-columns:repeat(6,1fr);
    border-top:3px solid var(--amber);padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    background:none;border:none;border-radius:0;color:#9fb0c0;
    font-size:10px;font-weight:600;padding:9px 1px 10px;line-height:1.2;
  }
  nav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--amber)}
  .head-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  details.veh{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  details.veh>summary{padding:12px;cursor:pointer;font-weight:700;list-style:none}
  details.veh>summary::-webkit-details-marker{display:none}
  details.veh .body{padding:0 12px 12px}
  @media (prefers-reduced-motion:no-preference){
    button{transition:filter .12s ease}
    button:active{filter:brightness(.93)}
  }
</style>
</head>

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);

function fmtDate(d){
  if(!d) return "—";
  const p = d.split("-");
  if(p.length !== 3) return d;
  return p[2] + "/" + p[1] + "/" + p[0];
}
function daysLeft(d){
  if(!d) return null;
  const t = new Date(today()+"T00:00:00");
  const x = new Date(d+"T00:00:00");
  return Math.round((x - t) / 86400000);
}
function dur(a,b){
  if(!a || !b) return 0;
  const pa = a.split(":"), pb = b.split(":");
  let m = (+pb[0]*60 + +pb[1]) - (+pa[0]*60 + +pa[1]);
  if(m < 0) m += 1440;
  return m;
}
function hhmm(mins){
  if(!mins) return "0:00";
  const h = Math.floor(mins/60), m = mins%60;
  return h + ":" + String(m).padStart(2,"0");
}
function num(v){ const n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? 0 : n; }
function tripKm(t){
  if(t.kmEnd && t.kmStart) return Math.max(0, num(t.kmEnd) - num(t.kmStart));
  return num(t.km);
}
function tripTons(t){
  const q = num(t.qty);
  if(!q) return 0;
  if(t.unit === "τόνοι") return q;
  if(t.unit === "κιλά") return q/1000;
  return 0;
}
function tripTonneKm(t){ return tripTons(t) * tripKm(t); }
function emptyDb(){ return {vehicles:[], drivers:[], trips:[], services:[], places:TOPOI_ARXIKA.slice(), cargos:EMPOREUMATA_ARXIKA.slice(), shops:SYNERGEIA_ARXIKA.slice(), brands:MARKES_ARXIKA.slice(), models:MONTELA_ARXIKA.slice(), fuels:[], stations:PRATIRIA_ARXIKA.slice(), pin:"1234", assum:{years:"8", resid:"20", fuelGain:"15", maintNew:"25", escal:"15"}}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return emptyDb();
    const d = JSON.parse(raw);
    return Object.assign(emptyDb(), d);
  }catch(e){ return emptyDb(); }
}

function Field({label, children}){
  return <div><label>{label}</label>{children}</div>;
}
function Sheet({title, onClose, children}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <h3>{title}</h3>
        {children}
        <button className="dark wide" style={{marginTop:10}} onClick={onClose}>Κλείσιμο</button>
      </div>
    </div>
  );
}
function Plate({v}){ return <span className="plate">{v}</span>; }
function Empty({t}){ return <div className="empty">{t}</div>; }

function ListSelect({value, onChange, items, onAdd, addLabel}){
  return (
    <select value={value||""} onChange={e=>{
      const val = e.target.value;
      if(val === "__new"){
        const n = prompt(addLabel + " (αποθηκεύεται μόνιμα στη λίστα):");
        if(n && n.trim()){ onAdd(n.trim()); onChange(n.trim()); }
        return;
      }
      onChange(val);
    }}>
      <option value="">— διάλεξε —</option>
      {items.map(p=><option key={p} value={p}>{p}</option>)}
      {value && items.indexOf(value) < 0 ? <option value={value}>{value}</option> : null}
      <option value="__new">+ {addLabel}…</option>
    </select>
  );
}

  const toggle = (p) => setF(prev => {
    const has = prev.problems.indexOf(p) >= 0;
    return Object.assign({}, prev, {problems: has ? prev.problems.filter(x=>x!==p) : prev.problems.concat([p])});
  });

    <div className="card">
      <h3>{f.id ? "Επεξεργασία δρομολογίου" : "Νέο δρομολόγιο"}</h3>

            {db.vehicles.map(v=><option key={v.id} value={v.id}>{v.plate} · {v.brand}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Οδηγός">
        <select value={f.driverId} onChange={e=>set("driverId",e.target.value)}>
          <option value="">— διάλεξε —</option>
          {db.drivers.filter(d=>!d.left).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </Field>
      <Field label="Από"><ListSelect value={f.from} onChange={v=>set("from",v)} items={db.places||[]} onAdd={onAddPlace} addLabel="Νέος τόπος" /></Field>
      <Field label="Προς"><ListSelect value={f.to} onChange={v=>set("to",v)} items={db.places||[]} onAdd={onAddPlace} addLabel="Νέος τόπος" /></Field>
      <div className="grid2">
        <Field label="Ώρα αναχώρησης"><input type="time" value={f.timeStart} onChange={e=>set("timeStart",e.target.value)} /></Field>
        <Field label="Ώρα επιστροφής"><input type="time" value={f.timeEnd} onChange={e=>set("timeEnd",e.target.value)} /></Field>
        <Field label="Χιλιόμετρα αναχώρησης"><input type="number" inputMode="numeric" value={f.kmStart} onChange={e=>set("kmStart",e.target.value)} /></Field>
        <Field label="Χιλιόμετρα επιστροφής"><input type="number" inputMode="numeric" value={f.kmEnd} onChange={e=>set("kmEnd",e.target.value)} /></Field>
      </div>
      {f.kmStart && f.kmEnd ? <div className="muted">Διαδρομή: {Math.max(0,num(f.kmEnd)-num(f.kmStart))} χλμ{f.timeStart&&f.timeEnd?" · Διάρκεια "+hhmm(dur(f.timeStart,f.timeEnd)):""}</div> : null}

      <Field label="Εμπόρευμα"><ListSelect value={f.cargo} onChange={v=>set("cargo",v)} items={db.cargos||[]} onAdd={onAddCargo} addLabel="Νέο είδος" /></Field>
      <div className="grid2">
        <Field label="Ποσότητα"><input type="number" inputMode="decimal" value={f.qty} onChange={e=>set("qty",e.target.value)} /></Field>

function TripCard({t, db, onEdit, onDel}){
  const v = db.vehicles.find(x=>x.id===t.vehicleId);
  const d = db.drivers.find(x=>x.id===t.driverId);
  const km = tripKm(t), mins = dur(t.timeStart,t.timeEnd);
  return (
    <div className="card tight">
      <div className="head-actions" style={{marginBottom:6}}>
        <div><b>{fmtDate(t.date)}</b> <span className="muted">{d?d.name:"—"}</span></div>
        {v ? <Plate v={v.plate} /> : null}
      </div>
      <div style={{fontSize:15,fontWeight:600}}>{t.from||"—"} → {t.to||"—"}</div>
      <div className="muted" style={{marginTop:2}}>
        {t.cargo||"Χωρίς εμπόρευμα"}{t.qty?" · "+t.qty+" "+t.unit:""}{t.recipient?" · "+t.recipient:""}
      </div>
      <div style={{marginTop:6}}>
        {mins?<span className="tag">Διάρκεια {hhmm(mins)}</span>:null}
        {km?<span className="tag">{km} χλμ</span>:null}
        {tripTonneKm(t)?<span className="tag">{Math.round(tripTonneKm(t)).toLocaleString("el-GR")} τχλμ</span>:null}
        {(t.timeStart&&t.timeEnd)?<span className="tag">{t.timeStart}–{t.timeEnd}</span>:null}
      </div>
      {t.problems && t.problems.length ? (
        <div className="alertbox" style={{marginTop:8}}>
          <b>Προβλήματα:</b> {t.problems.join(", ")}{t.note?" — "+t.note:""}
        </div>
      ) : (t.note ? <div className="muted" style={{marginTop:6}}>{t.note}</div> : null)}
      <div className="btnrow" style={{marginTop:8}}>
        <button className="small" onClick={onEdit}>Επεξεργασία</button>
        <button className="small danger" onClick={onDel}>Διαγραφή</button>
      </div>
    </div>
  );
}

function TripsTab({db, setDb}){
  const [form,setForm] = useState(null);
  const [fVeh,setFVeh] = useState("");
  const list = useMemo(()=>{
    let l = db.trips.slice().sort((a,b)=> (b.date+ (b.timeStart||"")).localeCompare(a.date+(a.timeStart||"")));
    if(fVeh) l = l.filter(t=>t.vehicleId===fVeh);
    return l;
  },[db.trips,fVeh]);

  const save = (t) => {
    setDb(d=>{
      const trips = t.id && d.trips.some(x=>x.id===t.id) ? d.trips.map(x=>x.id===t.id?t:x) : d.trips.concat([t]);
      const vehicles = d.vehicles.map(v=>{
        if(v.id!==t.vehicleId) return v;
        const k = num(t.kmEnd);
        return k > num(v.km) ? Object.assign({},v,{km:String(k)}) : v;
      });
      return Object.assign({},d,{trips,vehicles});
    });
    setForm(null);
  };

  const addPlace = (n) => setDb(d => (d.places||[]).indexOf(n)>=0 ? d : Object.assign({},d,{places:(d.places||[]).concat([n])}));
  const addCargo = (n) => setDb(d => (d.cargos||[]).indexOf(n)>=0 ? d : Object.assign({},d,{cargos:(d.cargos||[]).concat([n])}));

  if(form) return <TripForm db={db} init={form.id?form:null} onSave={save} onCancel={()=>setForm(null)} onAddPlace={addPlace} onAddCargo={addCargo} />;

  return (
    <div>
      <div className="head-actions">
        <h2 style={{margin:0}}>Δρομολόγια</h2>
        <button className="primary small" onClick={()=>setForm({})}>+ Νέο</button>
      </div>
      {db.vehicles.length ? (
        <select value={fVeh} onChange={e=>setFVeh(e.target.value)} style={{marginBottom:10}}>
          <option value="">Όλα τα οχήματα</option>
          {db.vehicles.map(v=><option key={v.id} value={v.id}>{v.plate}</option>)}
        </select>
      ) : null}
      {list.length===0 ? <Empty t="Δεν υπάρχουν καταχωρημένα δρομολόγια. Πάτησε «+ Νέο» για το πρώτο." /> :
        list.map(t=>(
          <TripCard key={t.id} t={t} db={db}
            onEdit={()=>setForm(t)}
            onDel={()=>{ if(confirm("Διαγραφή δρομολογίου;")) setDb(d=>Object.assign({},d,{trips:d.trips.filter(x=>x.id!==t.id)})); }} />
        ))
      }
    </div>
  );
}

function VehicleSheet({v, db, onClose}){
  const epi = epikindynotita(v, db.trips);
  const trips = db.trips.filter(t=>t.vehicleId===v.id).sort((a,b)=>b.date.localeCompare(a.date));
  const servs = db.services.filter(x=>x.vehicleId===v.id).sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <Sheet title={v.plate + " — " + v.brand + " " + v.model} onClose={onClose}>
      <StopBanner s={epi} />
      <div style={{marginBottom:8}}>
        <Score title="Αντικατάσταση" s={replacementScore(db, v)} onClick={()=>{}} />
        <Score title="Επικινδυνότητα" s={epi} onClick={()=>{}} />
      </div>
      <div className="rowline"><span>Κατηγορία</span><b>{v.category}</b></div>
      {v.payload ? <div className="rowline"><span>Ωφέλιμο φορτίο</span><b>{num(v.payload).toLocaleString("el-GR")} κιλά</b></div> : null}
      {v.firstReg ? <div className="rowline"><span>Πρώτη άδεια κυκλοφορίας</span><b>{fmtDate(v.firstReg)}</b></div> : null}
      {v.year ? <div className="rowline"><span>Έτος</span><b>{v.year}</b></div> : null}
      <div className="rowline"><span>Χιλιόμετρα</span><b>{num(v.km).toLocaleString("el-GR")}</b></div>

      <h3 style={{marginTop:14}}>Ανά τονοχιλιόμετρο</h3>
      <EconRows e={vehicleEconomy(db, v)} />

      <h3 style={{marginTop:14}}>Έγγραφα</h3>
      {EGGRAFA.map(d=>{
        const val = (v.docs||{})[d.k];
        const dl = val ? daysLeft(val) : null;
        return (
          <div className="rowline" key={d.k}>
            <span>{d.n}</span>
            <b style={val ? (dl<0?{color:"var(--alert)"}:(dl<=30?{color:"var(--warn)"}:null)) : {color:"var(--mute)"}}>
              {val ? fmtDate(val) + (dl<0 ? " — έληξε" : " — " + dl + " ημ.") : "δεν έχει δηλωθεί"}
            </b>
          </div>
        );
      })}

      <h3 style={{marginTop:14}}>Λάδια</h3>
      {oilStatus(v).length===0 ? <div className="muted">Δεν έχει οριστεί πρόγραμμα.</div> :
        oilStatus(v).map((o,i)=>(
          <div className="rowline" key={i}>
            <span>Επόμενη αλλαγή</span>
            <b style={o.left<0?{color:"var(--alert)"}:null}>{o.next}{o.left<0?" — πέρασε":" — απομένουν "+o.left+" "+o.unit}</b>
          </div>
        ))
      }

      <h3 style={{marginTop:14}}>Τελευταίες εργασίες</h3>
      {servs.length===0 ? <div className="muted">Καμία καταχώρηση.</div> :
        servs.slice(0,4).map(x=>(
          <div className="rowline" key={x.id}>
            <span>{fmtDate(x.date)}<div className="muted" style={{fontSize:12}}>{(x.items||[]).join(", ")}</div></span>
            <b>{x.cost?num(x.cost).toLocaleString("el-GR")+" €":""}</b>
          </div>
        ))
      }

      <h3 style={{marginTop:14}}>Τελευταία δρομολόγια</h3>
      {trips.length===0 ? <div className="muted">Κανένα δρομολόγιο.</div> :
        trips.slice(0,5).map(t=>{
          const dr = db.drivers.find(x=>x.id===t.driverId);
          return (
            <div className="rowline" key={t.id}>
              <span>{fmtDate(t.date)} · {t.to}
                <div className="muted" style={{fontSize:12}}>{t.cargo}{dr?" · "+dr.name:""}</div>
              </span>
              <b>{tripKm(t)?tripKm(t)+" χλμ":""}</b>
            </div>
          );
        })
      }
    </Sheet>
  );
}

function ScoreSheet({title, s, expl, onClose}){
  return (
    <Sheet title={title} onClose={onClose}>
      <div className="big" style={{color:s.lvl==="bad"||s.lvl==="stop"?"var(--alert)":"var(--ink)"}}>{s.p}% — {s.lab}</div>
      <h3 style={{marginTop:12}}>Από τι προκύπτει</h3>
      {(s.why||[]).length===0 ? <div className="muted">Καμία επιβάρυνση.</div> :
        (s.why||[]).map((w,i)=><div className="rowline" key={i}><span>{w}</span></div>)}
      <h3 style={{marginTop:14}}>Πώς υπολογίζεται</h3>
      <p className="muted" style={{marginTop:0}}>{expl}</p>
    </Sheet>
  );
}

const AXONES = [
  {k:"safe", n:"Ασφαλής οδήγηση και συμπεριφορά"},
  {k:"time", n:"Τήρηση προγράμματος και ωραρίου"},
  {k:"care", n:"Φροντίδα και καθαριότητα οχήματος"},
  {k:"proc", n:"Τήρηση διαδικασιών και μέσων ατομικής προστασίας"},
  {k:"team", n:"Συνεργασία και επικοινωνία"},
  {k:"doc", n:"Πληρότητα καταγραφών και παραστατικών"}
];

function DriverConfSheet({dr, db, onSave, onClose}){
  const [c,setC] = useState(Object.assign({notes:"", scores:{}, updated:""}, dr.conf||{}));
  const setScore = (k,v)=>setC(p=>Object.assign({},p,{scores:Object.assign({},p.scores,{[k]:v})}));
  const vals = AXONES.map(a=>num(c.scores[a.k])).filter(x=>x>0);
  const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20) : null;
  return (
    <Sheet title={"Εμπιστευτικό — " + dr.name} onClose={onClose}>
      <p className="muted" style={{marginTop:0}}>Ορατό μόνο σε όποιον ξέρει τον κωδικό διαχειριστή. Δεν εμφανίζεται πουθενά αλλού στην εφαρμογή.</p>
      {avg !== null ? <div className="big" style={{marginBottom:8}}>{avg}/100 <span style={{fontSize:13,fontWeight:600,color:"var(--mute)"}}>συνολική αξιολόγηση</span></div> : null}
      {AXONES.map(a=>(
        <div key={a.k} style={{margin:"8px 0"}}>
          <div style={{fontSize:14,fontWeight:600}}>{a.n}</div>
          <div style={{display:"flex",gap:6,marginTop:4}}>
            {[1,2,3,4,5].map(n=>(
              <button key={n} className="small" style={num(c.scores[a.k])===n?{background:"var(--steel)",color:"#fff",borderColor:"var(--steel)",flex:1}:{flex:1}}
                onClick={()=>setScore(a.k,n)}>{n}</button>
            ))}
          </div>
        </div>
      ))}
      <div className="muted" style={{fontSize:12}}>1 = χρειάζεται άμεση παρέμβαση, 3 = ανταποκρίνεται, 5 = υποδειγματικός.</div>
      <label>Εμπιστευτικές σημειώσεις</label>
      <textarea value={c.notes} onChange={e=>setC(p=>Object.assign({},p,{notes:e.target.value}))} placeholder="Παρατηρήσεις, συμβάντα, συζητήσεις" />
      {c.updated ? <div className="muted" style={{marginTop:6}}>Τελευταία ενημέρωση: {fmtDate(c.updated)}</div> : null}
      <div className="btnrow">
        <button className="primary" onClick={()=>{ onSave(Object.assign({},c,{updated:today()})); }}>Αποθήκευση</button>
      </div>
    </Sheet>
  );
}

function FleetTab({db,setDb}){
  const [sub,setSub] = useState("v");
  const [vf,setVf] = useState(null);
  const [df,setDf] = useState(null);
  const [vFil,setVFil] = useState("all");
  const [vSort,setVSort] = useState("risk");
  const [dFil,setDFil] = useState("active");
  const [sheet,setSheet] = useState(null);
  const [dSort,setDSort] = useState("name");

  const saveV = (v)=>{ setDb(d=>Object.assign({},d,{vehicles: d.vehicles.some(x=>x.id===v.id)? d.vehicles.map(x=>x.id===v.id?v:x) : d.vehicles.concat([v])})); setVf(null); };
  const saveD = (v)=>{ setDb(d=>Object.assign({},d,{drivers: d.drivers.some(x=>x.id===v.id)? d.drivers.map(x=>x.id===v.id?v:x) : d.drivers.concat([v])})); setDf(null); };

  const addToList = (key, n) => setDb(d => (d[key]||[]).indexOf(n)>=0 ? d : Object.assign({},d,{[key]:(d[key]||[]).concat([n])}));

  if(vf) return <VehicleForm db={db} init={vf.id?vf:null} onSave={saveV} onCancel={()=>setVf(null)} onAdd={addToList} />;
  if(df) return <DriverForm init={df.id?df:null} onSave={saveD} onCancel={()=>setDf(null)} />;

  return (
    <div>
      {sheet && sheet.t==="conf" ? <DriverConfSheet dr={sheet.dr} db={db}
        onSave={(c)=>{ setDb(d=>Object.assign({},d,{drivers:d.drivers.map(x=>x.id===sheet.dr.id?Object.assign({},x,{conf:c}):x)})); setSheet(null); }}
        onClose={()=>setSheet(null)} /> : null}
      {sheet && sheet.t==="veh" ? <VehicleSheet v={sheet.v} db={db} onClose={()=>setSheet(null)} /> : null}
      {sheet && sheet.t==="repl" ? <ReplSheet v={sheet.v} db={db} onClose={()=>setSheet(null)} /> : null}
      {sheet && sheet.t==="econ" ? <EconSheet subj={sheet.subj} kind={sheet.kind} db={db} onClose={()=>setSheet(null)} /> : null}
      {sheet && sheet.t==="epi" ? <ScoreSheet title={"Επικινδυνότητα — " + sheet.v.plate} s={epikindynotita(sheet.v, db.trips)} expl={EXPL_EPI} onClose={()=>setSheet(null)} /> : null}
      <h2>Στόλος</h2>
      <div className="subtabs">
        <button className={sub==="v"?"on":""} onClick={()=>setSub("v")}>Οχήματα</button>
        <button className={sub==="d"?"on":""} onClick={()=>setSub("d")}>Οδηγοί</button>
      </div>

      {sub==="v" ? (
        <div>
          <button className="primary wide" onClick={()=>setVf({})} style={{marginBottom:10}}>+ Νέο όχημα</button>
          {db.vehicles.length ? (
            <div className="card tight">
              <div className="grid2">
                <Field label="Δείξε">
                  <select value={vFil} onChange={e=>setVFil(e.target.value)}>
                    <option value="all">Όλα τα οχήματα</option>
                    <option value="expired">Με ληγμένα χαρτιά</option>
                    <option value="soon">Λήξεις μέσα σε 30 ημέρες</option>
                    <option value="risk">Υψηλή επικινδυνότητα</option>
                    <option value="old">Ώριμα για αντικατάσταση</option>
                    <option value="oil">Λάδια που πέρασαν</option>
                    <option value="km">Πάνω από 300.000 χλμ</option>
                  </select>
                </Field>
                <Field label="Ταξινόμηση">
                  <select value={vSort} onChange={e=>setVSort(e.target.value)}>
                    <option value="risk">Επικινδυνότητα</option>
                    <option value="age">Δείκτης αντικατάστασης</option>
                    <option value="km">Χιλιόμετρα</option>
                    <option value="expiry">Πλησιέστερη λήξη</option>
                    <option value="plate">Πινακίδα</option>
                  </select>
                </Field>
              </div>
            </div>
          ) : null}
          {db.vehicles.length===0 ? <Empty t="Καταχώρησε το πρώτο όχημα με πινακίδα, μάρκα και κατηγορία." /> :
            (function(){
              let list = db.vehicles.slice();
              list = list.filter(v=>{
                const st = docState(v, EGGRAFA);
                if(vFil==="expired") return st.expired>0;
                if(vFil==="soon") return st.soon>0;
                if(vFil==="risk") return epikindynotita(v, db.trips).p >= 50;
                if(vFil==="old") return replacementScore(db, v).p >= 55;
                if(vFil==="oil") return oilStatus(v).some(o=>o.left<0);
                if(vFil==="km") return num(v.km) > 300000;
                return true;
              });
              list.sort((a,b)=>{
                if(vSort==="risk") return epikindynotita(b,db.trips).p - epikindynotita(a,db.trips).p;
                if(vSort==="age") return replacementScore(db,b).p - replacementScore(db,a).p;
                if(vSort==="km") return num(b.km) - num(a.km);
                if(vSort==="expiry"){
                  const na = docState(a,EGGRAFA).nearest, nb = docState(b,EGGRAFA).nearest;
                  return (na===null?99999:na) - (nb===null?99999:nb);

              if(!list.length) return <Empty t="Κανένα όχημα δεν ταιριάζει με αυτό το φίλτρο." />;

                  </div>
                  <div style={{fontWeight:700}}>{v.brand} {v.model}</div>
                  <div className="muted">{v.category}{v.payload?" · ωφέλιμο "+v.payload+" κιλά":""}</div>
                  <div style={{marginTop:6}}>
                    <span className="tag">{num(v.km).toLocaleString("el-GR")} χλμ</span>
                    <span className="tag">{trips.length} δρομολόγια</span>
                  </div>
                  <div>
                    <Score title="Αντικατάσταση" s={replacementScore(db, v)} onClick={()=>setSheet({t:"repl", v:v})} />
                    <Score title="Επικινδυνότητα" s={epikindynotita(v, db.trips)} onClick={()=>setSheet({t:"epi", v:v})} />
                  </div>
                  <StopBanner s={epikindynotita(v, db.trips)} />
                  {v.notes?<div className="muted" style={{marginTop:6}}>{v.notes}</div>:null}
                  <div className="btnrow" style={{marginTop:8}}>
                    <button className="small dark" onClick={()=>setSheet({t:"veh", v:v})}>Δες τα πάντα</button>
                    <button className="small" onClick={()=>setSheet({t:"econ", kind:"v", subj:v})}>Οικονομικά</button>
                    <button className="small" onClick={()=>setVf(v)}>Επεξεργασία</button>

              <div className="grid2">
                <Field label="Δείξε">
                  <select value={dFil} onChange={e=>setDFil(e.target.value)}>
                    <option value="active">Ενεργοί</option>
                    <option value="all">Όλοι</option>
                    <option value="expired">Με ληγμένα πιστοποιητικά</option>
                    <option value="soon">Λήξεις μέσα σε 30 ημέρες</option>
                    <option value="adr">Με ισχύον ΑΔΡ</option>
                    <option value="xeiristis">Χειριστές μηχανημάτων έργου</option>
                    <option value="left">Αποχωρήσαντες</option>
                  </select>
                </Field>
                <Field label="Ταξινόμηση">
                  <select value={dSort} onChange={e=>setDSort(e.target.value)}>
                    <option value="name">Όνομα</option>
                    <option value="expiry">Πλησιέστερη λήξη</option>
                    <option value="exp">Χρόνια στο επάγγελμα</option>
                    <option value="age">Ηλικία</option>
                    <option value="trips">Δρομολόγια</option>
                  </select>
                </Field>
              </div>
            </div>
          ) : null}
          {db.drivers.length===0 ? <Empty t="Καταχώρησε τους οδηγούς σου για να τους διαλέγεις στα δρομολόγια." /> :
            (function(){
              let list = db.drivers.slice();
              list = list.filter(dr=>{
                const st = docState(dr, EGGRAFA_ODIGOU);
                if(dFil==="active") return !dr.left;
                if(dFil==="left") return !!dr.left;
                if(dFil==="expired") return st.expired>0;
                if(dFil==="soon") return st.soon>0;
                if(dFil==="adr") return (dr.docs||{}).adr && daysLeft(dr.docs.adr)>=0;
                if(dFil==="xeiristis") return !!(dr.docs||{}).xeiristis;
                return true;
              });
              const tripsOf = (id)=>db.trips.filter(t=>t.driverId===id).length;
              list.sort((a,b)=>{
                if(dSort==="expiry"){
                  const na = docState(a,EGGRAFA_ODIGOU).nearest, nb = docState(b,EGGRAFA_ODIGOU).nearest;

                }
                if(dSort==="exp") return (yearsSince(b.proSince)||0) - (yearsSince(a.proSince)||0);
                if(dSort==="age") return (yearsSince(b.birth)||0) - (yearsSince(a.birth)||0);
                if(dSort==="trips") return tripsOf(b.id) - tripsOf(a.id);
                return String(a.name).localeCompare(String(b.name),"el");
              });
              if(!list.length) return <Empty t="Κανένας οδηγός δεν ταιριάζει με αυτό το φίλτρο." />;
              return list.map(dr=>{
              const trips = db.trips.filter(t=>t.driverId===dr.id);
              return (
                <div className="card tight" key={dr.id} style={dr.left?{opacity:.6}:null}>

                    yearsSince(dr.proSince)!==null?yearsSince(dr.proSince)+" χρόνια στο επάγγελμα":"",
                    yearsSince(dr.hired)!==null?yearsSince(dr.hired)+" χρόνια εδώ":"",

                  ].filter(Boolean).join(" · ")}</div>
                  <div style={{marginTop:6}}>
                    <span className="tag">{trips.length} δρομολόγια</span>
                    {EGGRAFA_ODIGOU.map(d=>{
                      const val = (dr.docs||{})[d.k];
                      if(!val) return null;
                      const dl = daysLeft(val);
                      return <span className="tag" key={d.k} style={dl<30?{borderColor:"#e0b6ae",color:"var(--alert)"}:null}>{d.n}: {fmtDate(val)}</span>;

                    <button className="small" style={{flex:"0 0 auto",minWidth:0,color:"var(--mute)",padding:"7px 12px"}} title="Εμπιστευτικά" onClick={()=>{
                      const code = prompt("Κωδικός διαχειριστή:");

                      if(code !== (db.pin || "1234")){ alert("Λάθος κωδικός."); return; }

                    <button className="small" onClick={()=>setDf(dr)}>Επεξεργασία</button>
                    <button className="small danger" onClick={()=>{
                      if(trips.length){ alert("Ο οδηγός έχει "+trips.length+" δρομολόγια. Σημείωσέ τον ως «δεν εργάζεται πλέον» αντί να τον διαγράψεις."); return; }
                      if(confirm("Διαγραφή οδηγού;")) setDb(d=>Object.assign({},d,{drivers:d.drivers.filter(x=>x.id!==dr.id)}));
                    }}>Διαγραφή</button>
                  </div>
                </div>
              );
              });
            })()
          }
        </div>
      )}
    </div>
  );
}

/* ---------- ΣΥΝΤΗΡΗΣΗ ---------- */

function oilStatus(v){
  const o = v.oil||{};
  const res = [];
  if(o.lastKm && o.everyKm){
    const next = num(o.lastKm) + num(o.everyKm);
    res.push({left: next - num(v.km), unit:"χλμ", next: next.toLocaleString("el-GR")+" χλμ"});
  }
  if(o.lastDate && o.everyDays){
    const dt = new Date(o.lastDate+"T00:00:00");
    dt.setDate(dt.getDate() + num(o.everyDays));
    const iso = dt.toISOString().slice(0,10);
    res.push({left: daysLeft(iso), unit:"ημέρες", next: fmtDate(iso)});
  }
  return res;
}

function yearsSince(d){
  if(!d) return null;
  return Math.floor(-daysLeft(d)/365.25);
}
function docState(obj, defs){
  let expired = 0, soon = 0, nearest = null;
  defs.forEach(dc=>{
    const val = (obj.docs||{})[dc.k];
    if(!val) return;
    const dl = daysLeft(val);
    if(dl < 0) expired++;
    else if(dl <= 30) soon++;
    if(nearest === null || dl < nearest) nearest = dl;
  });
  return {expired, soon, nearest};
}
function shortReason(v){
  const l = [];
  EGGRAFA.forEach(d=>{
    const val = (v.docs||{})[d.k];
    if(val && daysLeft(val) < 0) l.push(d.n);
  });
  if(!l.length) return "";
  return l.length === 1 ? l[0] + " έληξε" : l[0] + " +" + (l.length-1) + " ακόμα";
}
function palaiotita(v){
  let p = 0; const why = [];
  const fr = yearsSince(v.firstReg);
  const y = num(v.year);
  if(fr !== null || y){
    const age = fr !== null ? fr : (new Date().getFullYear() - y);
    p += Math.min(50, age*3.5);
    why.push(age + (age===1?" έτος":" έτη"));
  }
  const km = num(v.km);
  if(km){
    p += Math.min(50, km/16000);
    why.push(km.toLocaleString("el-GR") + " χλμ");
  }
  p = Math.round(p);
  const lab = p<25 ? "Νέο" : p<50 ? "Μεσαίας ηλικίας" : p<75 ? "Παλαιό" : "Πολύ παλαιό";
  return {p, lab, why, lvl: p<25?"ok":p<50?"mid":p<75?"warn":"bad"};
}

function epikindynotita(v, trips){
  let p = 0; const why = [];
  const lixmena = [];
  EGGRAFA.forEach(d=>{
    const val = (v.docs||{})[d.k];
    if(!val) return;
    const dl = daysLeft(val);
    if(dl < 0){ lixmena.push(d.n); why.push(d.n + ": έχει λήξει"); }
    else if(dl <= 30){ p += 8; why.push(d.n + ": λήγει σε " + dl + " ημέρες"); }
  });
  if(lixmena.length){
    return {p:100, lab:"Ακινητοποίηση", lvl:"stop", stop:true, lixmena:lixmena,
      why:["Δεν επιτρέπεται να κινηθεί: " + lixmena.join(", ")].concat(why.filter(w=>w.indexOf("έχει λήξει")<0))};
  }
  if(oilStatus(v).some(o=>o.left<0)){ p += 18; why.push("Καθυστερημένη αλλαγή λαδιών"); }
  const vlaves = trips.filter(t=>
    t.vehicleId===v.id && daysLeft(t.date) > -180 &&
    (t.problems||[]).some(x=>["Βλάβη οχήματος","Λάστιχο","Ατύχημα"].indexOf(x)>=0)
  ).length;
  if(vlaves){ p += vlaves*8; why.push(vlaves + " περιστατικά βλάβης το τελευταίο εξάμηνο"); }
  const pal = palaiotita(v);
  if(pal.p > 50){ p += Math.round(pal.p*0.15); why.push("Παλαιότητα οχήματος"); }
  p = Math.min(99, Math.round(p));
  const lab = p<20 ? "Χαμηλή" : p<50 ? "Μεσαία" : "Υψηλή";
  return {p, lab, why, stop:false, lvl: p<20?"ok":p<50?"warn":"bad"};
}

function fuelStats(db, vehicleId){
  const list = (db.fuels||[]).filter(f=>f.vehicleId===vehicleId).sort((a,b)=>num(a.km)-num(b.km));
  let dist = 0, litForDist = 0, totLit = 0, totCost = 0;
  list.forEach(f=>{ totLit += num(f.liters); totCost += (num(f.cost) || num(f.liters)*num(f.price)); });
  for(let i=1;i<list.length;i++){
    const d = num(list[i].km) - num(list[i-1].km);
    if(d > 0 && d < 5000 && list[i].full !== false){ dist += d; litForDist += num(list[i].liters); }
  }
  const avg = dist ? (litForDist/dist*100) : null;
  return {n:list.length, avg, dist, totLit, totCost, costPerKm: dist ? totCost/dist : null};
}
function fleetAvg(db){
  let sum = 0, n = 0;
  db.vehicles.forEach(v=>{ const f = fuelStats(db, v.id); if(f.avg){ sum += f.avg; n++; } });
  return n ? sum/n : null;
}
function litersForTrip(db, t){
  const f = fuelStats(db, t.vehicleId);
  if(!f.avg) return 0;
  return f.avg * tripKm(t) / 100;
}
function fmt1(x){ return (Math.round(x*10)/10).toLocaleString("el-GR"); }

function aggrTrips(list){
  let o = {n:0, km:0, mins:0, tons:0, tkm:0, rev:0};
  list.forEach(t=>{
    o.n++; o.km += tripKm(t); o.mins += dur(t.timeStart,t.timeEnd);
    o.tons += tripTons(t); o.tkm += tripTonneKm(t); o.rev += num(t.revenue);
  });
  return o;
}
function maintCost(db, vehicleId, months){
  return db.services.filter(x=>x.vehicleId===vehicleId && (!months || daysLeft(x.date) > -(months*30)))
    .reduce((a,x)=>a+num(x.cost), 0);
}
function breakdowns(db, vehicleId, months){
  return db.trips.filter(t=>t.vehicleId===vehicleId && daysLeft(t.date) > -(months*30) &&
    (t.problems||[]).some(x=>["Βλάβη οχήματος","Λάστιχο","Ατύχημα"].indexOf(x)>=0)).length;
}
function avgFuelPrice(db){
  const l = (db.fuels||[]).map(f=>num(f.price)).filter(x=>x>0);
  return l.length ? l.reduce((a,b)=>a+b,0)/l.length : 1.45;
}
function vehicleEconomy(db, v){
  const a = aggrTrips(db.trips.filter(t=>t.vehicleId===v.id));
  const fs = fuelStats(db, v.id);
  const fuelCost = fs.totCost || (fs.totLit * avgFuelPrice(db));
  const mCost = maintCost(db, v.id, 0);
  const liters = fs.totLit;
  return {
    tkm:a.tkm, km:a.km, trips:a.n, tons:a.tons, rev:a.rev, mins:a.mins,
    liters, fuelCost, mCost, totalCost: fuelCost + mCost,
    litPerKtkm: a.tkm ? liters/a.tkm*1000 : null,
    costPerTkm: a.tkm ? (fuelCost+mCost)/a.tkm : null,
    revPerTkm: a.tkm && a.rev ? a.rev/a.tkm : null,
    marginPerTkm: a.tkm && a.rev ? (a.rev-fuelCost-mCost)/a.tkm : null
  };
}
function driverEconomy(db, dr){
  const list = db.trips.filter(t=>t.driverId===dr.id);
  const a = aggrTrips(list);
  let liters = 0;
  list.forEach(t=>{ liters += litersForTrip(db, t); });
  const fuelCost = liters * avgFuelPrice(db);
  return {
    tkm:a.tkm, km:a.km, trips:a.n, tons:a.tons, rev:a.rev, mins:a.mins,
    liters, fuelCost, mCost:0, totalCost:fuelCost,
    litPerKtkm: a.tkm ? liters/a.tkm*1000 : null,
    costPerTkm: a.tkm ? fuelCost/a.tkm : null,
    revPerTkm: a.tkm && a.rev ? a.rev/a.tkm : null,
    marginPerTkm: a.tkm && a.rev ? (a.rev-fuelCost)/a.tkm : null
  };
}

function clamp100(x){ return Math.max(0, Math.min(100, x)); }

function replacementScore(db, v){
  const parts = [];
  const push = (n, w, sub, val) => { if(sub !== null) parts.push({n, w, sub:clamp100(sub), val}); else parts.push({n, w, sub:null, val:"δεν υπάρχουν στοιχεία"}); };

  const age = v.firstReg ? yearsSince(v.firstReg) : (num(v.year) ? new Date().getFullYear()-num(v.year) : null);
  push("Ηλικία", 15, age===null?null:age/15*100, age===null?"":age+" έτη");

  const km = num(v.km);
  push("Χιλιόμετρα", 15, km?km/800000*100:null, km?km.toLocaleString("el-GR")+" χλμ":"");

  const e = vehicleEconomy(db, v);
  const mPerKkm = e.km ? e.mCost/e.km*1000 : null;
  push("Κόστος συντήρησης", 20, mPerKkm===null?null:(mPerKkm-20)/130*100, mPerKkm===null?"":fmt1(mPerKkm)+" € ανά 1.000 χλμ");

  const br = breakdowns(db, v.id, 12);
  push("Βλάβες και ακινησία", 15, br/6*100, br + (br===1?" βλάβη":" βλάβες") + " σε 12 μήνες");

  const cpk = e.km ? (e.fuelCost+e.mCost)/e.km : null;
  push("Κόστος ανά χιλιόμετρο", 15, cpk===null||!e.fuelCost?null:(cpk-0.25)/0.5*100, cpk&&e.fuelCost?fmt2(cpk)+" € ανά χλμ":"");

  const fs = fuelStats(db, v.id), fa = fleetAvg(db);
  const dev = (fs.avg && fa) ? (fs.avg-fa)/fa*100 : null;
  push("Κατανάλωση", 10, dev===null?null:(dev+10)/40*100, dev===null?"":fmt1(fs.avg)+" λίτρα/100 χλμ ("+(dev>0?"+":"")+fmt1(dev)+"% από τον στόλο)");

  let tkmAll = 0, nv = 0;
  db.vehicles.forEach(x=>{ const a = aggrTrips(db.trips.filter(t=>t.vehicleId===x.id)); if(a.tkm){ tkmAll += a.tkm; nv++; } });
  const tkmAvg = nv ? tkmAll/nv : null;
  const use = (tkmAvg && e.tkm) ? (1 - e.tkm/tkmAvg)*100 : null;
  push("Χρήση σε τονοχιλιόμετρα", 5, use, e.tkm?Math.round(e.tkm).toLocaleString("el-GR")+" τχλμ":"");

  const st = docState(v, EGGRAFA);
  const comp = st.expired ? 100 : (st.soon ? 50 : 0);
  push("Κατάσταση και συμμόρφωση", 5, comp, st.expired?st.expired+" ληγμένα":(st.soon?st.soon+" λήγουν σύντομα":"εντάξει"));

  let wsum = 0, ssum = 0;
  parts.forEach(pt=>{ if(pt.sub !== null){ wsum += pt.w; ssum += pt.w*pt.sub; } });
  const p = wsum ? Math.round(ssum/wsum) : 0;
  parts.forEach(pt=>{ pt.contrib = (pt.sub === null || !wsum) ? null : Math.round(pt.w*pt.sub/wsum); });
  const lab = p<30 ? "Κρατιέται" : p<55 ? "Παρακολούθηση" : p<75 ? "Προγραμματισμός αντικατάστασης" : "Άμεση αντικατάσταση";
  const lvl = p<30 ? "ok" : p<55 ? "mid" : p<75 ? "warn" : "bad";
  return {p, lab, lvl, parts, coverage:wsum, why:parts.filter(x=>x.sub!==null&&x.sub>=50).map(x=>x.n+": "+x.val)};
}

const EXPL_REPL = "Ο δείκτης 0–100 δείχνει πόσο ώριμο είναι το όχημα για αντικατάσταση. Κάθε παράγοντας βαθμολογείται στα 100 και μπαίνει με το βάρος του: ηλικία 15% (15 έτη = 100), χιλιόμετρα 15% (800.000 χλμ = 100), κόστος συντήρησης 20% (20 € ανά 1.000 χλμ = 0, 150 € = 100), βλάβες και ακινησία 15% (6 βλάβες σε 12 μήνες = 100), κόστος ανά χιλιόμετρο 15% (0,25 € = 0, 0,75 € = 100), κατανάλωση 10% (10% κάτω από τον μέσο όρο του στόλου = 0, 30% πάνω = 100), χρήση σε τονοχιλιόμετρα 5% (όσο λιγότερο δουλεύει σε σχέση με τον μέσο όρο, τόσο ανεβαίνει), κατάσταση και συμμόρφωση 5% (ληγμένα χαρτιά = 100). Όποιος παράγοντας δεν έχει στοιχεία αγνοείται και τα βάρη μοιράζονται ξανά στους υπόλοιπους. Έως 30 «Κρατιέται», έως 55 «Παρακολούθηση», έως 75 «Προγραμματισμός αντικατάστασης», πάνω «Άμεση αντικατάσταση».";

    </Sheet>

function annualKm(db, v){
  const last12 = db.trips.filter(t=>t.vehicleId===v.id && daysLeft(t.date) > -365);
  const k = last12.reduce((a,t)=>a+tripKm(t), 0);
  if(k > 0) return {km:k, src:"από τα δρομολόγια του τελευταίου 12μήνου"};
  const age = v.firstReg ? yearsSince(v.firstReg) : (num(v.year) ? new Date().getFullYear()-num(v.year) : null);
  if(age && num(v.km)) return {km: Math.round(num(v.km)/age), src:"εκτίμηση από συνολικά χιλιόμετρα διά ηλικία"};
  return {km:0, src:"δεν υπάρχουν στοιχεία"};
}

function economicDecision(db, v){
  const A = Object.assign({years:"8", resid:"20", fuelGain:"15", maintNew:"25", escal:"15"}, db.assum||{});
  const ak = annualKm(db, v);
  const fs = fuelStats(db, v.id);
  const price = avgFuelPrice(db);

  const fuel12 = (db.fuels||[]).filter(f=>f.vehicleId===v.id && daysLeft(f.date) > -365)
    .reduce((a,f)=>a + (num(f.cost) || num(f.liters)*num(f.price)), 0);
  const fuelYear = fuel12 > 0 ? fuel12 : (fs.avg && ak.km ? fs.avg*ak.km/100*price : 0);

  const maint12 = maintCost(db, v.id, 12);
  const maintAll = maintCost(db, v.id, 0);
  const maintYear = maint12 > 0 ? maint12 : maintAll;

  const escal = 1 + num(A.escal)/100;
  const keepCost = fuelYear + maintYear*escal;

  const rc = num(v.replCost);
  const depr = rc ? rc*(1 - num(A.resid)/100)/num(A.years) : 0;
  const fuelNew = fuelYear * (1 - num(A.fuelGain)/100);
  const maintNew = ak.km ? num(A.maintNew)*ak.km/1000 : 0;
  const newCost = depr + fuelNew + maintNew;

  const ready = !!(rc && keepCost > 0);
  const diff = keepCost - newCost;
  return {
    ready, ak, keepCost, newCost, diff,
    parts:{fuelYear, maintYear, escal, depr, fuelNew, maintNew},
    missing: !rc ? "Συμπλήρωσε «Κόστος αντικατάστασης» στην καρτέλα του οχήματος."
      : (keepCost<=0 ? "Χρειάζονται καταχωρήσεις καυσίμων ή εργασιών συντήρησης." : "")
  };
}

function EconDecision({v, db}){
  const d = economicDecision(db, v);
  const eur = (x)=>Math.round(x).toLocaleString("el-GR") + " €";
  if(!d.ready) return <div className="muted" style={{marginTop:8}}>{d.missing}</div>;
  const replace = d.diff > 0;
  return (
    <div style={{marginTop:10}}>
      <div className={replace ? "alertbox" : ""} style={replace?{fontWeight:700}:{fontWeight:700,color:"var(--ok)"}}>
        {replace ? "Αντικατάσταση — εξοικονόμηση " + eur(d.diff) + " τον χρόνο"
                 : "Κράτησέ το για τώρα — η αντικατάσταση κοστίζει " + eur(-d.diff) + " παραπάνω τον χρόνο"}
      </div>
      <div className="rowline"><span>Κόστος διατήρησης, 12 μήνες</span><b>{eur(d.keepCost)}</b></div>
      <div className="muted" style={{fontSize:12}}>
        Καύσιμα {eur(d.parts.fuelYear)} + συντήρηση {eur(d.parts.maintYear)} προσαυξημένη κατά {Math.round((d.parts.escal-1)*100)}% για τη φθορά
      </div>
      <div className="rowline" style={{marginTop:6}}><span>Κόστος νεότερου οχήματος, ετησίως</span><b>{eur(d.newCost)}</b></div>
      <div className="muted" style={{fontSize:12}}>
        Απόσβεση {eur(d.parts.depr)} + καύσιμα {eur(d.parts.fuelNew)} + συντήρηση {eur(d.parts.maintNew)}
      </div>
      <div className="rowline" style={{marginTop:6}}><span>Διαφορά</span>
        <b style={replace?{color:"var(--alert)"}:{color:"var(--ok)"}}>{(d.diff>0?"+":"") + eur(d.diff)}</b></div>
      <p className="muted" style={{fontSize:12,marginTop:6}}>
        Ετήσια χιλιόμετρα {Math.round(d.ak.km).toLocaleString("el-GR")} — {d.ak.src}. Οι παραδοχές αλλάζουν στο Αρχείο.
      </p>
    </div>
  );
}

function ReplSheet({v, db, onClose}){
  const r = replacementScore(db, v);
  return (
    <Sheet title={"Δείκτης αντικατάστασης — " + v.plate} onClose={onClose}>

            <div className="muted" style={{fontSize:12}}>{pt.val}</div>

      <h3 style={{marginTop:16}}>Ανάλυση παραγόντων</h3>

            </div>
          ) : null}

      ))}

      <p className="muted" style={{marginTop:0}}>{EXPL_REPL}</p>

  );
}

              {db.vehicles.map(v=><option key={v.id} value={v.id}>{v.plate}</option>)}
            </select>
          </Field>
          <Field label="Οδηγός">
            <select value={drv} onChange={e=>setDrv(e.target.value)}>
              <option value="">Όλοι</option>
              {db.drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="Ομαδοποίηση κατά">
            <select value={grp} onChange={e=>setGrp(e.target.value)}>
              {Object.keys(GROUPS).map(k=><option key={k} value={k}>{GROUPS[k].n}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Τι μετράμε">
          <select value={met} onChange={e=>setMet(e.target.value)}>
            {Object.keys(METRICS).map(k=><option key={k} value={k}>{METRICS[k].n}</option>)}
          </select>
        </Field>
      </div>

      <div className="statgrid" style={{marginBottom:10}}>
        <div className="stat"><div className="big">{trips.length}</div><div className="lab">δρομολόγια</div></div>
        <div className="stat"><div className="big">{Math.round(tot.km).toLocaleString("el-GR")}</div><div className="lab">χιλιόμετρα</div></div>
        <div className="stat"><div className="big">{hhmm(tot.mins)}</div><div className="lab">ώρες στον δρόμο</div></div>
        <div className="stat"><div className="big">{(Math.round(tot.tons*10)/10).toLocaleString("el-GR")}</div><div className="lab">τόνοι φορτίου</div></div>
        <div className="stat"><div className="big">{Math.round(tot.tkm).toLocaleString("el-GR")}</div><div className="lab">τονοχιλιόμετρα</div></div>
        <div className="stat"><div className="big">{tot.probs}</div><div className="lab">με πρόβλημα</div></div>
      </div>

      {trips.length===0 ? <Empty t="Δεν υπάρχουν δρομολόγια με αυτά τα φίλτρα." /> : (
        <div>
          <div className="card">
            <h3>{METRICS[met].n} ανά {GROUPS[grp].n.toLowerCase()}</h3>
            {rows.map(r=>(
              <div key={r.key} style={{padding:"7px 0",borderBottom:"1px solid #eef1f4"}}>
                <div className="rowline" style={{border:"none",padding:0}}>
                  <span>{r.name}</span>
                  <b>{m.fmt(m.f(r))}</b>
                </div>
                <div style={{height:6,background:"#eef2f6",borderRadius:4,marginTop:4}}>
                  <div style={{height:6,borderRadius:4,background:"var(--amber)",width:(maxVal?Math.max(3,Math.round(m.f(r)/maxVal*100)):0)+"%"}}></div>
                </div>
                <div className="muted" style={{fontSize:12,marginTop:3}}>
                  {r.n} δρομ. · {Math.round(r.km).toLocaleString("el-GR")} χλμ · {hhmm(Math.round(r.mins))} · {Math.round(r.tkm).toLocaleString("el-GR")} τχλμ
                </div>
              </div>
            ))}
          </div>
          <div className="card">
            <h3>Ανά τονοχιλιόμετρο — οχήματα</h3>
            {db.vehicles.map(v=>{
              const e = vehicleEconomy(db, v);
              if(!e.tkm) return null;
              return (
                <div key={v.id} style={{padding:"8px 0",borderBottom:"1px solid #eef1f4"}}>
                  <div className="rowline" style={{border:"none",padding:0}}>
                    <span className="plate">{v.plate}</span>
                    <b>{Math.round(e.tkm).toLocaleString("el-GR")} τχλμ</b>
                  </div>
                  <div className="muted" style={{fontSize:12.5,marginTop:3}}>
                    Καύσιμο {e.litPerKtkm?fmt1(e.litPerKtkm)+" λίτρα/1.000 τχλμ":"—"} ·
                    Κόστος {e.costPerTkm?fmt2(e.costPerTkm)+" €/τχλμ":"—"} ·
                    Έσοδα {e.revPerTkm?fmt2(e.revPerTkm)+" €/τχλμ":"—"}
                    {e.marginPerTkm!==null ? " · Περιθώριο "+fmt2(e.marginPerTkm)+" €/τχλμ" : ""}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="card">
            <h3>Ανά τονοχιλιόμετρο — οδηγοί</h3>
            {db.drivers.map(dr=>{
              const e = driverEconomy(db, dr);
              if(!e.tkm) return null;
              return (
                <div key={dr.id} style={{padding:"8px 0",borderBottom:"1px solid #eef1f4"}}>
                  <div className="rowline" style={{border:"none",padding:0}}>
                    <span>{dr.name}</span>
                    <b>{Math.round(e.tkm).toLocaleString("el-GR")} τχλμ</b>
                  </div>
                  <div className="muted" style={{fontSize:12.5,marginTop:3}}>
                    Καύσιμο {e.litPerKtkm?fmt1(e.litPerKtkm)+" λίτρα/1.000 τχλμ":"—"} ·
                    Κόστος {e.costPerTkm?fmt2(e.costPerTkm)+" €/τχλμ":"—"} ·
                    Έσοδα {e.revPerTkm?fmt2(e.revPerTkm)+" €/τχλμ":"—"}
                  </div>
                </div>
              );
            })}
            <p className="muted" style={{fontSize:12,marginTop:8}}>Οι δείκτες των οδηγών αφορούν όλη την περίοδο, όχι το φίλτρο πάνω.</p>
          </div>

          {probList.length ? (
            <div className="card">
              <h3>Προβλήματα</h3>
              {probList.map(pr=>(
                <button key={pr.k} className="rowline" style={{width:"100%",border:"none",borderBottom:"1px solid #eef1f4",borderRadius:0,background:"none",padding:"8px 0"}}
                  onClick={()=>setOpenProb(pr)}>
                  <span>{pr.k}</span><span><b>{pr.n}</b> ▸</span>
                </button>
              ))}
              {openProb ? (
                <Sheet title={openProb.k} onClose={()=>setOpenProb(null)}>
                  <p className="muted" style={{marginTop:0}}>Σε ποια οχήματα εμφανίστηκε, στην επιλεγμένη περίοδο.</p>
                  {Object.keys(openProb.veh).map(vid=>{
                    const v = db.vehicles.find(x=>x.id===vid);
                    if(!v) return <div className="rowline" key={vid}><span>Άγνωστο όχημα</span><b>{openProb.veh[vid]}</b></div>;
                    return (
                      <div className="rowline" key={vid} style={{alignItems:"flex-start"}}>
                        <div>
                          <span className={docState(v,EGGRAFA).expired ? "plate bad" : "plate"}>{v.plate}</span>
                          <div className="muted" style={{marginTop:3}}>{v.brand} {v.model} · {v.category}</div>
                        </div>
                        <b>{openProb.veh[vid]} {openProb.veh[vid]===1?"φορά":"φορές"}</b>
                      </div>
                    );
                  })}
                </Sheet>
              ) : null}
            </div>
          ) : null}
        </div>
      )}
    </div>
  );
}

function ListManager({title, hint, dbKey, db, setDb, defaults}){
  const items = db[dbKey] || [];
  const set = (arr) => setDb(d=>Object.assign({},d,{[dbKey]:arr}));
  const move = (i,dir) => {
    const a = items.slice(), j = i+dir;
    if(j<0 || j>=a.length) return;
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    set(a);
  };
  return (
    <div className="card">
      <h3>{title}</h3>
      <p className="muted" style={{marginTop:0}}>{hint}</p>
      {items.length===0 ? <div className="muted">Η λίστα είναι άδεια.</div> : null}
      {items.map((it,i)=>(
        <div key={it} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 0",borderBottom:"1px solid #eef1f4"}}>
          <span style={{flex:1,fontSize:14}}>{it}</span>
          <button className="small" disabled={i===0} onClick={()=>move(i,-1)} title="Πιο πάνω">↑</button>
          <button className="small" disabled={i===items.length-1} onClick={()=>move(i,1)} title="Πιο κάτω">↓</button>
          <button className="small danger" onClick={()=>{
            if(confirm("Αφαίρεση «"+it+"»;\nΟι παλιές καταχωρήσεις δεν αλλάζουν.")) set(items.filter(x=>x!==it));
          }}>×</button>
        </div>
      ))}
      <div className="btnrow">
        <button className="dark" onClick={()=>{
          const n = prompt("Προσθήκη στη λίστα «"+title+"»:");
          if(n && n.trim() && items.indexOf(n.trim())<0) set(items.concat([n.trim()]));
        }}>+ Προσθήκη</button>
        <button onClick={()=>{
          if(confirm("Επαναφορά των αρχικών; Ό,τι έχεις προσθέσει διατηρείται στο τέλος."))
            set(defaults.concat(items.filter(x=>defaults.indexOf(x)<0)));
        }}>Επαναφορά αρχικών</button>
      </div>
    </div>
  );
}

/* ---------- ΕΙΔΟΠΟΙΗΣΕΙΣ ---------- */

function Alerts({db}){
  const items = [];
  db.vehicles.forEach(v=>{
    EGGRAFA.forEach(dcm=>{
      const val = (v.docs||{})[dcm.k];
      if(!val) return;
      const dl = daysLeft(val);
      if(dl < 0) items.push({lvl:"now", txt: v.plate+" — "+dcm.n+": έληξε στις "+fmtDate(val)});
      else if(dl <= 30) items.push({lvl:"soon", txt: v.plate+" — "+dcm.n+": λήγει σε "+dl+" ημέρες ("+fmtDate(val)+")"});
    });
    oilStatus(v).forEach(o=>{
      if(o.left < 0) items.push({lvl:"now", txt: v.plate+" — αλλαγή λαδιών: έχει περάσει ("+o.next+")"});
      else if((o.unit==="χλμ" && o.left<1500) || (o.unit==="ημέρες" && o.left<30))
        items.push({lvl:"soon", txt: v.plate+" — αλλαγή λαδιών σε "+o.left+" "+o.unit});
    });
  });
  db.drivers.filter(d=>!d.left).forEach(dr=>{
    EGGRAFA_ODIGOU.forEach(dcm=>{
      const val = (dr.docs||{})[dcm.k];
      if(!val) return;
      const dl = daysLeft(val);
      if(dl < 0) items.push({lvl:"now", txt: dr.name+" — "+dcm.n+": έληξε στις "+fmtDate(val)});
      else if(dl <= 30) items.push({lvl:"soon", txt: dr.name+" — "+dcm.n+": λήγει σε "+dl+" ημέρες"});
    });
  });
  if(!items.length) return null;
  items.sort((a,b)=> (a.lvl==="now"?0:1) - (b.lvl==="now"?0:1));
  const now = items.filter(i=>i.lvl==="now").length;
  const soon = items.length - now;
  return <AlertsBox items={items} now={now} soon={soon} />;
}

function AlertsBox({items, now, soon}){
  const [open,setOpen] = useState(false);
  return (
    <div>
      <button className={now ? "redbox" : "redbox amberbox"} onClick={()=>setOpen(true)}>
        <span>
          {now ? now + (now===1 ? " επείγον πρόβλημα" : " επείγοντα προβλήματα") : soon + " λήξεις πλησιάζουν"}
          {now && soon ? " · " + soon + " ακόμα πλησιάζουν" : ""}
        </span>
        <span style={{fontWeight:600,fontSize:13}}>Δες τα</span>
      </button>
      {open ? (
        <div className="overlay" onClick={()=>setOpen(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <h3>Τι χρειάζεται την προσοχή σου</h3>
            {items.map((i,k)=>(
              <div key={k} className={i.lvl==="now" ? "alertbox" : "alertbox soon"}>{i.txt}</div>
            ))}
            <button className="dark wide" style={{marginTop:10}} onClick={()=>setOpen(false)}>Κλείσιμο</button>
          </div>
        </div>
      ) : null}
    </div>
  );
}

/* ---------- ΕΦΑΡΜΟΓΗ ---------- */

function App(){
  const [db,setDb] = useState(load);
  const [tab,setTab] = useState("stats");

  useEffect(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }
    catch(e){ alert("Δεν αποθηκεύτηκαν τα δεδομένα — ο χώρος της συσκευής είναι γεμάτος."); }
  },[db]);

  const tabs = [
    {k:"stats", n:"Στατιστικά"},
    {k:"trips", n:"Δρομολόγια"},
    {k:"fuel", n:"Καύσιμα"},
    {k:"service", n:"Συντήρηση"},
    {k:"fleet", n:"Στόλος"},
    {k:"file", n:"Αρχείο"}
  ];

  return (
    <div>
      <header>
        <div className="row">
          <h1>Στόλος</h1>
          <span className="ver">{VERSION}</span>
        </div>
        <div className="sub">Δρομολόγια, φορτία και συντήρηση οχημάτων</div>
      </header>
      <div className="stripe"></div>
      <main>
        {tab!=="file" ? <Alerts db={db} /> : null}
        {tab==="trips" ? <TripsTab db={db} setDb={setDb} /> : null}
        {tab==="fuel" ? <FuelTab db={db} setDb={setDb} /> : null}
        {tab==="stats" ? <StatsTab db={db} /> : null}
        {tab==="service" ? <ServiceTab db={db} setDb={setDb} /> : null}
        {tab==="fleet" ? <FleetTab db={db} setDb={setDb} /> : null}
        {tab==="file" ? <FileTab db={db} setDb={setDb} /> : null}
      </main>
      <nav>
        {tabs.map(t=>(
          <button key={t.k} className={tab===t.k?"on":""} onClick={()=>{setTab(t.k); window.scrollTo(0,0);}}>{t.n}</button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
