<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17324D">
<title>Δρομολόγιο</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Δρομολόγιο">
<meta name="description" content="Πελάτες, εργασίες, υπενθυμίσεις, διαδρομές και ταμείο.">
<link rel="icon" id="favIcon">
<link rel="apple-touch-icon" id="favIcon2" href="apple-touch-icon.png">
<style>
:root{--brand:#17324D;--onbrand:#fff;--accent:#F2B632;--onaccent:#17324D;--paper:#EDF1F2;--card:#fff;--ink:#17324D;--muted:#5E7185;--line:#D6DEE3;--red:#C8412B;--green:#2E7D5B;--loc:#2468B5;--z:1}
*{box-sizing:border-box}
html,body{margin:0}
body.hasbg::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg) center/cover no-repeat;opacity:var(--bgop,.1);pointer-events:none}
body{font-family:system-ui,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.zm{zoom:var(--z)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--onbrand);display:flex;align-items:center;gap:2px;padding:9px 6px 9px 14px;padding-top:calc(9px + env(safe-area-inset-top))}
.mark{flex:none;width:38px;height:38px;margin-right:10px;border-radius:10px;object-fit:cover}
.htitle{flex:1;min-width:0;line-height:1.1}
.htitle h1{margin:0;font-size:19px;font-weight:850;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{display:block;font-size:12px;opacity:.78;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;flex:none;background:none;border:0;color:var(--onbrand);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px}
.hbtn .dot{position:absolute;top:3px;right:1px;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:800;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.hbtn .dot.red{background:var(--red);color:#fff}
.hbtn.warn{color:var(--accent)}
.hbtn.bad{color:#FF8A7A}
.hbtn.ok{opacity:.4}
.hbtn.ok .pipdot{display:none}
.hbtn .pipdot{position:absolute;bottom:5px;right:6px;width:9px;height:9px;border-radius:50%;background:currentColor}
main{max-width:720px;margin:0 auto;padding:14px 14px 120px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;transition:none;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;padding:7px 1px 8px;color:var(--muted);font-size:clamp(8.5px,2.35vw,11.5px);letter-spacing:-.2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button.on{color:var(--ink);font-weight:800}
nav button.on svg{color:var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
nav button.on::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:38px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,transparent);z-index:-1}
nav button{position:relative;isolation:isolate}
nav .ndot{position:absolute;top:2px;left:50%;margin-left:4px;background:var(--accent);color:var(--onaccent);font-size:10.5px;font-weight:800;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
nav .ndot.red{background:var(--red);color:#fff}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--onaccent);box-shadow:0 5px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.sec{font-size:15px;font-weight:700;color:var(--muted);margin:20px 2px 8px}
.sec.red{color:var(--red)}
.sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
.pad{padding:4px 16px 16px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.title{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px}
.snip{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:8px;border:2px solid color-mix(in srgb,var(--muted) 60%,var(--card));background:var(--card);color:#fff;font-weight:800;font-size:15px;line-height:1;padding:0}
.task.p3 .check{border-color:var(--red)}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.hi{color:var(--red);font-weight:900}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:2px;white-space:nowrap}
.tag.late,.tag.noloc{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red)}
.tag.progress{background:color-mix(in srgb,var(--accent) 30%,var(--card));color:var(--ink)}
.tag.done,.tag.paid{background:color-mix(in srgb,var(--green) 15%,var(--card));color:var(--green)}
.tag.cancelled{background:var(--paper);color:var(--muted)}
.tag.waiting{background:color-mix(in srgb,var(--loc) 15%,var(--card));color:var(--loc)}
.tag.someday{background:var(--paper);color:var(--muted)}
.task.waiting{background:color-mix(in srgb,var(--loc) 9%,var(--card));box-shadow:inset 4px 0 0 var(--loc)}
.task.progress{background:color-mix(in srgb,var(--green) 10%,var(--card));box-shadow:inset 4px 0 0 var(--green)}
.task.progress .title{color:color-mix(in srgb,var(--green) 70%,var(--ink))}
.check.st{position:relative}
.check.st.progress{background:var(--green);border-color:var(--green);color:#fff}
.check.st.waiting{background:var(--loc);border-color:var(--loc);color:#fff}
.check.st.cancelled{border-style:dashed}
.waitbtn{flex:none;width:34px;height:34px;margin-top:1px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center}
.waitbtn.on{background:color-mix(in srgb,var(--loc) 16%,var(--card));border-color:var(--loc);color:var(--loc)}
.task.cancelled .title{text-decoration:line-through;color:var(--muted)}
.task.cancelled{opacity:.72}
.today-date{font-size:clamp(17px,5vw,28px);font-weight:850;line-height:1.25;margin:8px 2px 4px;letter-spacing:-.3px;overflow-wrap:normal;word-break:keep-all;hyphens:none}
.today-sub{color:var(--muted);margin:0 2px}
.ctarow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.cta2{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);padding:13px 12px;text-align:left}
.cta2 svg{color:var(--accent);margin-bottom:2px}
.cta2 b{font-size:15.5px;line-height:1.2}
.cta2 small{font-size:12px;opacity:.8;line-height:1.25}
.cta2:active{transform:scale(.97)}
.routecta{width:100%;margin:16px 0 4px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);text-align:left;padding:16px;display:flex;gap:14px;align-items:center}
.routecta svg{color:var(--accent);flex:none}
.routecta b{font-size:17px}
.routecta small{opacity:.8;font-size:13.5px}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:6px 2px}
.verline{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 6px;opacity:.8}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.avatar.busy{background:var(--accent);color:var(--onaccent)}
.whos{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
.who{width:20px;height:20px;border-radius:50%;color:#1b2733;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.3px}
.pplrow{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);opacity:.38;border-radius:20px;padding:7px 13px 7px 8px;font-weight:750;font-size:14px;display:flex;align-items:center;gap:7px}
.pbtn .dotc{width:18px;height:18px;border-radius:50%}
.pbtn.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--ink);opacity:1;font-weight:850}
.pbtn .dotc{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px}
.palette button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.palette button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.rcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:1px}
.mv{width:34px;height:19px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;font-size:9px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.mv:active{background:var(--paper)}
.posn{width:34px;height:24px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;font-size:13px;font-weight:800;padding:0}
.meta1{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.chiprow .tag{margin:0}
.tag.amt0{background:var(--paper);color:var(--ink)}
.tag.owe{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red);font-weight:800}
.minibtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700}
.minibtn.in{background:color-mix(in srgb,var(--green) 14%,var(--card));border-color:color-mix(in srgb,var(--green) 40%,var(--card));color:var(--green)}
.minibtn.full{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:color-mix(in srgb,var(--accent) 55%,var(--card))}
.owe-mini{font-size:12.5px;color:var(--red);font-weight:700}
.row.task{padding:11px 12px 12px 14px;gap:9px}
.row.task .title{font-size:15px;line-height:1.3}
.goto{flex:none;width:34px;height:34px;margin-top:1px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--loc);display:flex;align-items:center;justify-content:center}
.nearbadge{color:var(--loc);font-weight:700}
.stars{display:flex;gap:2px;align-items:center}
.stars button{background:none;border:0;padding:2px;line-height:1;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars .diam{margin-left:6px;color:color-mix(in srgb,var(--loc) 30%,var(--line))}
.stars .diam.on{color:var(--loc)}
.stars.big button{padding:4px 3px}
.stars.ro{pointer-events:none}
.starwrap{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ratesum{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 14px;text-align:left;color:var(--ink);cursor:pointer}
.ratesum .rsl{flex:1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.ratesum .rsl i{font-style:normal;white-space:nowrap}.ratesum .rsl b{color:var(--ink)}
.ratesum .rsm{font-size:13px;font-weight:800;color:var(--brand);white-space:nowrap}
.ratenote{padding:0 14px 10px;font-size:13px;color:var(--muted);font-style:italic;white-space:pre-wrap}
.ratetotal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.ratetotal b{font-size:20px}
.raterow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.raterow .rt{flex:1;min-width:0}.raterow .rt b{display:block;font-size:14.5px}.raterow .rt small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.raterow .rt .rhint{color:var(--brand);font-weight:700;margin-top:2px}
.raterow .stars{flex:none}
.starwrap .lbl{color:var(--muted);font-size:13.5px;flex:1}
.count{color:var(--ink);font-weight:700}
.count.late{color:var(--red)}
.pickbtn .kname{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;font-size:13px;font-weight:700}

.callbtn.navb{color:var(--loc)}.callbtn.msgb{color:#2563EB}
.cbtns{flex:none;display:flex;flex-direction:column;gap:5px;align-items:center}
.cbtns .callbtn{width:32px;height:32px;border:1px solid var(--line)}
.callbtn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--green)}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;margin-bottom:6px}
.cl-name{font-size:26px;font-weight:850;line-height:1.15;margin:0 2px 2px;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin:14px 0}
.actions.four{grid-template-columns:repeat(4,1fr);gap:6px}
.actions.four .act{padding:9px 2px;font-size:11.5px;gap:3px}
.act.off{opacity:.4;pointer-events:none}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.twobtn .btn{width:100%}
.row.ent{align-items:center;padding:10px 14px}
.row.ent.cx .title,.row.ent.cx .amt{text-decoration:line-through;opacity:.55}
.entic{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.entic.in{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.entic.out{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
.amt{flex:none;font-weight:800;font-size:15px}
.amt.in{color:var(--green)}
.amt.out{color:var(--red)}
.bigsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.sum3 .sumcard{padding:10px 8px;text-align:center;border:1px solid var(--line);width:100%}
.sum3 .sumcard:active{transform:scale(.97)}
.sum3 .sumcard span{font-size:11.5px;line-height:1.2}
.sum3 .sumcard b{font-size:17px;letter-spacing:-.4px}
.monthhead{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:12px 14px;margin:10px 0 6px;font-size:15px}
.monthhead .mcnt{color:var(--muted);font-size:12.5px;margin-left:auto}
.monthhead .msum{font-weight:800;font-size:13.5px}
.monthhead .msum.in{color:var(--green)}
.monthhead .msum.out{color:var(--red)}
.monthhead .mchev{font-style:normal;color:var(--muted);width:14px;text-align:center}
.monthhead+.panel{margin-top:0}
.ioststep{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px}
.ioststep b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:flex;align-items:center;justify-content:center;font-size:13px}
.ioststep span{padding-top:3px;line-height:1.4;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ioststep svg{color:var(--loc);vertical-align:middle}
.chartlegend{display:flex;gap:16px;padding:12px 14px 0;font-size:12.5px;color:var(--muted)}
.chartlegend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.chartlegend .dot.in{background:var(--green)}
.chartlegend .dot.out{background:var(--red)}
.chart6{display:flex;align-items:flex-end;gap:4px;height:130px;padding:10px 10px 4px}
.chart6-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart6-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.chart6-bar{width:36%;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.chart6-bar.in{background:var(--green)}
.chart6-bar.out{background:var(--red)}
.chart6-lbl{font-size:10.5px;color:var(--muted);font-weight:700}
.statrow{display:flex;align-items:center;gap:10px;padding:9px 14px 2px}
.statlbl{flex:0 0 88px;font-size:12.5px;font-weight:750;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statbar{flex:1;height:10px;background:var(--paper);border-radius:6px;overflow:hidden}
.statbar-fill{height:100%;background:var(--loc);border-radius:6px}
.statval{flex:0 0 auto;font-size:13px;font-weight:800;min-width:64px;text-align:right}
.statsub{padding:0 14px 9px 112px;font-size:11.5px;color:var(--muted)}
.sndrow{gap:8px;border-bottom:1px solid var(--line)}
@keyframes pulseSave{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);transform:scale(1)}
  50%{box-shadow:0 0 0 9px transparent;transform:scale(1.035)}}
.pulseSave{animation:pulseSave 1.15s ease-in-out infinite}
.fotocta{display:flex;align-items:center;gap:13px;width:100%;border:0;border-radius:16px;padding:14px 16px;margin:2px 0 4px;
  background:linear-gradient(135deg,#7C3AED,#C026D3 55%,#F59E0B);color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.32);text-align:left}
.gate{position:fixed;inset:0;z-index:120;background:var(--bg,#0F1A26);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.gate[hidden]{display:none}
.gatebox{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:20px 18px 18px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.gatebox h2{margin:6px 0 4px;font-size:22px}
.gatebox .gicon{width:64px;height:64px;border-radius:18px;background:#F2B632;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.gatebox .gicon svg{color:#1B2E45}
.fotocta:active{transform:scale(.98)}
.notecta{background:linear-gradient(135deg,#1B2E45,#33506F 70%);box-shadow:0 5px 14px rgba(27,46,69,.26)}
.notecta .fic{background:rgba(242,182,50,.22)}
.notecta .fic svg{color:#F2B632}
.fotocta .fic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.fotocta .fic svg{color:#fff}
.fotocta .ftx{flex:1;min-width:0}
.fotocta .ftx b{display:block;font-size:16px;line-height:1.25}
.fotocta .ftx small{display:block;font-size:12px;opacity:.85;font-weight:600;margin-top:1px}
.fotocta .fmcnt{flex:none;background:rgba(255,255,255,.24);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:800;min-width:0}
@media (prefers-reduced-motion:reduce){.pulseSave{animation:none}}
.pickbox .sndrow:last-child{border-bottom:0}
.sndsel{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--green);font-size:14px}
.sndrow.on2 .sndsel{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--card))}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sumcard span{display:block;color:var(--muted);font-size:13px}

.notes{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}

.quick button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}

.qmark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:7px;border-radius:50%;

.optrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:13px 14px;font-size:15.5px;font-weight:600}
.optrow:last-child{border-bottom:0}

.optrow .tick{margin-left:auto;color:var(--green);font-weight:900}
.optrow .n{color:var(--muted);font-weight:600;font-size:13.5px}
.optrow .grow small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.stdot{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;

.stdot.waiting{background:color-mix(in srgb,var(--loc) 16%,var(--card));color:var(--loc)}
.stdot.cancelled{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px}

.hs{position:sticky;top:var(--hdr,62px);z-index:4;background:var(--paper);margin:-14px -14px 4px;padding:12px 14px 8px}
.hs-track{height:4px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}

.toggle{display:flex;align-items:center;gap:9px;font-size:14px;margin:10px 2px;color:var(--ink);font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand);flex:none}
label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}

input:where(:not([type=checkbox],[type=radio],[type=range],[type=color],[type=file])),select,textarea{

.ofgroup{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}

.linkbtn{background:none;border:0;padding:6px 2px;color:var(--loc);font-weight:700;font-size:13.5px;text-decoration:underline}

.owedok{margin:4px 0 0;color:var(--green);font-weight:700;font-size:13.5px}

.tf{position:relative;display:block;width:100%}

textarea{resize:vertical}

.primary{background:var(--brand);color:var(--onbrand)}

label{letter-spacing:.2px}

.cl-dial{position:relative;width:270px;height:270px;margin:0 auto;border-radius:50%;background:var(--paper);touch-action:none;user-select:none}
.cl-dial svg{position:absolute;inset:0}
.cl-dial .cn{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:750;color:var(--ink)}
.cl-dial .cn.inner{font-size:14px;color:var(--muted);width:36px;height:36px;margin:-18px 0 0 -18px}
.cl-dial .cn.sel{background:var(--brand);color:var(--onbrand);font-weight:850}
.cl-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.cl-foot .grow{flex:1}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);max-width:88vw;background:var(--brand);color:var(--onbrand);padding:11px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;font-size:14px}
.modal.open~.toast,.mapdlg.open~.toast{top:calc(70px + env(safe-area-inset-top));bottom:auto}
.toast.show{opacity:1}
/* διαδρομή */
.sum{margin:16px 2px 10px;font-size:14.5px}
.calc{color:var(--muted);font-size:12.5px}
.route{padding:4px 0}
.node{display:flex;gap:10px;padding:0 14px 0 0}
.rail{position:relative;width:46px;flex:none;display:flex;justify-content:center;padding:12px 0}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:14px;margin-left:-7px;background:var(--brand)}
.rail::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,var(--accent) 0 9px,transparent 9px 17px)}
.node:first-child .rail::before,.node:first-child .rail::after{top:50%}
.node:last-child .rail::before,.node:last-child .rail::after{bottom:50%}
.pin{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--card);border:3px solid var(--brand);display:flex;align-items:center;justify-content:center;font-weight:850;font-size:14px;align-self:flex-start}
.pin.end{background:var(--accent);color:var(--onaccent)}
.node .body{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.node:last-child .body{border-bottom:0}
.node.off .pin{background:var(--paper);color:var(--muted);border-color:var(--muted)}
.node.off .title{color:var(--muted)}
.stoptask{display:block;width:100%;text-align:left;background:var(--paper);border:0;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:14px;color:var(--ink)}
.stoptask.late{box-shadow:inset 3px 0 0 var(--red)}
.urgent{color:var(--red);font-weight:750}
.clstat{border:2px solid var(--brand);border-radius:16px;background:color-mix(in srgb,var(--brand) 6%,var(--card));padding:12px 14px;margin:10px 0 12px}
.clstat.owe{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--card))}
.clstat.calm{border-color:var(--green);background:color-mix(in srgb,var(--green) 7%,var(--card))}
.clst-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:850;font-size:15.5px;margin-bottom:10px}
.clst-h span{font-size:12.5px;font-weight:800;color:var(--muted);text-align:right}
.clstat.owe .clst-h span{color:var(--red)}.clstat.calm .clst-h span{color:var(--green)}
.clst-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clst-g>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.clst-g span{font-size:12px;font-weight:750;color:var(--muted)}.clst-g b{font-size:19px}.clst-g small{font-size:11.5px;color:var(--muted);font-weight:700}
.clopen{border:2.5px solid var(--accent);border-radius:16px;padding:4px 10px 10px;margin:12px 0 14px;background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.clopen .sec{margin-top:8px}
.bonusask{border:1.5px solid color-mix(in srgb,var(--green) 45%,var(--card));background:color-mix(in srgb,var(--green) 8%,var(--card));border-radius:12px;padding:10px 12px;margin:8px 0 0;font-size:14px;line-height:1.4}
.bonusbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stopbtn{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.stopbtn.skip{background:color-mix(in srgb,var(--red) 8%,var(--card));border-color:color-mix(in srgb,var(--red) 30%,var(--card));color:color-mix(in srgb,var(--red) 80%,var(--ink))}
.stopbtn.add{background:color-mix(in srgb,var(--green) 10%,var(--card));border-color:color-mix(in srgb,var(--green) 35%,var(--card));color:color-mix(in srgb,var(--green) 85%,var(--ink))}
.golink{display:block;text-align:center;text-decoration:none;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function numGR(v){
  let t=String(v==null?"":v).replace(/[^\d.,-]/g,"").trim();
  if(!t)return 0;
  const c=t.lastIndexOf(","),d=t.lastIndexOf(".");
  if(c>=0&&d>=0)t=c>d?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");
  else if(c>=0)t=t.replace(",",".");
  else if(d>=0&&/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");
  const n=parseFloat(t);return isFinite(n)?n:0;
}

const FREE_OPTS=[["","Κανονική χρέωση"],["labor","Δωρεάν εργασία, ο πελάτης πληρώνει τα έξοδα (υλικά, μεροκάματα κ.λπ.)"],["free","Δωρεάν επισκευή"],["warranty","Δωρεάν, στην εγγύηση"],["damage","Δωρεάν, αποκατάσταση ζημιάς"]];

function moneyBuckets(tasks,entries){
  const freeIds=new Set(tasks.filter(x=>x.free).map(x=>x.id));
  const matOwed=tasks.filter(x=>x.free==="labor"&&x.status!=="cancelled").reduce((a,x)=>a+laborMat(x).owe,0);
  tasks=tasks.filter(x=>!x.free);
  const live=entries.filter(e=>!e.cancelled);
  const amt=x=>+x.amount||0;
  const offers=tasks.filter(x=>x.status==="waiting").reduce((s,x)=>s+amt(x),0);
  const pipeline=tasks.filter(x=>x.status==="pending"||x.status==="progress").reduce((s,x)=>s+amt(x),0);
  const doneCharges=tasks.filter(x=>x.status==="done").reduce((s,x)=>s+amt(x),0);
  const inEnt=live.filter(e=>entInC(e));
  const received=inEnt.reduce((s,e)=>s+e.amount,0);
  const spent=live.filter(e=>entOut(e)).reduce((s,e)=>s+e.amount,0);
  const doneIds=new Set(tasks.filter(x=>x.status==="done").map(x=>x.id));
  const paidDone=inEnt.filter(e=>e.taskId&&doneIds.has(e.taskId)).reduce((s,e)=>s+e.amount,0);
  const general=inEnt.filter(e=>(!e.taskId||!tasks.some(t=>t.id===e.taskId))&&!freeIds.has(e.taskId)).reduce((s,e)=>s+e.amount,0);
  const advOpen=inEnt.filter(e=>e.taskId&&!doneIds.has(e.taskId)&&tasks.some(t=>t.id===e.taskId)).reduce((s,e)=>s+e.amount,0);
  const covered=paidDone+general;
  const bonOf=x=>{const p=inEnt.filter(e=>e.taskId===x.id).reduce((s,e)=>s+e.amount,0);return Math.min(+x.bonus||0,Math.max(0,p-amt(x)))};
  const bonusDone=tasks.filter(x=>x.status==="done").reduce((s,x)=>s+bonOf(x),0);
  const bonusOpen=tasks.filter(x=>x.status!=="done"&&x.status!=="cancelled").reduce((s,x)=>s+bonOf(x),0);
  // Οφειλή = άθροισμα ανά ολοκληρωμένη δουλειά (τιμή − εισπράξεις που συνδέθηκαν με αυτήν).
  // Ίδιος κανόνας με τον πίνακα της εργασίας και τον χάρτη, ώστε να λένε παντού το ίδιο νούμερο.
  const paidFor=x=>inEnt.filter(e=>e.taskId===x.id).reduce((s,e)=>s+e.amount,0);
  const owed=tasks.filter(x=>x.status==="done"&&!x.paid&&amt(x)>0).reduce((s,x)=>s+Math.max(0,amt(x)-paidFor(x)),0);
  return{offers:rnd(offers),pipeline:rnd(pipeline),doneCharges:rnd(doneCharges),received:rnd(received),spent:rnd(spent),
    owed:rnd(owed+matOwed),matOwed:rnd(matOwed),prepaid:rnd(Math.max(0,advOpen-bonusOpen)+Math.max(0,covered-doneCharges-bonusDone)),bonus:rnd(bonusDone+bonusOpen),profit:rnd(received-spent)};
}

function parseCoords(s){
  s=String(s||"").trim();if(!s)return null;let m;
  const ok=(a,b)=>{a=+a;b=+b;return isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0)?{lat:a,lng:b}:null};
  if(/goo\.gl|maps\.app/i.test(s))return"short";
  if((m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)))return ok(m[1],m[2]);
  if((m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)))return ok(m[1],m[2]);
  if((m=s.match(/[?&](?:q|query|ll|destination|center|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)))return ok(m[1],m[2]);
  const parts=[...s.matchAll(/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['’′]\s*(\d{1,2}(?:[.,]\d+)?)?\s*(?:["”″]|'')?\s*([NSEWΒΝΑΔ])?/gi)];
  if(parts.length>=2){const cv=p=>{let v=+p[1]+(+p[2])/60+(p[3]?+p[3].replace(",",".")/3600:0);if(/[SWΝΔ]/.test(p[4]||""))v=-v;return v};return ok(cv(parts[0]),cv(parts[1]))}
  if((m=s.match(/(-?\d{1,2}[.,]\d{2,})\s*[,;\s]\s*(-?\d{1,3}[.,]\d{2,})/)))return ok(m[1].replace(",","."),m[2].replace(",","."));
  return null;
}
// «Αγίου Νικολάου 5, Ντράφι 190 09» -> οδός, περιοχή, ΤΚ
function splitAddress(txt){
  let t=String(txt||"").replace(/\s+/g," ").trim();if(!t)return null;
  let zip="";
  t=t.replace(/\b(\d{3})\s?(\d{2})\b/,(m,a,b)=>{zip=a+b;return ""}).replace(/\s+/g," ").trim();
  t=t.replace(/(^|,)\s*(Ελλάδα|Greece|GR)\s*(,|$)/i,"$1").replace(/,\s*,/g,",").replace(/^[,\s]+|[,\s]+$/g,"");
  const parts=t.split(",").map(x=>x.trim()).filter(Boolean);
  let street="",area="";
  if(parts.length>=2){street=parts[0];area=parts[parts.length-1];
    const known=parts.slice(1).map(findArea).filter(Boolean)[0];if(known)area=known.name}
  else if(parts.length===1){
    const a=areaInText(parts[0]);
    if(a&&norm(parts[0])!==norm(a.name)){area=a.name;street=parts[0].replace(new RegExp(escRe(a.name),"i"),"").replace(/[,\s]+$/,"").trim()}
    else if(a){area=a.name}else street=parts[0];
  }
  return(street||area||zip)?{street,area,zip}:null;

/* ---------- Κοινό πλαίσιο τοποθεσίας (διεύθυνση, συντεταγμένες, χάρτης, «είμαι εκεί») ---------- */

function lwBind(o){

    else if(a){st.className="lw-status";st.textContent=T("Θα χρησιμοποιηθεί το κέντρο της περιοχής {a}. Για ακρίβεια βάλε διεύθυνση ή σημείο.",{a:a.name})}
    else{st.className="lw-status"+(LW.attempted?" warn":"");st.textContent=LW.attempted?T("Χωρίς τοποθεσία. Δεν θα εμφανίζεται στις διαδρομές."):T("Πρόσθεσε τοποθεσία για να μπαίνει στις διαδρομές.")}
    const ai=$("#f_area");if(ai&&o.markArea)ai.classList.toggle("warn",LW.attempted&&!LW.loc&&!a);
  };
  coords.oninput=()=>{const v=coords.value.trim();if(!v){LW.loc=null;upd();return}

      st.innerHTML=esc(T("Ο σύντομος σύνδεσμος δεν διαβάζεται. Άνοιξέ τον στους Χάρτες, πάτα παρατεταμένα το σημείο, αντέγραψε τις συντεταγμένες και επικόλλησέ τες εδώ."))+
      ` <a class="lk" href="${esc(v)}" target="_blank" rel="noopener">${T("Άνοιγμα συνδέσμου")}</a>`;return}
    if(p){LW.loc=p;sheetDirty=true;upd();clearTimeout(coords._t);coords._t=setTimeout(()=>reverseFill(p),700)}else{const st=$("#lw_status");st.className="lw-status warn";st.textContent=T("Δεν αναγνωρίστηκαν συντεταγμένες σε αυτό το κείμενο.")}};

      if(d.area||d.zip)toast(T("Η διεύθυνση χωρίστηκε σε οδό, περιοχή και ΤΚ."))};

  $("#lw_map").onclick=()=>{const a=findArea(LW.area());openMapPicker(LW.loc,a,p=>{LW.loc=p;coords.value=fmtLL(p);sheetDirty=true;upd();reverseFill(p)})};

  const pending=()=>!!$("#lw_choices")?.children.length;
  const tryAuto=()=>{if($("#lw_choices")&&LW&&!LW.loc&&!pending()&&LW.addr().length>5)geocodeLW(true)};
  const auto=()=>{clearTimeout(LW._t);if($("#lw_choices"))$("#lw_choices").innerHTML="";LW._t=setTimeout(tryAuto,1300)};

async function reverseFill(p,silent){
  if(!LW)return;
  const st=$("#lw_status");if(st&&!silent){st.className="lw-status";st.textContent=T("Αναζήτηση διεύθυνσης από το σημείο…")}
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=${LANG}&lat=${p.lat}&lon=${p.lng}`);
    const js=await r.json(),a=js&&js.address;if(!a)throw 0;
    const road=a.road||a.pedestrian||a.footway||"",num=a.house_number||"",zip=a.postcode||"";
    const cand=[a.neighbourhood,a.suburb,a.quarter,a.city_district,a.village,a.town,a.municipality,a.city].filter(Boolean);
    const known=cand.map(x=>findArea(x)).find(Boolean);
    const area=known?known.name:(cand[0]||"");
    if(!known&&area)learnArea(area,p.lat,p.lng);
    const set=(id,v,force)=>{const el=$("#"+id);if(el&&v&&(force||!el.value.trim())){el.value=v;return true}return false};
    const f=[];
    if($("#f_street")){ // φόρμα πελάτη: χωριστά πεδία
      if(set("f_street",road,true))f.push(T("οδός"));
      if(set("f_number",num,true))f.push(T("αριθμός"));
      if(set("f_zip",zip,true))f.push(T("ΤΚ"));
    }else if(set("lw_addr",[road,num].filter(Boolean).join(" ")||js.display_name.split(",").slice(0,2).join(","),true))f.push(T("διεύθυνση"));
    if(set("f_area",area,true)||set("p_area",area,true))f.push(T("περιοχή"));
    sheetDirty=true;LW.upd();
    if(f.length&&!silent)toast(T("Συμπληρώθηκαν από το σημείο: {x}.",{x:f.join(", ")}));
    else if(!f.length&&!silent)toast(T("Το σημείο αποθηκεύτηκε, αλλά δεν βρέθηκε διεύθυνση για αυτό."));
  }catch(e){LW.upd();if(!silent)toast(T("Η διεύθυνση δεν βρέθηκε από το σημείο. Χρειάζεται σύνδεση στο διαδίκτυο."))}
}
async function geocodeLW(silent){
  if(!LW||!$("#lw_status"))return;
  const raw=($("#lw_addr")?.value||"").trim(),direct=parseCoords(raw);
  if(direct&&direct!=="short"){LW.loc=direct;$("#lw_coords").value=fmtLL(direct);sheetDirty=true;reverseFill(direct);return}
  const q=LW.addr();if(!q){if(!silent)toast(T("Γράψε πρώτα διεύθυνση."));return}
  const st=$("#lw_status");st.className="lw-status";st.textContent=T("Αναζήτηση…");$("#lw_choices").innerHTML="";
  try{
    const B=baseLoc();
    const vb=B?`&viewbox=${(B.lng-0.6).toFixed(3)},${(B.lat+0.5).toFixed(3)},${(B.lng+0.6).toFixed(3)},${(B.lat-0.5).toFixed(3)}&bounded=0`:`&viewbox=23.20,38.35,24.20,37.60&bounded=0`;
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=gr&addressdetails=1&accept-language=${LANG}${vb}&q=${encodeURIComponent(q)}`);
    const js=await r.json();
    if(!js.length){LW.upd();if(!silent)toast(T("Δεν βρέθηκε η διεύθυνση. Δοκίμασε στους Χάρτες Google ή διάλεξε στον χάρτη."));return}
    const pick=x=>{LW.loc={lat:+x.lat,lng:+x.lon};
      const ar=(LW.area&&LW.area())||((x.address&&(x.address.suburb||x.address.city||x.address.town||x.address.village))||"");
      if(ar)learnArea(ar,+x.lat,+x.lon);$("#lw_coords").value=fmtLL(LW.loc);$("#lw_choices").innerHTML="";sheetDirty=true;LW.upd();toast(T("Η διεύθυνση βρέθηκε. Έλεγξέ τη στον χάρτη αν θέλεις."))};
    if(js.length===1)return pick(js[0]);
    st.className="lw-status pick";st.textContent=T("Βρέθηκαν {n} σημεία. Πάτα παρακάτω αυτό που θέλεις.",{n:js.length});
    const box=$("#lw_choices");
    const short=x=>{const parts=String(x.display_name||"").split(",").map(t=>t.trim()).filter(Boolean);
      return `<b>${esc(parts.slice(0,2).join(", "))}</b>${parts.length>2?`<small>${esc(parts.slice(2,5).join(", "))}</small>`:""}`};
    box.innerHTML=js.map((x,i)=>`<button type="button" class="choice" data-i="${i}"><span class="cp">${ic("pin",18)}</span><span class="ctx">${short(x)}</span></button>`).join("");
    // επιλογή μόνο με καθαρό πάτημα: αν το δάχτυλο μετακινηθεί (κύλιση), δεν επιλέγεται τίποτα
    let pd=null;
    box.onpointerdown=e=>{pd={x:e.clientX,y:e.clientY,t:Date.now()}};
    box.onpointerup=e=>{const b=e.target.closest("[data-i]");if(!b||!pd)return;
      const moved=Math.hypot(e.clientX-pd.x,e.clientY-pd.y);pd=null;
      if(moved>10)return; // ήταν κύλιση, όχι επιλογή
      e.preventDefault();pick(js[+b.dataset.i])};
    box.onclick=e=>e.preventDefault();
    setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"center"}),60);
  }catch(e){LW.upd();if(!silent)toast(T("Η αναζήτηση χρειάζεται σύνδεση στο διαδίκτυο."))}
}

/* ---------- Χάρτης δουλειών ---------- */
let JM=null,jmLayer=null,jmDay=null,jmFilter="all",jmWho=null;
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())};
const taskDates=x=>[x.start,x.end,x.doneAt,x.cancelledAt].filter(Boolean).map(dayKey);
const jmStatus=x=>x.status==="done"?"done":x.status==="cancelled"?"cx":x.status==="waiting"?"wait":taskState(x)==="late"?"late":x.status==="progress"?"prog":"open";
const JMC={open:"#F2B632",prog:"#2468B5",late:"#C8412B",wait:"#0E7490",done:"#2E7D5B",cx:"#8A96A3",owe:"#8E1F3F"};
const jmOwedAmt=x=>x.free==="labor"?(x.status==="cancelled"?0:laborMat(x).owe):!x.free&&x.status==="done"&&!x.paid&&(+x.amount||0)>0?Math.max(0,rnd((+x.amount||0)-taskPaid(x))):0;
const JMF=[["all","Όλες",""],["open","Ανοιχτές",JMC.open],["owed","Οφειλές",JMC.owe],["late","Εκπρόθεσμες",JMC.late],["wait","Αναμονή",JMC.wait],["done","Ολοκληρωμένες",JMC.done]];
function jmMatch(x){
  if(jmWho&&!(x.who||[]).includes(jmWho))return false;
  if(jmFilter==="all")return true;
  if(jmFilter==="owed")return jmOwedAmt(x)>0.004;
  return jmStatus(x)===jmFilter;
}
function jmJobs(){
  return S.tasks.filter(x=>{
    if(!alive(x))return false;   // ό,τι πήγε στον κάδο δεν εμφανίζεται πουθενά στον χάρτη
    if(!taskLoc(x))return false;
    if(!jmMatch(x))return false;
    if(jmDay)return taskDates(x).includes(jmDay);
    if(jmFilter==="owed")return jmOwedAmt(x)>0.004;
    return isOpen(x)||jmOwedAmt(x)>0.004;
  });
}
const jmNav=L=>`https://www.google.com/maps/dir/?api=1&destination=${L.lat},${L.lng}`;
function jmPopOne(x,L,st,stName,many){

// Πολλές δουλειές στο ίδιο σημείο: πελάτης, συνολική οφειλή και λίστα με όλες τις δουλειές
function jmPopMany(xs,L,stOf,stName){

const jmWhoList=x=>(x.who||[]).map(getPerson).filter(Boolean);
function jmDaysList(){
  const m=new Map();
  // μετράμε μόνο ό,τι θα φαινόταν πραγματικά με το ενεργό φίλτρο, ώστε να μη βγαίνει άδεια μέρα
  S.tasks.forEach(x=>{if(!taskLoc(x)||!jmMatch(x))return;[...new Set(taskDates(x))].forEach(k=>m.set(k,(m.get(k)||0)+1))});
  // μόνο μέρες που έχουν πράγματι δουλειές με τοποθεσία· οι άδειες δεν εμφανίζονται καθόλου
  return[...m.entries()].filter(([,n])=>n>0).sort((a,b)=>b[0].localeCompare(a[0]));

function taskState(x){if(x.status==="cancelled")return"cancelled";if(x.status==="done")return"done";
  if(x.status==="waiting")return"waiting";if(x.status==="someday")return"someday";if(x.end&&new Date(x.end)<new Date())return"late";return x.status}
const isWaiting=x=>x.status==="waiting";
const isSomeday=x=>x.status==="someday";
function touchesToday(x){
  const sod=new Date();sod.setHours(0,0,0,0);const eod=new Date(sod);eod.setDate(eod.getDate()+1);
  const s=x.start?new Date(x.start):null,e=x.end?new Date(x.end):null;
  if(s&&e)return s<eod&&e>=sod;if(s)return s>=sod&&s<eod;if(e)return e>=sod&&e<eod;return false;
}
const dueTime=x=>x.end?+new Date(x.end):x.start?+new Date(x.start):Infinity;
const rank=x=>isSomeday(x)?2:isWaiting(x)?1:0;
const sortKey=x=>[
  (x.end&&new Date(x.end)<new Date())?0:1, // ό,τι έχει λήξει, πρώτο (και οι προσφορές που πέρασε η ημερομηνία τους)
  x.status==="progress"?0:1,          // ό,τι τρέχει τώρα
  touchesToday(x)?0:1,                // ό,τι είναι για σήμερα
  isWaiting(x)?1:0,                   // οι προσφορές σε αναμονή πάνε μετά· περιμένεις απάντηση, δεν εξαρτάται από σένα
  -(x.priority||2),                   // μέσα σε κάθε ομάδα, υψηλή προτεραιότητα πάνω
  dueTime(x),                         // πιο κοντινή ημερομηνία πρώτα, χωρίς ημερομηνία τελευταία
  x.createdAt||0                      // παλιότερη πρώτα, να τελειώνουν με τη σειρά
];
const byAuto=(a,b)=>{const A=sortKey(a),B=sortKey(b);for(let i=0;i<A.length;i++){if(A[i]!==B[i])return A[i]-B[i]}return 0};
const byDue=(a,b)=>S.settings.manualOrder?(((a.ord??1e9)-(b.ord??1e9))||byAuto(a,b)):byAuto(a,b);
const openOrdered=()=>S.tasks.filter(isOpen).sort(byDue);
const freezeOrder=()=>{const l=openOrdered();l.forEach((x,i)=>{x.ord=i});return l};
const posOf=id=>{const i=openOrdered().findIndex(x=>x.id===id);return i<0?0:i+1};
// ανταλλαγή με τη γειτονική γραμμή που βλέπει ο χρήστης, σε όποια λίστα κι αν είναι
function moveTask(id,dir,el){
  const row=el&&el.closest?el.closest(".row.task"):null;
  let other=null;
  if(row){let n=dir==="up"?row.previousElementSibling:row.nextElementSibling;
    while(n&&!n.classList.contains("task"))n=dir==="up"?n.previousElementSibling:n.nextElementSibling;
    if(n){const b=n.querySelector("[data-act=moveTask]");other=b&&b.dataset.id}}
  const list=freezeOrder();
  if(!other){const i=list.findIndex(x=>x.id===id),j=i+(dir==="up"?-1:1);
    if(j<0||j>=list.length){toast(dir==="up"?T("Είναι ήδη πρώτη."):T("Είναι ήδη τελευταία."));return}
    other=list[j].id}
  const a=S.tasks.find(x=>x.id===id),b=S.tasks.find(x=>x.id===other);
  if(!a||!b)return;const t=a.ord;a.ord=b.ord;b.ord=t;
  S.settings.manualOrder=true;persist();render();
}
function groupIds(el){
  const row=el&&el.closest?el.closest(".row.task"):null,box=row?row.parentElement:null;
  if(!box)return null;

function moveTaskTo(id,pos,ids){
  freezeOrder();
  if(ids&&ids.length>1){
    const list=ids.map(i=>S.tasks.find(t=>t.id===i)).filter(Boolean);
    const slots=list.map(t=>t.ord).slice().sort((a,b)=>a-b);
    const i=list.findIndex(t=>t.id===id);if(i<0)return;
    pos=Math.max(1,Math.min(list.length,pos|0));
    const[x]=list.splice(i,1);list.splice(pos-1,0,x);
    list.forEach((t,k)=>{t.ord=slots[k]});
  }else{
    const list=openOrdered(),i=list.findIndex(x=>x.id===id);if(i<0)return;
    pos=Math.max(1,Math.min(list.length,pos|0));
    const[x]=list.splice(i,1);list.splice(pos-1,0,x);
    list.forEach((t,k)=>{t.ord=k});
  }
  S.settings.manualOrder=true;persist();render();toast(T("Πήγε στη θέση {n}.",{n:pos}));
}

function whenText(x){
  if(!x.start&&!x.end)return"";
  const f=t=>new Date(t).toLocaleString(LOC(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const hm=t=>new Date(t).toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"});
  if(x.start&&x.end){
    const sd=new Date(x.start),ed=new Date(x.end);
    if(+sd===+ed)return f(x.start);
    return sd.toDateString()===ed.toDateString()?f(x.start)+" – "+hm(x.end):f(x.start)+" → "+f(x.end);
  }
  return x.start?f(x.start):T("έως")+" "+f(x.end);
}

        ${x.paid?"":`<button class="minibtn full" data-act="settleTask" data-id="${x.id}">${T("Εξοφλήθηκε")}</button>`}
        ${amt-got>0.004?`<span class="owe-mini">${T("υπόλοιπο")} ${money(amt-got)}</span>`:""}</div>`:""}
    </div>

    ${L&&isOpen(x)?`<button class="goto" data-act="destTask" data-id="${x.id}" aria-label="${T("Πήγαινε εκεί")}">${ic("pin",19)}</button>`:""}
    ${isOpen(x)&&showMove&&S.settings.showMove?`<span class="rcol">

function remRow(r){

    ${over?`<button class="readbtn" data-rem="done" data-id="${r.id}">${remDoneLabel(r)}</button>`:""}

}

/* ---------- Σήμερα ---------- */
function vToday(){
  const now=new Date(),open=S.tasks.filter(isOpen);
  const waiting=open.filter(isWaiting).sort(byDue);
  const someday=open.filter(isSomeday).sort(byDue);
  const act2=open.filter(x=>!isWaiting(x)&&!isSomeday(x));
  const late=act2.filter(x=>taskState(x)==="late").sort(byDue);
  const prog=act2.filter(x=>x.status==="progress"&&!late.includes(x));
  const today=act2.filter(x=>!late.includes(x)&&!prog.includes(x)&&touchesToday(x)).sort(byDue);
  const urgent=act2.filter(x=>(x.priority||2)===3&&!late.includes(x)&&!prog.includes(x)&&!today.includes(x)).sort(byDue);
  const soon=act2.filter(x=>!late.includes(x)&&!prog.includes(x)&&!today.includes(x)&&!urgent.includes(x)&&dueTime(x)<Infinity).sort(byDue);
  const noDate=act2.filter(x=>!x.start&&!x.end&&x.status!=="progress"&&!urgent.includes(x)&&!soon.includes(x))
    .sort((a,b)=>S.settings.manualOrder?byDue(a,b):((b.priority||2)-(a.priority||2)||(a.createdAt||0)-(b.createdAt||0)));
  const overR=S.reminders.filter(remOver).sort(byWhen);
  const actR=S.reminders.filter(r=>remVis(r)&&!remOver(r)).sort((a,b)=>(isDaily(a)-isDaily(b))||byWhen(a,b));
  const next=actR.slice(0,3);
  let h=`<div class="today-date">${cap(now.toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"}))}</div>
  <p class="today-sub">${open.length?pl(open.length,"{n} ανοιχτή εργασία","{n} ανοιχτές εργασίες"):T("Καμία ανοιχτή εργασία")}</p>`;
  if(overR.length)h+=sec(T("Έληξαν, δεν τις έχεις διαβάσει"),"red")+`<div class="panel overpanel">${overR.map(remRow).join("")}</div>`;
  h+=`<div class="ctarow">
    <button class="cta2" data-act="pickDest" data-mode="go">${ic("route",26)}<b>${T("Πού πηγαίνεις;")}</b><small>${T("δες τι πιάνεις στον δρόμο")}</small></button>
    <button class="cta2" data-act="jobsMap">${ic("map",26)}<b>${T("Χάρτης δουλειών")}</b><small>${T("πινέζες και παλιότερες μέρες")}</small></button></div>`;
  if(localFile())h+=`<div class="banner warnbar"><span><b>${T("Τρέχει ως τοπικό αρχείο.")}</b> ${T("Η τοποθεσία, οι επαφές και η μόνιμη αποθήκευση δεν δουλεύουν έτσι. Ανέβασε την εφαρμογή στο διαδίκτυο και άνοιξέ τη από τη διεύθυνσή της.")}</span></div>`;
  const hasData=S.clients.length||S.tasks.length||S.reminders.length;
  if(hasData&&S.meta.changes>=S.settings.backupEvery)h+=`<div class="banner"><span>${S.meta.lastBackup?pl(S.meta.changes,"{n} αλλαγή από το τελευταίο αντίγραφο ασφαλείας.","{n} αλλαγές από το τελευταίο αντίγραφο ασφαλείας."):T("Δεν έχεις κρατήσει ακόμα αντίγραφο ασφαλείας.")}</span><button class="btn amber small" data-act="backup">${T("Αντίγραφο τώρα")}</button></div>`;
  if(late.length)h+=sec(T("Εκπρόθεσμες"),"red")+panel(late.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(prog.length)h+=sec(T("Σε εξέλιξη"))+panel(prog.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(today.length)h+=sec(T("Σήμερα"))+panel(today.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(urgent.length)h+=sec(T("Επείγοντα"),"red")+panel(urgent.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(soon.length)h+=sec(T("Προσεχώς"))+panel(soon.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  const bundleGroups=new Map();
  noDate.forEach(x=>{
    const c=x.clientId&&getClient(x.clientId),area=(c&&c.area)||x.area;
    if(!area)return;
    if(!bundleGroups.has(area))bundleGroups.set(area,[]);
    bundleGroups.get(area).push(x);
  });
  const suggestions=[...bundleGroups.entries()].filter(([,list])=>list.length>=2);
  // δουλειές χωρίς ημερομηνία που κάθονται πάνω από 10 μέρες: πρόταση να μπουν σε πρόγραμμα ή σε «όποτε βρω χρόνο»
  const staleCut=Date.now()-10*86400000;
  const stale=noDate.filter(x=>(x.createdAt||0)<staleCut);
  const sugRows=[];
  suggestions.forEach(([area,list])=>sugRows.push(
    `<div class="row" data-act="bundleSuggest" data-area="${esc(area)}" style="align-items:center">
      <span style="color:var(--loc)">${ic("route",22)}</span>
      <div class="grow"><div class="title">${esc(area)}</div>
      <div class="meta"><span>${pl(list.length,"{n} δουλειά χωρίς ημερομηνία — θες να τη δεις στη διαδρομή;","{n} δουλειές χωρίς ημερομηνία — θες να τις δεις μαζί στη διαδρομή;",{n:list.length})}</span></div></div>
      <span style="color:var(--muted);font-size:20px">›</span></div>`));
  if(stale.length)sugRows.push(
    `<div class="row" data-act="staleSuggest" style="align-items:center">
      <span style="color:var(--muted)">${ic("today",22)}</span>
      <div class="grow"><div class="title">${pl(stale.length,"{n} δουλειά είναι εδώ και πάνω από 10 μέρες χωρίς ημερομηνία","{n} δουλειές είναι εδώ και πάνω από 10 μέρες χωρίς ημερομηνία",{n:stale.length})}</div>
      <div class="meta"><span>${T("Θες να τις δεις και να βάλεις ημερομηνία ή να τις πας σε «όποτε βρω χρόνο»;")}</span></div></div>
      <span style="color:var(--muted);font-size:20px">›</span></div>`);
  if(sugRows.length)h+=sec(T("Προτάσεις"))+panel(sugRows.join(""));
  if(noDate.length)h+=sec(T("Χωρίς ημερομηνία"))+panel(noDate.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(!late.length&&!today.length&&!prog.length&&!noDate.length&&!urgent.length&&!soon.length)h+=sec(T("Σήμερα"))+panel(`<div class="empty">${T("Τίποτα για σήμερα. Πάτα + για νέα εργασία, πελάτη ή υπενθύμιση.")}</div>`);
  if(waiting.length)h+=sec(T("Προσφορές σε αναμονή απάντησης"))+panel(waiting.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  if(someday.length)h+=sec(T("Όποτε βρω χρόνο"))+panel(someday.map((x,i)=>taskRow(x,true,true,false,i+1)).join(""));
  const soonW=S.tasks.filter(x=>alive(x)&&x.status==="done").map(x=>({x,u:warrantyUntil(x)}))
    .filter(o=>o.u&&o.u>now&&o.u-now<30*86400000).sort((a,b)=>a.u-b.u);
  if(soonW.length)h+=sec(T("Λήγουν εγγυήσεις σύντομα"))+panel(soonW.map(({x,u})=>{const c=x.clientId&&getClient(x.clientId);
    return `<div class="row" data-act="editTask" data-id="${x.id}"><span style="color:var(--loc)">${ic("shield",20)}</span>
      <div class="grow"><div class="title">${esc(x.title)}</div><div class="meta">${c?`<span>${esc(c.name)}</span>`:""}<span>${T("έως {d}",{d:fmtShort(u)})}</span></div></div></div>`}).join(""));
  h+=`<div class="sec-row">${sec(T("Επόμενες υπενθυμίσεις"))}${actR.length>3?`<button class="btn ghost small" style="margin-bottom:8px" data-act="allRem">${T("Δες όλες")} (${actR.length})</button>`:""}</div>`
    +panel(next.length?next.map(remRow).join(""):`<div class="empty">${T("Καμία υπενθύμιση. Πάτα το κουδούνι στην κάτω μπάρα για να προσθέσεις.")}</div>`);
  return h;
}

/* ---------- Πελάτες ---------- */
const CSORT=[["work","Με εκκρεμότητες"],["az","Αλφαβητικά"],["money","Περισσότερα χρήματα"],["stars","Καλύτερη αξιολόγηση"]];
function vClients(){return `<button class="filterbar" data-act="filterSheet" data-kind="clients">${ic("filter",18)}<span>${T(CSORT.find(x=>x[0]===clientSort)[1])}</span><i>▾</i></button>
  <div class="inrow" style="margin-bottom:12px"><input class="search" id="cSearch" type="search" placeholder="${T("Αναζήτηση πελάτη")}" value="${esc(clientSearch)}"><button class="contactsbtn small" data-act="importContacts"><span class="cicon">${ic("book",17)}</span>${T("Επαφές")}</button></div><div id="clientList">${clientListHTML()}</div>`}
const clientEarned=c=>cMoney(c).received;
function clientListHTML(){
  if(!S.clients.length)return panel(`<div class="empty">${T("Δεν έχεις πελάτες ακόμα. Πάτα + για να προσθέσεις τον πρώτο ή φέρε πελάτες από τις επαφές σου.")}</div>`);
  const q=norm(clientSearch);
  const list=S.clients.filter(alive).filter(c=>!q||norm([c.name,c.company,c.area,c.mobile,c.phone,c.street].join(" ")).includes(q));
  if(!list.length)return panel(`<div class="empty">${T("Κανένας πελάτης δεν ταιριάζει στην αναζήτηση.")}</div>`);
  const rows=list.map(c=>({c,open:S.tasks.filter(x=>x.clientId===c.id&&isOpen(x)).sort(byDue),earned:clientEarned(c)}));
  const az=(a,b)=>a.c.name.localeCompare(b.c.name,"el");
  let busy=[],rest=[],head="",headRest="";
  if(clientSort==="work"){rows.forEach(r=>(r.open.length?busy:rest).push(r));
    busy.sort((a,b)=>byDue(a.open[0],b.open[0])||b.open.length-a.open.length);rest.sort(az);
    head=T("Με εκκρεμότητες");headRest=busy.length?T("Όλοι οι υπόλοιποι"):T("Πελάτες")}
  else{rest=rows;headRest=T("Πελάτες");
    if(clientSort==="az")rest.sort(az);
    else if(clientSort==="money")rest.sort((a,b)=>b.earned-a.earned||az(a,b));
    else rest.sort((a,b)=>(b.c.rating||0)-(a.c.rating||0)||b.earned-a.earned||az(a,b));}
  const row=({c,open})=>{const tel=c.mobile||c.phone,late=open.some(x=>taskState(x)==="late"),nx=open[0];
    return `<div class="row" data-act="openClient" data-id="${c.id}" style="align-items:center"><div class="avatar ${open.length?"busy":""}">${esc(initials(c.name))}</div>
      <div class="grow"><div class="title">${esc(c.name)}</div><div class="meta">${c.company?`<span>${esc(c.company)}</span>`:""}${c.area?`<span>${esc(c.area)}</span>`:""}
      ${open.length?`<span class="count ${late?"late":""}">${pl(open.length,"{n} ανοιχτή","{n} ανοιχτές")}</span>`:""}</div>
      ${nx?`<div class="meta"><span>${T("Επόμενη")}: ${esc(nx.title)}${dueTime(nx)<Infinity?", "+fmt(nx.end||nx.start):""}</span></div>`:""}
      ${c.rating||clientSort==="stars"?starsHTML(c.rating,null,15,true):""}
      ${clientSort==="money"?`<div class="meta"><span class="count">${money(clientEarned(c))}</span></div>`:""}</div>
      <span class="cbtns">
        ${tel?`<a class="callbtn" data-act="noop" href="tel:${esc(tel.replace(/\s/g,""))}" aria-label="${T("Κλήση")}">${ic("phone",17)}</a>`:""}
        ${tel?`<button class="callbtn msgb" data-act="msgClient" data-id="${c.id}" aria-label="${T("Μήνυμα")}">${ic("msg",17)}</button>`:""}
        ${clientLoc(c)?`<button class="callbtn navb" data-act="navClient" data-id="${c.id}" aria-label="${T("Πλοήγηση")}">${ic("pin",17)}</button>`:""}
      </span></div>`};
  return (busy.length?sec(head)+panel(busy.map(row).join("")):"")+
    (rest.length?sec(headRest)+panel(rest.map(row).join("")):"");
}
function clientAddress(c){return[[c.street,c.number].filter(Boolean).join(" "),c.area,c.zip].filter(Boolean).join(", ")}
function navUrl(c){
  if(c.lat!=null)return`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`;
  const addr=clientAddress(c);if(c.street&&addr)return`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}`;
  const L=clientLoc(c);return L?`https://www.google.com/maps/dir/?api=1&destination=${L.lat},${L.lng}`:"";
}
function entryRow(e,showClient){
  const c=e.clientId&&getClient(e.clientId);
  return `<div class="row ent ${e.cancelled?"cx":""}" data-act="editEntry" data-id="${e.id}">
    <span class="entic ${entIn(e)?"in":"out"}">${entIn(e)?"+":"−"}</span>

    <div class="meta"><span>${fmtDay(e.date)}</span>${showClient&&c?`<span>${esc(c.name)}</span>`:""}${(()=>{const t=e.taskId&&S.tasks.find(x=>x.id===e.taskId);return t?`<span class="entjob">▸ ${esc(t.title)}</span>`:""})()}${e.byClient?`<span class="bycTag">${T("πλήρωσε ο πελάτης")}</span>`:passThru(e)?`<span class="bycTag">${T("τα καλύπτει ο πελάτης")}</span>`:""}${e.cancelled?`<span style="color:var(--red);font-weight:700">${T("ακυρώθηκε")}</span>`:""}</div></div>
    <b class="amt ${entIn(e)?"in":"out"} ${e.byClient?"byc":""}">${entIn(e)?"":"−"}${money(e.amount)}</b></div>`;

/* ---------- Κινήσεις πελάτη με φίλτρα: έσοδα/έξοδα, είδη (πολλαπλά), δουλειές (πολλαπλές), περίοδος ---------- */
const isOutRow=e=>entDir(e)==="out";
let cef={cid:null,dir:"all",kinds:[],tasks:[],per:"all"};
const cefReset=cid=>{if(cef.cid!==cid)cef={cid,dir:"all",kinds:[],tasks:[],per:"all"}};
function cefPass(e,skip){
  if(skip!=="dir"&&cef.dir!=="all"&&(cef.dir==="in"?!entIn(e):!isOutRow(e)))return false;
  if(skip!=="kind"&&cef.kinds.length&&!cef.kinds.includes(e.kind))return false;
  if(skip!=="task"&&cef.tasks.length&&!cef.tasks.includes(e.taskId||"none"))return false;
  if(skip!=="per"&&cef.per!=="all"){const[a,b]=tfPeriodRange(cef.per),d=+new Date(e.date);if(d<a||d>=b)return false}
  return true;
}
const cefActive=()=>cef.dir!=="all"||cef.kinds.length||cef.tasks.length||cef.per!=="all";
const taskTitle=id=>id==="none"?T("Χωρίς δουλειά"):((S.tasks.find(x=>x.id===id)||{}).title||"");
const multiLbl=(arr,name,all)=>!arr.length?all:arr.length===1?name(arr[0]):name(arr[0])+" +"+(arr.length-1);
function cefLabel(){
  const p=[];if(cef.dir!=="all")p.push(cef.dir==="in"?T("Έσοδα"):T("Έξοδα"));
  if(cef.kinds.length)p.push(cef.kinds.map(k=>T(getKind(k).name)).join(", "));
  if(cef.tasks.length)p.push(cef.tasks.map(taskTitle).join(", "));
  if(cef.per!=="all")p.push(tfPeriodName(cef.per));
  return p.join(" · ");
}
// Σύνολα κινήσεων: με «Έσοδα» ή «Έξοδα» δείχνει μόνο αυτό (και τι μένει κρυφό), ώστε να μη φαίνεται «0 €» σαν να μην υπάρχουν
function bycNoteHTML(list){
  const pt=(list||[]).filter(e=>!e.cancelled&&passThru(e));
  const ptIn=rnd(pt.filter(e=>entDir(e)==="in").reduce((a,e)=>a+e.amount,0)),ptOut=rnd(pt.filter(e=>entDir(e)==="out").reduce((a,e)=>a+e.amount,0));
  const ptNote=pt.length?`<p class="note" style="margin:0 2px 6px">${T("Δωρεάν εργασία: πήρες {a} από τον πελάτη και πλήρωσες έξοδα {b} για τη δουλειά. Αυτά δεν μετράνε ως έσοδα ή έξοδα.",{a:money(ptIn),b:money(ptOut)})}${ptOut>ptIn+0.004?" <b style='color:var(--red)'>"+T("Σου χρωστάει για τα έξοδα {a}.",{a:money(rnd(ptOut-ptIn))})+"</b>":ptIn>ptOut+0.004?" "+T("Σου περισσεύουν {a} από τα χρήματά του.",{a:money(rnd(ptIn-ptOut))}):""}</p>`:"";
  return ptNote+bycNoteOnly(list);
}
function bycNoteOnly(list){
  const byc=(list||[]).filter(e=>e.byClient&&!e.cancelled&&isOutRow(e)),bycS=rnd(byc.reduce((s2,e)=>s2+e.amount,0));
  return byc.length?`<p class="note" style="margin:0 2px 6px">${T("Υλικά που πλήρωσε ο πελάτης: {a} ({n}). Φαίνονται για καταγραφή, δεν μετράνε στα έξοδα ούτε στο Ταμείο.",{a:money(bycS),n:byc.length})}</p>`:"";
}
function entSumHTML(dir,inS,outS,n,allList,list){
  const bycNote=bycNoteHTML(list);
  if(dir==="all")return `<div class="sum3"><div class="sumcard"><span>${T("Έσοδα")}</span><b class="money">${money0(inS)}</b></div>
      <div class="sumcard"><span>${T("Έξοδα")}</span><b class="owe">${money0(outS)}</b></div>
      <div class="sumcard"><span>${T("Καθαρό")}</span><b>${money0(rnd(inS-outS))}</b></div></div>`+bycNote;
  const other=allList.filter(e=>!e.cancelled&&(dir==="in"?entOut(e):entIn(e)));
  const oS=rnd(other.reduce((s2,e)=>s2+e.amount,0));
  return `<div class="sum3" style="grid-template-columns:1fr 1fr"><div class="sumcard"><span>${dir==="in"?T("Έσοδα"):T("Έξοδα")}</span><b class="${dir==="in"?"money":"owe"}">${money0(dir==="in"?inS:outS)}</b></div>
      <div class="sumcard"><span>${T("Κινήσεις")}</span><b>${n}</b></div></div>
    ${other.length?`<p class="note" style="margin:0 2px 6px">${dir==="in"?T("Βλέπεις μόνο έσοδα. Υπάρχουν και {n} έξοδα ({a}): πάτα «Όλες» ή «Έξοδα».",{n:other.length,a:money(oS)}):T("Βλέπεις μόνο έξοδα. Υπάρχουν και {n} έσοδα ({a}): πάτα «Όλες» ή «Έσοδα».",{n:other.length,a:money(oS)})}</p>`:""}`+bycNote;
}
function clientEntriesHTML(c,all){

function cefPickSheet(k){

    const cnt=v=>{const[a,b]=tfPeriodRange(v);return base.filter(e=>{const d=+new Date(e.date);return d>=a&&d<b}).length};
    const cy=new Date().getFullYear(),ys=[...new Set(base.map(e=>new Date(e.date).getFullYear()))].filter(y=>y&&y<cy).sort((a,b)=>b-a);
    openSheet({title:T("Ποια περίοδος;"),body:panel(TFP.map(([v,l])=>row(v,T(l),cnt(v),cef.per===v)).join("")+ys.map(y=>row("y"+y,String(y),cnt("y"+y),cef.per==="y"+y)).join("")),cancelLabel:T("Κλείσιμο")});

    else{const m=new Map();base.forEach(e=>{const id=e.taskId||"none";m.set(id,(m.get(id)||0)+1)});
      const ids=[...m.keys()].filter(id=>id==="none"||S.tasks.some(x=>x.id===id)).sort((a,b)=>a==="none"?1:b==="none"?-1:((S.tasks.find(x=>x.id===b)||{}).createdAt||0)-((S.tasks.find(x=>x.id===a)||{}).createdAt||0));

  };

    onSave:()=>{if(k==="kind")cef.kinds=[...sel];else cef.tasks=[...sel];render()}});

/* ---------- Φίλτρα εργασιών: πελάτης, άτομο, περίοδος (ιστορικό ολοκληρωμένων) ---------- */
const tfHistory=()=>["done","cancelled","all"].includes(taskFilter);
const tfDate=x=>{const d=x.completedOn?new Date(x.completedOn+"T12:00"):null;return +(d||x.doneAt||x.cancelledAt||x.end||x.start||x.createdAt||0)||0};
const tfActive=()=>!!(tfClient||tfWho||(tfHistory()&&tfPeriod!=="all"));
function tfPeriodRange(k){
  const n=new Date(),y=n.getFullYear();
  if(k==="month")return[+new Date(y,n.getMonth(),1),Infinity];
  if(k==="quarter"){const d=new Date(n);d.setMonth(d.getMonth()-3);return[+d,Infinity]}
  if(k==="year")return[+new Date(y,0,1),Infinity];
  if(/^y\d{4}$/.test(k)){const yy=+k.slice(1);return[+new Date(yy,0,1),+new Date(yy+1,0,1)]}
  return[-Infinity,Infinity];
}
function tfPass(x,skip){
  if(skip!=="client"&&tfClient){if(tfClient==="none"?!!x.clientId:x.clientId!==tfClient)return false}
  if(skip!=="who"&&tfWho&&!(x.who||[]).includes(tfWho))return false;
  if(skip!=="period"&&tfHistory()&&tfPeriod!=="all"){const[a,b]=tfPeriodRange(tfPeriod),d=tfDate(x);if(d<a||d>=b)return false}
  return true;
}
const TFP=[["all","Όλο το διάστημα"],["month","Αυτόν τον μήνα"],["quarter","Τελευταίο τρίμηνο"],["year","Φέτος"]];
const tfPeriodName=k=>/^y\d{4}$/.test(k)?k.slice(1):T((TFP.find(p=>p[0]===k)||TFP[0])[1]);
function tfBarHTML(){
  if(!tfHistory()&&!S.tasks.some(alive))return "";
  const c=tfClient&&tfClient!=="none"?getClient(tfClient):null,w=tfWho&&getPerson(tfWho);

let moneyPeriod="month";
const PERIODS=[["month","Αυτόν τον μήνα"],["quarter","Τελευταίο τρίμηνο"],["half","Τελευταίο εξάμηνο"],["year","Φέτος"],["all","Όλα"]];
function moneyDataYears(){
  const ys=new Set();
  S.ledger.filter(alive).forEach(e=>{if(e.date)ys.add(new Date(e.date).getFullYear())});
  S.tasks.filter(alive).forEach(x=>{if(x.doneAt)ys.add(new Date(x.doneAt).getFullYear())});
  const cur=new Date().getFullYear();ys.delete(cur);
  return[...ys].sort((a,b)=>b-a);
}
function periodLabel(k){
  const f=PERIODS.find(x=>x[0]===k);if(f)return T(f[1]);
  if(/^\d{4}$/.test(k))return k;
  return T(PERIODS[0][1]);
}
function periodRange(){
  const d=new Date();d.setHours(0,0,0,0);
  if(moneyPeriod==="month"){const s=new Date(d);s.setDate(1);return[s,null]}
  if(moneyPeriod==="quarter"){const s=new Date(d);s.setMonth(s.getMonth()-3);return[s,null]}
  if(moneyPeriod==="half"){const s=new Date(d);s.setMonth(s.getMonth()-6);return[s,null]}
  if(moneyPeriod==="year"){return[new Date(d.getFullYear(),0,1),null]}
  if(/^\d{4}$/.test(moneyPeriod)){const y=+moneyPeriod;return[new Date(y,0,1),new Date(y+1,0,1)]}
  return[null,null];
}
function periodStart(){return periodRange()[0]}

// Δείχνει από πού βγαίνει κάθε ευρώ που εισπράχθηκε από τον πελάτη, ανά κατάσταση δουλειάς.
function clientIncomeSheet(id,back){
  const c=getClient(id);if(!c)return;
  const list=cEntries(c.id).filter(e=>!e.cancelled&&entIn(e));
  const groups=[
    ["done",T("Για ολοκληρωμένες δουλειές"),""],
    ["open",T("Για δουλειές σε εξέλιξη"),""],
    ["offer",T("Για προσφορές που δεν έχουν εγκριθεί"),T("Η δουλειά είναι ακόμα προσφορά — μήπως εγκρίθηκε και πρέπει να αλλάξει η κατάστασή της;")],
    ["dead",T("Για ακυρωμένες ή διαγραμμένες δουλειές"),T("Αυτά μετράνε ως εισπράξεις, αλλά η δουλειά τους δεν υπάρχει ή ακυρώθηκε. Αν δεν τα πήρες ποτέ, σβήσ' τα ή ακύρωσέ τα.")],
    ["none",T("Χωρίς δουλειά"),T("Εισπράξεις που δεν συνδέθηκαν με κάποια δουλειά. Πάτα την κίνηση και διάλεξε «Δουλειά» για να μπει εκεί που ανήκει.")]];
  const where=e=>{
    if(!e.taskId)return "none";
    const x=S.tasks.find(t=>t.id===e.taskId);
    if(!x||!alive(x)||x.status==="cancelled")return "dead";
    if(x.status==="done")return "done";
    if(x.status==="waiting")return "offer";
    return "open";
  };
  const by={};list.forEach(e=>{const g=where(e);(by[g]=by[g]||[]).push(e)});
  // πιθανές διπλές: ίδιο ποσό, ίδια μέρα, ίδια δουλειά
  const seen={},dup=new Set();
  list.forEach(e=>{const k=[e.amount,String(e.date).slice(0,10),e.taskId||"",e.kind].join("|");
    if(seen[k]){dup.add(e.id);dup.add(seen[k])}else seen[k]=e.id});
  const total=rnd(list.reduce((s2,e)=>s2+e.amount,0));
  const body=`<p class="note">${T("Κάθε κίνηση εσόδου αυτού του πελάτη, χωρισμένη ανάλογα με τη δουλειά στην οποία ανήκει. Πάτα όποια κίνηση θέλεις για να τη διορθώσεις.")}</p>
    ${panel(`<div class="kv"><span>${T("Σύνολο εισπράξεων")}</span><b class="money">${money(total)}</b></div>`)}
    ${dup.size?`<div class="oflock" style="border-color:var(--red);color:var(--red)">${ic("shield",22)}<div><b>${pl(dup.size,"{n} κίνηση μοιάζει διπλή","{n} κινήσεις μοιάζουν διπλές")}</b><span>${T("Ίδιο ποσό, ίδια μέρα, ίδια δουλειά. Είναι σημειωμένες με ⚠ παρακάτω.")}</span></div></div>`:""}
    ${groups.filter(([g])=>by[g]&&by[g].length).map(([g,title,hint])=>{
      const arr=by[g],sum=rnd(arr.reduce((s2,e)=>s2+e.amount,0));
      return `<div class="sec-row">${sec(title+" · "+money(sum),g==="dead"||g==="offer"?"warnsec":"")}</div>
        ${hint?`<p class="note" style="margin-top:-4px">${hint}</p>`:""}
        ${panel(arr.map(e=>(dup.has(e.id)?`<div class="dupmark">⚠ ${T("πιθανή διπλή καταχώρηση")}</div>`:"")+entryRow(e,true)).join(""))}`}).join("")}`;
  openSheet({title:c.name,cancelLabel:T("Πίσω"),onCancel:back||null,body});
}

function statsSheet(){
  const unk=S.ledger.filter(e=>alive(e)&&!e.cancelled&&entDir(e)==="unknown");
  const cm=S.clients.filter(alive).map(c=>({c,m:cMoney(c)})).filter(x=>x.m.received>0.004).sort((a,b)=>b.m.received-a.m.received).slice(0,8);
  const areaMap=new Map();

let moneyOpenMonths=null;
function monthKey(d){const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1)}
function monthLabel(k){const[y,m]=k.split("-");return cap(new Date(+y,+m-1,1).toLocaleDateString(LOC(),{month:"long",year:"numeric"}))}
function moneyEntriesHTML(ent){
  if(!ent.length)return panel(`<div class="empty">${T("Καμία κίνηση σε αυτή την περίοδο.")}</div>`);
  const groups=new Map();
  ent.forEach(e=>{const k=monthKey(e.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
  if(groups.size<=1)return panel(ent.map(e=>entryRow(e,true)).join(""));
  if(!moneyOpenMonths)moneyOpenMonths=new Set([[...groups.keys()][0]]);
  return[...groups.entries()].map(([k,list])=>{
    const open=moneyOpenMonths.has(k);
    const sum=list.reduce((s,e)=>s+(entIn(e)?e.amount:-e.amount),0);
    return `<button class="monthhead" data-act="toggleMonth" data-mk="${k}"><b>${monthLabel(k)}</b>
        <span class="mcnt">${pl(list.length,"{n} κίνηση","{n} κινήσεις")}</span>
        <span class="msum ${sum>=0?"in":"out"}">${sum>=0?"+":"−"}${money0(Math.abs(sum))}</span>
        <i class="mchev">${open?"▾":"▸"}</i></button>`+
      (open?panel(list.map(e=>entryRow(e,true)).join("")):"");
  }).join("");
}

// Λογότυπο / υδατογράφημα: κρατάει τη διαφάνεια (PNG) και μικραίνει ώσπου να χωράει άνετα στη μνήμη
function pickLogoFile(file,maxDim,cb){
  const rd=new FileReader();
  rd.onerror=()=>cb(null);
  rd.onload=()=>{const im=new Image();
    im.onerror=()=>cb(null);
    im.onload=()=>{
      let dim=maxDim||520,out=null;
      for(let i=0;i<6;i++){
        const sc=Math.min(1,dim/Math.max(im.naturalWidth,im.naturalHeight));
        const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);
        out=cv.toDataURL("image/png");if(out.length<200000)break;
        const wb=cv.toDataURL("image/webp",.85);if(wb.startsWith("data:image/webp")&&wb.length<200000){out=wb;break}
        dim=Math.round(dim*.75);
      }
      cb(out)};
    im.src=rd.result};
  rd.readAsDataURL(file);
}

function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("img"));img.src=rd.result;
    };
    rd.onerror=()=>reject(new Error("read"));rd.readAsDataURL(file);
  });
}

// Αποθήκευση της φωτογραφίας (με τις ενδείξεις) ως κανονική εικόνα στο κινητό
async function savePhotoFile(ph,who){
  try{const bl=await(await fetch(ph.dataUrl)).blob();
    const name=`${fsSlug?fsSlug(who||"foto"):"foto"}-${new Date(ph.at||Date.now()).toISOString().slice(0,10)}-${String(ph.id||"").slice(-4)}.jpg`;
    const file=new File([bl],name,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:who||""});return}catch(e){if(e&&e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(T("Η εικόνα αποθηκεύτηκε στις «Λήψεις»."))}
  catch(e){toast(T("Η εικόνα δεν αποθηκεύτηκε."))}
}

function routeStops(A,B,limit){
  if(route.mode==="many")limit=Math.max(limit,8);
  const direct=km(A,B),map=new Map();let noLoc=0;
  S.tasks.filter(isOpen).forEach(x=>{const L=taskLoc(x);if(!L){noLoc++;return}
    const key=L.lat.toFixed(4)+","+L.lng.toFixed(4);if(!map.has(key))map.set(key,{key,loc:L,tasks:[]});map.get(key).tasks.push(x)});
  const stops=[],atDest=[];
  map.forEach(s=>{
    if(km(s.loc,B)<0.2){atDest.push(...s.tasks);return}
    const dA=km(A,s.loc),dB=km(s.loc,B),det=Math.max(0,dA+dB-direct);
    const soon=s.tasks.some(x=>x.end&&new Date(x.end)-Date.now()<86400000);
    if(det<=limit||(soon&&det<=limit*2)){s.detour=det;s.soon=soon;s.pos=dA/((dA+dB)||1);stops.push(s)}
  });
  if(route.mode==="many"&&stops.length>1){
    // σειρά «πλησιέστερου επόμενου», ώστε να μαζεύεις όσες περισσότερες με τα λιγότερα χιλιόμετρα
    const rest=stops.slice(),ord=[];let cur=A;
    while(rest.length){let bi=0,bd=Infinity;
      rest.forEach((s,i)=>{const d=km(cur,s.loc)+km(s.loc,B)*0.25;if(d<bd){bd=d;bi=i}});
      cur=rest[bi].loc;ord.push(rest.splice(bi,1)[0]);}
    return{direct,stops:ord,noLoc,atDest};
  }
  stops.sort((a,b)=>a.pos-b.pos);
  return{direct,stops,noLoc,atDest};
}

function nearRouteDebts(A,B,stops){
  const pts=[A,...stops.map(s=>s.loc),B];
  const already=new Set();stops.forEach(s=>s.tasks.forEach(t=>{if(t.clientId)already.add(t.clientId)}));
  return S.clients.filter(alive).filter(c=>!already.has(c.id)).map(c=>{
    const L=clientLoc(c);if(!L)return null;
    const m=cMoney(c);if(m.owed<=0.004)return null;
    const d=Math.min(...pts.map(p=>km(p,L)));
    return d<=1.5?{c,m,d}:null;
  }).filter(Boolean).sort((a,b)=>a.d-b.d).slice(0,3);
}

// Πραγματικά χιλιόμετρα και λεπτά από δημόσια υπηρεσία δρομολόγησης, με εφεδρεία την εκτίμηση
const roadCache=new Map();
async function roadRoute(pts){
  if(!S.settings.realRoute||localFile()||!navigator.onLine)return null;
  const key=pts.map(p=>p.lat.toFixed(4)+","+p.lng.toFixed(4)).join(";");
  if(roadCache.has(key))return roadCache.get(key);
  const coords=pts.map(p=>p.lng.toFixed(6)+","+p.lat.toFixed(6)).join(";");
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),8000);
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=false&alternatives=false&steps=false`,{signal:ctrl.signal});
    const js=await r.json();
    if(js&&js.routes&&js.routes[0]){
      const out={km:js.routes[0].distance/1000,min:js.routes[0].duration/60};
      roadCache.set(key,out);return out;
    }
  }catch(e){}finally{clearTimeout(tm)}
  roadCache.set(key,null);return null;
}
async function refineRoute(A,B,sel){
  const el=$("#sumReal");if(!el)return;
  el.innerHTML=`<span class="calc">${T("υπολογίζω πραγματικά χιλιόμετρα…")}</span>`;
  const [direct,full]=await Promise.all([roadRoute([A,B]),roadRoute([A,...sel.map(s=>s.loc),B])]);
  const box=$("#sumReal"),est=$("#sumEst");if(!box)return;
  if(!direct||!full){box.textContent="";return}
  const dk=rnd(full.km-direct.km),dm=Math.round(full.min-direct.min);
  box.innerHTML=sel.length
    ? T("Απευθείας {c} σε {d} λεπτά. Με {n} περίπου {a} σε {b} λεπτά, δηλαδή {x} και {y} λεπτά παραπάνω.",
        {c:fmtKm(direct.km),d:Math.round(direct.min),n:pl(sel.length,"{n} στάση","{n} στάσεις"),
         a:fmtKm(full.km),b:Math.round(full.min),x:fmtKm(dk),y:dm})
    : T("Απευθείας {c} σε {d} λεπτά.",{c:fmtKm(direct.km),d:Math.round(direct.min)});
  box.innerHTML+=` <span class="calc">${T("πραγματικός δρόμος")}</span>`;
  if(est)est.style.display="none";
}

async function findAnywhere(q){
  q=String(q||"").trim();if(!q)return null;
  const loc=resolvePlace(q);if(loc)return loc;
  const p=parseCoords(q);if(p&&p!=="short")return{lat:p.lat,lng:p.lng,label:q};
  const key=norm(q);if(geoCache.has(key))return geoCache.get(key);
  if(localFile()||!navigator.onLine)return null;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=gr&accept-language=${LANG}&q=${encodeURIComponent(q)}`);
    const js=await r.json();
    if(js&&js[0]){const out={lat:+js[0].lat,lng:+js[0].lon,label:(js[0].name||q)};geoCache.set(key,out);learnArea(out.label,out.lat,out.lng);return out}
  }catch(e){}

}

function filterSheet(kind){
  const TF=[["open","Ανοιχτές"],["today","Σήμερα"],["late","Εκπρόθεσμες"],["waiting","Προσφορές"],["noloc","Χωρίς τοποθεσία"],["done","Ολοκληρωμένες"],["cancelled","Ακυρωμένες"],["all","Όλες"]];
  const cnt=k=>S.tasks.filter(alive).filter(x=>k==="open"?isOpen(x):k==="today"?isOpen(x)&&touchesToday(x):k==="late"?taskState(x)==="late":k==="waiting"?isWaiting(x):k==="someday"?isSomeday(x):k==="noloc"?isOpen(x)&&!taskLoc(x):k==="cancelled"?x.status==="cancelled":k==="done"?x.status==="done":true).length;
  let title,body;

    title=T("Εμφάνιση εργασιών");

      `<button class="optrow" style="margin-top:10px;border:1px solid var(--line);border-radius:12px" data-act="toggleMove">${ic("tasks",18)}${T("Κουμπιά αλλαγής σειράς")}<span class="tick">${S.settings.showMove?"✓":""}</span></button>`+
      `<button class="optrow" style="margin-top:10px;border:1px solid var(--line);border-radius:12px" data-act="toggleGroup">${ic("filter",18)}${T("Ομαδοποίηση ανά περιοχή")}<span class="tick">${groupByArea?"✓":""}</span></button>`+
      (S.settings.manualOrder?`<button class="optrow" style="margin-top:10px;border:1px solid var(--line);border-radius:12px" data-act="autoOrder">${ic("tasks",18)}${T("Επαναφορά αυτόματης σειράς (κατά ώρα)")}</button>`:"");
  }else if(kind==="clients"){
    title=T("Ταξινόμηση πελατών");
    body=panel(CSORT.map(([k,l])=>`<button class="optrow ${clientSort===k?"on":""}" data-act="csort" data-s="${k}">${T(l)}${clientSort===k?'<span class="tick">✓</span>':""}</button>`).join(""));
  }else{
    title=T("Περίοδος");
    const years=moneyDataYears();
    body=panel(PERIODS.map(([k,l])=>`<button class="optrow ${moneyPeriod===k?"on":""}" data-act="period" data-p="${k}">${T(l)}${moneyPeriod===k?'<span class="tick">✓</span>':""}</button>`).join(""))+
      (years.length?sec(T("Συγκεκριμένη χρονιά"))+panel(years.map(y=>`<button class="optrow ${moneyPeriod===String(y)?"on":""}" data-act="period" data-p="${y}">${y}${moneyPeriod===String(y)?'<span class="tick">✓</span>':""}</button>`).join("")):"");
  }
  openSheet({title,cancelLabel:T("Κλείσιμο"),body});
}

let sheetCancel=null,sheetDirty=false,sheetHasSave=false;

// Γυρίζει πίσω στο φύλλο που ήσουν, στο ίδιο ακριβώς σημείο που το άφησες.
function sheetBack(fn){

let curSheet=null;
function sheetParentBack(p){while(p){if(p.reopen)return p.reopen;p=p.parent}return null}
let pendingReopen=null;
let sheetFullNext=false; // το επόμενο φύλλο γεμίζει όλη την οθόνη (ρυθμίσεις)
function openSheet({title,body,onSave,onDelete,deleteMsg,onCancel,saveLabel,saveStyle,saveClass="",cancelLabel,fixed="",noFoot=false,overNav=false}){

  const full=sheetFullNext||($("#modal").classList.contains("open")&&$("#modal").classList.contains("full"));sheetFullNext=false;
  const pBack=sheetParentBack(parent);
  const chainBack=pBack?sheetBack(pBack):null;
  if(chainBack&&(!onCancel||onCancel===settingsSheet))onCancel=chainBack;
  if(chainBack&&cancelLabel===T("Κλείσιμο"))cancelLabel=T("Πίσω");

  $("#shFoot").innerHTML=`${onDelete?`<button class="btn danger" id="sDel">${T("Διαγραφή")}</button>`:""}<span class="grow"></span>
    <button class="btn ghost" id="sCancel">${cancelLabel||T("Άκυρο")}</button>${onSave?`<button class="btn big ${saveStyle||"primary"} ${saveClass||""}" id="sSave">${saveLabel||T("Αποθήκευση")}</button>`:""}`;

// «σε 5 ώρες», «σε 2 μέρες και 3 ώρες», «σε 20 λεπτά»
function relTimeText(target){
  let mins=Math.max(0,Math.round((new Date(target)-Date.now())/60000));
  const days=Math.floor(mins/1440);mins%=1440;
  const hours=Math.floor(mins/60);const rem=mins%60;
  const parts=[];
  if(days)parts.push(pl(days,"{n} μέρα","{n} μέρες"));
  if(hours)parts.push(pl(hours,"{n} ώρα","{n} ώρες"));
  if(!days&&!hours)parts.push(pl(rem,"{n} λεπτό","{n} λεπτά"));
  return parts.join(" "+T("και")+" ");
}
