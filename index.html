function stopSound(){
  if(loopT){clearInterval(loopT);loopT=null}
  if(audioEl){try{audioEl.pause();audioEl.currentTime=0}catch(e){}}
}
function playSound(kind,repeatFor){
  stopSound();
  const key=kind||S.settings.sound;
  const custom=customSoundById(key);
  if(custom){
    try{
      audioEl=audioEl||new Audio();
      audioEl.src=custom.dataUrl;audioEl.currentTime=0;audioEl.loop=false;
      audioEl.play().catch(()=>{});
      if(custom.persistent&&repeatFor!==false){
        audioEl.loop=true;
        const until=Date.now()+(typeof repeatFor==="number"?repeatFor:45000);
        loopT=setInterval(()=>{if(Date.now()>until||!$("#alert").classList.contains("open"))stopSound()},500);
      }
    }catch(e){}
    return;
  }
  const s=SOUNDS[key]||SOUNDS.chime;if(!s.notes.length)return;
  if(s.loop&&repeatFor!==false){
    const until=Date.now()+(typeof repeatFor==="number"?repeatFor:45000);
    playOnce(s);loopT=setInterval(()=>{if(Date.now()>until||!$("#alert").classList.contains("open"))stopSound();else playOnce(s)},s.loop*1000);
    return;
  }
  playOnce(s);
}
function playOnce(s){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    s.notes.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+t;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.start(t0);o.stop(t0+d+.05)});
  }catch(e){}
}

let swReg=null;
let newSW=null;
async function initSW(){
  if(!("serviceWorker" in navigator)||localFile()||!window.isSecureContext)return null;
  try{
    swReg=await navigator.serviceWorker.getRegistration();
    if(!swReg)swReg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
    await navigator.serviceWorker.ready;
    swReg.addEventListener("updatefound",()=>{
      const w=swReg.installing;if(!w)return;
      w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller){newSW=w;showUpdateBar()}});
    });
    try{swReg.update()}catch(e){}
    return swReg;
  }catch(e){return null}
}

function fotoTarget(owner){

async function urlToDataUrl(u){
  if(!u)return null;
  if(String(u).startsWith("data:"))return u;
  const r=await fetch(u);const bl=await r.blob();
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(bl)});
}
function shrinkDataUrl(dataUrl,maxDim,q){
  return new Promise((res,rej)=>{const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",q))};
    img.onerror=()=>rej(new Error("img"));img.src=dataUrl});
}
// Θέλουμε την ΤΕΛΙΚΗ εικόνα, με τις μετρήσεις και τις σημειώσεις πάνω της,
// όχι τη γυμνή φωτογραφία. Δοκιμάζουμε με σειρά προτεραιότητας ό,τι δίνει η ΦωτοΜέτρα.
async function fotoFlatSource(rec){
  // 1) συναρτήσεις που επιστρέφουν την «ψημένη» εικόνα
  for(const fn of ["flat","flatten","render","export","image","full","composite"]){
    if(typeof FotoMetra[fn]==="function"){
      try{const v=await Promise.resolve(FotoMetra[fn](rec));if(v)return v}catch(e){}
    }
  }
  // 2) πεδία μέσα στην ίδια την εγγραφή
  for(const k of ["flatUrl","flat","composite","annotated","rendered","exportUrl","full","image","png","jpeg","dataUrl","url"]){
    if(rec&&rec[k])return rec[k];
  }
  // 3) τελευταία επιλογή: η μικρογραφία (μπορεί να είναι χωρίς μετρήσεις)
  if(typeof FotoMetra.thumb==="function"){try{return await Promise.resolve(FotoMetra.thumb(rec))}catch(e){}}
  return null;
}
async function syncFotoPhotos(owner){
  if(!window.FotoMetra||typeof FotoMetra.list!=="function")return 0;
  const tgt=fotoTarget(owner);if(!tgt)return 0;
  if(!Array.isArray(tgt.photos))tgt.photos=[];
  let recs=[];
  try{recs=await Promise.resolve(FotoMetra.list(owner))||[]}catch(e){return 0}
  const have=new Set(tgt.photos.map(p=>p.fmId).filter(Boolean));
  let added=0;
  for(const rec of recs){
    const rid=String(rec&&(rec.id||rec.key||rec.name)||"");
    if(!rid||have.has(rid))continue;
    try{
      const src=await fotoFlatSource(rec);
      const raw=await urlToDataUrl(src);if(!raw)continue;
      const small=await shrinkDataUrl(raw,1024,.7);
      {const ph={id:uid(),fmId:rid,dataUrl:small,label:"",at:Date.now(),fromFoto:true};tgt.photos.push(ph);fsSavePhoto(ph,tgt.name||tgt.title||T("Φωτογραφίες"))}
      added++;
    }catch(e){}
  }
  if(added){write();render();toast(pl(added,"Αποθηκεύτηκε {n} φωτογραφία από τη ΦωτοΜέτρα.","Αποθηκεύτηκαν {n} φωτογραφίες από τη ΦωτοΜέτρα."))}
  return added;
}

  try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.unregister()}catch(e){}

let lastCheck=0;
async function checkUpdate(silent){
  if(localFile()){if(!silent)toast(T("Τρέχει ως αρχείο. Κατέβασε το νέο αρχείο για να ενημερωθεί."));return}
  if(silent){
    const now=Date.now();if(now-lastCheck<60000)return;lastCheck=now; // όχι έλεγχος σε κάθε ανοιγοκλείσιμο, το πολύ μία φορά το λεπτό
  }
  if(!silent)toast(T("Έλεγχος για νεότερη έκδοση…"));
  try{
    const r=await fetch(location.pathname+"?probe="+Date.now(),{cache:"no-store"});
    const t=await r.text();
    const m=t.match(/APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){showUpdateBar(m[1]);return}
    if(!silent)toast(T("Έχεις την τελευταία έκδοση ({v}).",{v:APP_VERSION}));
  }catch(e){if(!silent)toast(T("Ο έλεγχος χρειάζεται σύνδεση στο διαδίκτυο."))}
}

async function askNotify(){
  if(!canNotify()){toast(T("Η συσκευή δεν υποστηρίζει ειδοποιήσεις."));return false}
  if(localFile()){toast(T("Οι ειδοποιήσεις δεν λειτουργούν όταν η εφαρμογή τρέχει ως αρχείο. Άνοιξέ τη από τη διεύθυνσή της."));return false}
  const before=Notification.permission;
  let p=before;
  if(p==="default"){try{p=await Notification.requestPermission()}catch(e){}}
  if(p!=="granted"){
    toast(before==="default"&&p==="denied"
      ? T("Το Chrome απέρριψε αυτόματα το αίτημα. Πάτα το εικονίδιο αριστερά από τη διεύθυνση → Άδειες → Ειδοποιήσεις → Να επιτρέπεται, και ξαναδοκίμασε.")

      : T("Δεν δόθηκε άδεια για ειδοποιήσεις."));

    if(act==="openc"){clientId=a.id;view="client";render();window.scrollTo(0,0)}

      else{toast(T("Δεν έχει καταχωρημένο τηλέφωνο."));clientId=a.id;view="client";render()}}

    }else if(a.type==="rem"){
      if(act==="snz10"||act==="snz30"||act==="snz60"){
        const mins=act==="snz10"?10:act==="snz30"?30:60;

      else if(act==="keep"){if(a.pre){x.preAlerted=true;toast(T("Θα ξαναχτυπήσει την ώρα της."))}else{x.alerted=true;toast(T("Μένει κόκκινη στη λίστα μέχρι να την κλείσεις."))}}
      else if(act==="del"){
        const rep2=x.repeat&&x.repeat!=="none";
        const msg=rep2
          ? T("Προσοχή: αυτή είναι επαναλαμβανόμενη υπενθύμιση ({r}). Αν πάει στον κάδο, ΣΤΑΜΑΤΑΕΙ για πάντα και δεν θα ξαναχτυπήσει.\n\nΑν θέλεις απλώς να κλείσεις τη σημερινή, πάτα «Άκυρο» και μετά «{d}».\n\nΝα πάει στον κάδο;",{r:REPL()[x.repeat],d:remDoneLabel(x)})
          : T("Να πάει στον κάδο η υπενθύμιση «{t}»;",{t:x.text});
        if(!confirm(msg))return;
        x.deleted=true;x.deletedAt=Date.now();
        toast(rep2?T("Σταμάτησε. Μπορείς να την επαναφέρεις από τον κάδο."):T("Μεταφέρθηκε στα διαγραμμένα."))}
      else if(act==="done"){completeReminder(x);
        toast(x.done?T("Μεταφέρθηκε στα ολοκληρωμένα."):T("Έγινε. Θα ξαναχτυπήσει την επόμενη φορά."))}
    }else{
      if(act==="snooze"){x.snoozeUntil=new Date(Date.now()+600000).toISOString();toast(T("Θα ξαναχτυπήσει σε 10 λεπτά."))}
      else if(act==="nav"){const L=taskLoc(x);
        if(L)window.open("https://www.google.com/maps/dir/?api=1&destination="+L.lat+","+L.lng,"_blank","noopener");
        else toast(T("Η δουλειά δεν έχει τοποθεσία."))}
      else{x.startNotified=true;x.snoozeUntil=null;
        if(act==="start"){x.status="progress";x.startedAt=x.startedAt||Date.now();toast(T("Η δουλειά σημειώθηκε ως «Σε εξέλιξη»."))}
        if(act==="cancel"){if(!confirm(T("Να σημειωθεί η δουλειά ως ακυρωμένη;")))return;
          x.status="cancelled";x.cancelledAt=Date.now();toast(T("Η εργασία σημειώθηκε ως ακυρωμένη."))}}
    }}
  stopSound();alertShown=null;persist();render();showNextAlert();
});

function checkProgress(x){
  const l=x.check||[];return{done:l.filter(i=>i.done).length,total:l.length};
}
function drawCheckBadge(x){
  const b=$("#chkBadge");if(!b)return;
  const{done,total}=checkProgress(x);
  b.textContent=total?` ${done}/${total}`:"";
  b.className="chkbadge"+(total&&done===total?" full":"");
}
function checkSheet(x,back){
  const list=x.check||(x.check=[]);
  const paint=()=>{
    const{done,total}=checkProgress(x);
    $("#chkHead").innerHTML=total
      ?`<div class="chkbar"><span style="width:${Math.round(done/total*100)}%"></span></div>
        <p class="note" style="margin:6px 0 0">${T("{d} από {t} έτοιμα",{d:done,t:total})}</p>`
      :`<p class="note" style="margin:0">${T("Η λίστα είναι άδεια. Πρόσθεσε ό,τι χρειάζεσαι ή φόρτωσε τη δική σου προεπιλογή.")}</p>`;
    $("#chkList").innerHTML=list.length?panel(list.map((it,i)=>`<div class="row listedit ${it.done?"chkdone":""}" style="align-items:center">
        <button type="button" class="check ${it.done?"on":""}" data-chk="${i}" aria-label="${T("Έγινε")}">${it.done?"✓":""}</button>
        <div class="grow title">${esc(it.text)}</div>
        <button class="mv" data-chkmv="${i}" data-dir="up">▲</button><button class="mv" data-chkmv="${i}" data-dir="down">▼</button>
        <button class="x bin" data-chkdel="${i}" aria-label="${T("Διαγραφή")}">${ic("trash",18)}</button></div>`).join("")):"";
  };
  openSheet({title:T("Τι παίρνω μαζί"),cancelLabel:back?T("Πίσω"):T("Κλείσιμο"),onCancel:back||null,
    body:`<div id="chkHead"></div>
      <div class="inrow" style="margin:12px 0 4px"><input id="chk_new" placeholder="${T("Πρόσθεσε κάτι…")}" autocomplete="off"><button class="btn amber" id="chk_add">${T("Προσθήκη")}</button></div>
      <div id="chkList"></div>
      <div class="twobtn" style="margin-top:12px">
        <button class="btn ghost" id="chk_tpl">${ic("plus",16)} ${T("Από την προεπιλογή μου")}</button>
        <button class="btn ghost" id="chk_save">${ic("edit",16)} ${T("Γίνε η προεπιλογή μου")}</button></div>
      <button class="btn ghost wide" id="chk_clear" style="width:100%;margin-top:8px">${T("Ξετσέκαρε όλα")}</button>`});
  paint();
  $("#chk_add").onclick=()=>{const v=val("chk_new");if(!v)return;list.push({text:v,done:false});$("#chk_new").value="";persist();paint()};
  $("#chk_new").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#chk_add").click()}});
  $("#chk_tpl").onclick=()=>{const have=new Set(list.map(i=>norm(i.text)));
    (S.settings.checkTpl||[]).forEach(t=>{if(!have.has(norm(t)))list.push({text:t,done:false})});
    persist();paint();toast(T("Μπήκαν τα σταθερά σου."))};
  $("#chk_save").onclick=()=>{if(!list.length)return toast(T("Η λίστα είναι άδεια."));
    S.settings.checkTpl=list.map(i=>i.text);write();toast(T("Αποθηκεύτηκε ως προεπιλογή για τις επόμενες δουλειές."))};
  $("#chk_clear").onclick=()=>{list.forEach(i=>i.done=false);persist();paint()};
  $("#chkList").onclick=e=>{
    const c=e.target.closest("[data-chk]"),m=e.target.closest("[data-chkmv]"),d=e.target.closest("[data-chkdel]");
    if(c){const i=+c.dataset.chk;list[i].done=!list[i].done;persist();paint();return}
    if(m){const i=+m.dataset.chkmv,j=i+(m.dataset.dir==="up"?-1:1);if(j<0||j>=list.length)return;
      [list[i],list[j]]=[list[j],list[i]];persist();paint();return}
    if(d){const i=+d.dataset.chkdel;list.splice(i,1);persist();paint()}
  };
}

function binSheet(){
  const tt=S.tasks.filter(x=>!alive(x)&&!x.trashedBy),tc=S.clients.filter(x=>!alive(x)),te=S.ledger.filter(x=>!alive(x)&&!x.trashedBy),tn=S.notes.filter(x=>!alive(x));

    <div class="meta"><span>${esc(sub)}</span><span>${fmtDay(o.trashed)}</span><span>${T("σβήνει σε {n} μέρες",{n:Math.max(0,Math.ceil(((S.settings.trashDays||30)*86400000-(Date.now()-o.trashed))/86400000))})}</span></div></div>

    `<p class="note">${T("Ό,τι σβήνεις μένει εδώ {n} μέρες, μετά διαγράφεται μόνο του οριστικά.",{n:S.settings.trashDays||30})}</p>
     <div class="inrow" style="margin-bottom:14px"><label for="bin_days" style="margin:0;flex:1">${T("Μέρες πριν το οριστικό σβήσιμο")}</label>
       <input id="bin_days" type="number" min="1" max="365" value="${S.settings.trashDays||30}" style="width:78px;text-align:center"></div>`+
    (tt.length?sec(T("Εργασίες"))+panel(tt.map(x=>row(x,x.title,[x.clientId&&getClient(x.clientId)?getClient(x.clientId).name:"",x.amount?money(x.amount):""].filter(Boolean).join(" · "),"task")).join("")):"")+
    (tc.length?sec(T("Πελάτες"))+panel(tc.map(c=>row(c,c.name,[c.area,c.mobile].filter(Boolean).join(" · "),"client")).join("")):"")+
    (te.length?sec(T("Κινήσεις"))+panel(te.map(e=>row(e,kindName(e.kind)+" "+money(e.amount),e.note||"","entry")).join("")):"")+
    (tn.length?sec(T("Σημειώσεις"))+panel(tn.map(n=>row(n,n.text.length>60?n.text.slice(0,60)+"…":n.text,fmtDay(n.date),"note")).join("")):"")+
    (tt.length||tc.length||te.length||tn.length?`<button class="btn danger wide" data-bin="purgeAll">${T("Άδειασμα κάδου")}</button>`:panel(`<div class="empty">${T("Ο κάδος είναι άδειος.")}</div>`))});
  $("#bin_days").onchange=e=>{const v=Math.max(1,Math.min(365,+e.target.value||30));S.settings.trashDays=v;write();
    const purged=purgeOldTrash();if(purged)render();toast(T("Ενημερώθηκε: {n} μέρες.",{n:v}));
    setTimeout(binSheet,0)};
  $("#shBody").onclick=e=>{
    const b=e.target.closest("[data-bin]");if(!b)return;
    const act=b.dataset.bin;
    if(act==="purgeAll"){if(!confirm(T("Να σβηστούν οριστικά όλα όσα είναι στον κάδο;")))return;
      S.tasks=S.tasks.filter(alive);S.clients=S.clients.filter(alive);S.ledger=S.ledger.filter(alive);S.notes=S.notes.filter(alive);persist();render();return binSheet()}
    const arr=b.dataset.kind==="task"?S.tasks:b.dataset.kind==="client"?S.clients:b.dataset.kind==="note"?S.notes:S.ledger;
    const o=arr.find(x=>x.id===b.dataset.id);if(!o)return;
    if(act==="restore"){restoreObj(o);persist();render();toast(T("Επανήλθε."));return binSheet()}
    if(!confirm(T("Οριστική διαγραφή; Δεν αναιρείται.")))return;
    arr.splice(arr.indexOf(o),1);persist();render();binSheet();
  };
}

function placeSheet(kind,idx){
  const isBase=kind==="base",cur=isBase?(S.settings.base||{name:T("Έδρα")}):(idx!=null?S.areas[idx]:{name:""});
  openSheet({title:isBase?T("Σπίτι ή έδρα"):idx!=null?T("Επεξεργασία τοποθεσίας"):T("Νέα τοποθεσία"),cancelLabel:T("Πίσω"),onCancel:settingsSheet,
    body:`<label for="p_name">${T("Όνομα")}</label><input id="p_name" value="${esc(cur.name)}" placeholder="${T("π.χ. Σπίτι, Αποθήκη")}">
    ${isBase?`<label for="p_area">${T("Περιοχή")}</label><input id="p_area" list="areaList" autocomplete="off" value="${esc(cur.area)}">`:""}
    ${lwHTML({showAddr:true,address:cur.address})}`,
    onSave:()=>{
      const name=val("p_name");if(!name){toast(T("Γράψε όνομα."));return false}
      const area=isBase?val("p_area"):"";
      if(!LW.loc&&!findArea(area)){LW.attempted=true;LW.upd();toast(T("Βάλε τοποθεσία: διεύθυνση, σημείο στον χάρτη ή «Είμαι εκεί τώρα»."));return false}
      const o={name,area,address:val("lw_addr"),lat:LW.loc?LW.loc.lat:null,lng:LW.loc?LW.loc.lng:null};
      if(isBase){S.settings.base=o;if(!route.fromGeo)route.from=""}
      else{if(AREAS.some(a=>norm(a[0])===norm(name))||S.areas.some((a,i)=>i!==idx&&norm(a.name)===norm(name))){toast(T("Υπάρχει ήδη τοποθεσία με αυτό το όνομα."));return false}
        if(!o.lat){const a=findArea(area);o.lat=a.lat;o.lng=a.lng}
        if(idx!=null)S.areas[idx]=o;else S.areas.push(o)}
      persist();render();toast(T("Αποθηκεύτηκε."));settingsSheet();return"replaced";
    },
    onDelete:(isBase&&S.settings.base)||(!isBase&&idx!=null)?()=>{if(isBase){S.settings.base=null;route.from=""}else S.areas.splice(idx,1);persist();render();settingsSheet();return"replaced"}:null,

const ejCfg=()=>({service:S.settings.ejService||EJ_SERVICE,template:S.settings.ejTemplate||EJ_TEMPLATE,key:S.settings.ejKey||EJ_KEY});

async function sendEmailBackup(silent){
  const s=S.settings;
  if(!mailReady()){if(!silent)toast(T("Η αποστολή στο ταχυδρομείο δεν έχει ενεργοποιηθεί ακόμα στην εφαρμογή."));return false}
  if(!/^\S+@\S+\.\S+$/.test(s.backupEmail)){if(!silent)toast(T("Γράψε σωστό ηλεκτρονικό ταχυδρομείο."));return false}
  const data=backupPayload(),date=new Date().toLocaleString(LOC());
  if(data.length>45000){
    if(!silent)toast(T("Τα δεδομένα ξεπέρασαν το όριο του ταχυδρομείου. Χρησιμοποίησε «Κοινοποίηση» ή «Αποθήκευση αρχείου»."));
    return false;
  }
  try{
    const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({service_id:ejCfg().service,template_id:ejCfg().template,user_id:ejCfg().key,template_params:{user_email:s.backupEmail,to_email:s.backupEmail,
        name:"Δρομολόγιο",time:date,message:data,
        from_name:"Δρομολόγιο",app_name:"Δρομολόγιο",reply_to:"aglentzakis.apps@gmail.com",
        subject:"Δρομολόγιο – Backup δεδομένων",title:"Δρομολόγιο – Backup δεδομένων",
        date,file_name:fileName("json"),backup_data:data}})});
    if(r.ok){markBackup();if(!silent)toast(T("Το αντίγραφο στάλθηκε στο {e}.",{e:s.backupEmail}));return true}
    let why="";try{why=((await r.text())||"").slice(0,120)}catch(e){}
    if(!silent)toast(r.status===413?T("Τα δεδομένα είναι πολλά για αποστολή. Χρησιμοποίησε την κοινοποίηση αρχείου.")
      :r.status===403?T("Το EmailJS απέρριψε το αίτημα. Έλεγξε το δημόσιο κλειδί και ότι επιτρέπονται οι αποστολές από τον φυλλομετρητή.")
      :r.status===400?T("Λάθος κωδικός υπηρεσίας ή προτύπου. {w}",{w:why})
      :T("Η αποστολή απέτυχε, κωδικός σφάλματος {c}. {w}",{c:r.status,w:why}));
  }catch(e){if(!silent)toast(T("Δεν υπάρχει σύνδεση στο διαδίκτυο. Δοκίμασε ξανά ή αποθήκευσε αρχείο."))}
  return false;
}
let autoTimer=null;
function scheduleAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(async()=>{
  const s=S.settings,m=S.meta;if(!s.autoEmail||!s.backupEmail||!mailReady()||m.changes<s.backupEvery||!navigator.onLine)return;
  if(Date.now()-(m.lastAuto||0)<30*60000)return;m.lastAuto=Date.now();write();
  if(await sendEmailBackup(true))toast(T("Στάλθηκε αυτόματα αντίγραφο στο ταχυδρομείο σου."))},4000)}
function parseBackup(text){
  let s=String(text||"").trim();const i=s.indexOf("{"),j=s.lastIndexOf("}");if(i<0||j<i)return null;s=s.slice(i,j+1);
  let d;try{d=JSON.parse(s)}catch(e){try{d=JSON.parse(s.replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/&#39;/g,"'"))}catch(e2){return null}}
  const find=(o,depth=0)=>{if(!o||typeof o!=="object"||depth>4)return null;
    if(Array.isArray(o.clients)||Array.isArray(o.tasks)||Array.isArray(o.reminders))return o;
    for(const k of Object.keys(o)){let x=o[k];if(typeof x==="string"&&x.trim().startsWith("{")){try{x=JSON.parse(x)}catch(e){x=null}}const r=find(x,depth+1);if(r)return r}return null};
  return find(d);
}
function restoreFrom(text){
  const d=parseBackup(text);if(!d){toast(T("Δεν βρέθηκαν δεδομένα της εφαρμογής σε αυτό το αρχείο."));return}
  const c=(d.clients||[]).length,k=(d.tasks||[]).length,r=(d.reminders||[]).length;
  const hasNow=S.clients.length||S.tasks.length||S.reminders.length;
  if(!confirm(T("Βρέθηκαν {c} πελάτες, {k} εργασίες και {r} υπενθυμίσεις.",{c,k,r})+"\n\n"+(hasNow?T("Θα αντικαταστήσουν τα τωρινά δεδομένα. Συνέχεια;"):T("Να γίνει η επαναφορά;"))))return;
  ["efarmogi","ekdosi","dimiourgia"].forEach(x=>delete d[x]);
  const keepLook=S.settings.look,keepLang=S.settings.lang,hadLook=d.settings&&d.settings.look;
  S=fix(d);if(!hadLook)S.settings.look=keepLook;if(!d.settings||!d.settings.lang)S.settings.lang=keepLang;LANG=S.settings.lang;
  S.meta.changes=0;write();applyLook();closeSheet();view="today";render();toast(T("Τα δεδομένα επαναφέρθηκαν."));
}

function exportFrom(per){
  const d=new Date();d.setHours(0,0,0,0);
  if(per==="day")return d;
  if(per==="week"){const x=new Date(d);x.setDate(x.getDate()-7);return x}
  if(per==="month"){const x=new Date(d);x.setMonth(x.getMonth()-1);return x}
  if(per==="quarter"){const x=new Date(d);x.setMonth(x.getMonth()-3);return x}
  if(per==="half"){const x=new Date(d);x.setMonth(x.getMonth()-6);return x}
  if(per==="year")return new Date(d.getFullYear(),0,1);
  if(/^\d{4}$/.test(per))return new Date(+per,0,1);
  return null;
}
function exportRows(per,cid){
  const from=exportFrom(per),to=/^\d{4}$/.test(per)?new Date(+per+1,0,1):null;
  const inR=t=>{const x=new Date(t);return(!from||x>=from)&&(!to||x<to)};
  const rows=[[T("Ημερομηνία"),T("Είδος"),T("Έσοδο/Έξοδο"),T("Ποσό"),T("Πελάτης"),T("Εργασία"),T("Σημείωση"),T("Κατάσταση")]];
  S.ledger.filter(alive).filter(e=>inR(e.date)).filter(e=>!cid||e.clientId===cid)
    .sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(e=>{
    const c=getClient(e.clientId),tk=S.tasks.find(x=>x.id===e.taskId);
    rows.push([new Date(e.date).toLocaleDateString("el-GR"),kindName(e.kind),isIn(e.kind)?T("Έσοδο"):T("Έξοδο"),
      String(e.amount).replace(".",","),c?c.name:"",tk?tk.title:"",e.note||"",e.cancelled?T("ακυρώθηκε"):""]);
  });
  return rows;
}
function doExport(per,cid){

/* ---------- Κοινός φάκελος στη συσκευή ----------
   Ένας φάκελος που τον διαλέγεις μία φορά και τον μοιράζονται όλες οι εφαρμογές.
   Το Δρομολόγιο γράφει μόνο μέσα στον δικό του υποφάκελο: αντίγραφα, προσφορές,
   αποδείξεις, φωτογραφίες, εξαγωγές. Από εκεί γίνεται και η επαναφορά. */
const FS_DB="shared-backups",FS_STORE="handles",FS_KEY="root",FS_APP="Dromologio";
const FS_SUB={backup:"Αντίγραφα",offer:"Προσφορές",receipt:"Αποδείξεις",photo:"Φωτογραφίες",export:"Εξαγωγές"};
const fsOK=()=>typeof window.showDirectoryPicker==="function"&&window.isSecureContext;
function fsIdb(){return new Promise((res,rej)=>{const r=indexedDB.open(FS_DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(FS_STORE))d.createObjectStore(FS_STORE)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fsIdbDo(mode,fn){try{const db=await fsIdb();return await new Promise((res,rej)=>{
  const tx=db.transaction(FS_STORE,mode),st=tx.objectStore(FS_STORE),rq=fn(st);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}catch(e){return null}}
const fsGetHandle=()=>fsIdbDo("readonly",st=>st.get(FS_KEY));
const fsPutHandle=h=>fsIdbDo("readwrite",st=>st.put(h,FS_KEY));
const fsDelHandle=()=>fsIdbDo("readwrite",st=>st.delete(FS_KEY));
async function fsPerm(h,ask){
  try{const o={mode:"readwrite"};let p=await h.queryPermission(o);if(p==="granted")return true;
    if(!ask)return false;p=await h.requestPermission(o);return p==="granted"}catch(e){return false}
}
// ask=true μόνο όταν το ζητάει ο χρήστης με το χέρι· αλλιώς δουλεύει σιωπηλά ή δεν κάνει τίποτα.
async function fsRoot(ask){
  if(!fsOK())return null;
  let h=await fsGetHandle();
  if(h&&await fsPerm(h,ask))return h;
  if(!ask)return null;
  try{h=await window.showDirectoryPicker({id:"backups",mode:"readwrite",startIn:"downloads"})}catch(e){return null}
  if(!await fsPerm(h,true))return null;
  await fsPutHandle(h);return h;
}
async function fsAppDir(kind,ask){
  const root=await fsRoot(ask);if(!root)return null;
  try{const app=await root.getDirectoryHandle(FS_APP,{create:true});
    return kind?await app.getDirectoryHandle(FS_SUB[kind]||String(kind),{create:true}):app}catch(e){return null}
}
const fsSlug=s=>String(s||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,60)||"-";
const fsToday=()=>toLocalInput(new Date()).slice(0,10);
// Γράφει ένα αρχείο. Σιωπηλά: αν δεν υπάρχει φάκελος ή άδεια, απλώς δεν κάνει τίποτα.
async function fsSave(kind,name,blob,ask){
  try{const dir=await fsAppDir(kind,!!ask);if(!dir)return false;
    const fh=await dir.getFileHandle(fsSlug(name),{create:true});
    const w=await fh.createWritable();await w.write(blob);await w.close();
    S.meta.fsLast=Date.now();write();return true}catch(e){return false}
}
async function fsList(kind){
  try{const dir=await fsAppDir(kind,false);if(!dir)return[];const out=[];
    for await(const [name,h] of dir.entries()){if(h.kind!=="file")continue;
      const f=await h.getFile();out.push({name,at:f.lastModified,size:f.size,handle:h})}
    return out.sort((a,b)=>b.at-a.at)}catch(e){return[]}
}
const fsConnected=async()=>!!(await fsRoot(false));
async function fsSaveBackup(ask){
  const ok=await fsSave("backup",`dromologio-antigrafo-${fsToday()}.json`,new Blob([backupPayload()],{type:"application/json"}),ask);
  if(ok){S.meta.fsBackup=Date.now();markBackup()}
  return ok;
}
// Φωτογραφία: μπαίνει και ως κανονικό αρχείο εικόνας στον φάκελο, με το όνομα του πελάτη ή της δουλειάς.
async function fsSavePhoto(ph,owner,ask){
  if(!ph||!ph.dataUrl)return false;
  const name=`foto-${fsToday()}-${fsSlug(owner)}-${String(ph.id||"").slice(-5)}.jpg`;
  const ok=await fsSave("photo",name,dataUrlToBlob(ph.dataUrl),ask);
  if(ok){ph.fsName=name;write()}
  return ok;
}
async function fsSaveOffer(o,cv,ask){
  const name=`prosfora-${o.no||"—"}-${fsSlug(o.client||"")}-${fsToday()}.pdf`;
  const ok=await fsSave("offer",name,canvasToPdfBlob(cv),ask);
  if(ok){o.fsName=name;write()}
  return ok;
}
// Στέλνει στον φάκελο ό,τι δεν έχει σταλεί ακόμα: αντίγραφο, φωτογραφίες, σταλμένες προσφορές.
async function fsSyncAll(){
  const root=await fsRoot(true);
  if(!root){toast(T("Δεν διαλέχτηκε φάκελος."));return}
  toast(T("Αποθήκευση στον φάκελο…"));
  let ph=0,of=0;
  await fsSaveBackup(true);
  for(const c of S.clients)for(const p of (c.photos||[]))if(!p.fsName&&await fsSavePhoto(p,c.name,true))ph++;
  for(const x of S.tasks){
    for(const p of (x.photos||[]))if(!p.fsName&&await fsSavePhoto(p,x.title||T("Εργασία"),true))ph++;
    const list=[].concat(x.offers||[],x.offer?[x.offer]:[]);
    for(const o of list)if(o&&o.sentAt&&!o.fsName){try{if(await fsSaveOffer(o,offerCanvas(o),true))of++}catch(e){}}
  }
  toast(T("Μπήκαν στον φάκελο: {p} φωτογραφίες, {o} προσφορές.",{p:ph,o:of}));
  if($("#fsBox"))fsPaint();
}
// Αυτόματο αντίγραφο στον φάκελο, χωρίς να ρωτάει, το πολύ μία φορά την ώρα.
async function fsAutoBackup(){
  if(!fsOK()||S.settings.fsAuto===false)return;
  if(Date.now()-(S.meta.fsBackup||0)<60*60000)return;
  if(!await fsConnected())return;
  await fsSaveBackup(false);
}

  box.innerHTML=`<p class="note">${T("Φόρτωση…")}</p>`;
  (async()=>{

    const files=on?await fsList("backup"):[];
    box.innerHTML=`<p class="note">${on?T("Ο φάκελος είναι συνδεδεμένος. Τα αρχεία μπαίνουν στον υποφάκελο «{f}».",{f:FS_APP})+" "+last
        :T("Διάλεξε μία φορά έναν φάκελο στο κινητό. Εκεί θα μπαίνουν αντίγραφα, προσφορές, αποδείξεις, φωτογραφίες και εξαγωγές — και από εκεί γίνεται η επαναφορά.")}</p>
      <button type="button" class="btn ${on?"ghost":"primary"} wide gobtn" id="fsPick" style="margin-top:4px${on?";border:1.5px solid var(--line)":""}">${ic("archive",20)}${on?T("Αλλαγή φακέλου"):T("Σύνδεση φακέλου")}</button>
      ${on?`<button type="button" class="btn ghost wide gobtn" id="fsSync" style="margin-top:8px;border:1.5px solid var(--line)">${ic("shield",20)}${T("Αποθήκευση όλων τώρα")}</button>`:""}
      ${on?`<label class="toggle"><input type="checkbox" id="fsAuto" ${S.settings.fsAuto===false?"":"checked"}>${T("Να μπαίνει αντίγραφο μόνο του, μία φορά την ώρα")}</label>
        <button type="button" class="linkbtn" id="fsOff">${T("Αποσύνδεση φακέλου (τα αρχεία μένουν)")}</button>`:""}
      ${files.length?sec(T("Επαναφορά από τον φάκελο"))+panel(files.slice(0,10).map((f,i)=>`<div class="row" data-fsr="${esc(f.name)}" style="align-items:center">
          <div class="avatar">${ic("archive",18)}</div><div class="grow"><div class="title">${esc(f.name)}${i===0?` <b class="newest">${T("νεότερο")}</b>`:""}</div>
          <div class="meta"><span>${fmt(f.at)}</span><span>${Math.max(1,Math.round(f.size/1024))} KB</span></div></div></div>`).join("")):""}`;
    const pick=$("#fsPick");if(pick)pick.onclick=async()=>{const r=await fsRoot(true);toast(r?T("Ο φάκελος συνδέθηκε."):T("Δεν διαλέχτηκε φάκελος."));if(r)await fsSaveBackup(true);fsPaint()};
    const sync=$("#fsSync");if(sync)sync.onclick=fsSyncAll;
    const auto=$("#fsAuto");if(auto)auto.onchange=()=>{S.settings.fsAuto=auto.checked;write()};
    const off=$("#fsOff");if(off)off.onclick=async()=>{if(!confirm(T("Να ξεχάσει η εφαρμογή τον φάκελο; Τα αρχεία μένουν εκεί που είναι.")))return;await fsDelHandle();toast(T("Ο φάκελος αποσυνδέθηκε."));fsPaint()};
    box.onclick=async e=>{
      const r=e.target.closest("[data-fsr]");if(!r)return;
      const files2=await fsList("backup");const f=files2.find(x=>x.name===r.dataset.fsr);if(!f)return;
      try{const txt=await(await f.handle.getFile()).text();restoreFrom(txt)}catch(err){toast(T("Το αρχείο δεν διαβάστηκε."))}
    };
  })();
}

/* ---------- Κουμπί «πίσω» του κινητού ---------- */
// Το Chrome προσπερνά εγγραφές ιστορικού που μπήκαν χωρίς άγγιγμα, γι' αυτό τις προσθέτουμε όταν αγγίζεις την οθόνη.
const BUF=3;let depth=0,leaving=false;
history.replaceState({g:0},"");
function topUp(){if(leaving||$("#exitDlg").classList.contains("open"))return;while(depth<BUF){depth++;history.pushState({g:depth},"")}}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,topUp,true));
window.addEventListener("popstate",e=>{
  depth=e.state&&typeof e.state.g==="number"?e.state.g:0;
  if(leaving)return;
  if(exitTried)return;   // δεύτερο πάτημα: αφήνουμε το Chrome να κάνει τη δουλειά του
  if($("#exitDlg").classList.contains("open")){$("#exitDlg").classList.remove("open");return}
  if(photoOpen()){closePhotoView();return}
  if(jobsMapOpen()){closeJobsMap();return}
  if(mapOpen()){closeMap();return}
  if($("#alert").classList.contains("open"))return;
  if($("#modal").classList.contains("open")){cancelSheet();return}
  if(view==="client"){view="clients";clientId=null;render();return}
  if(view!=="today"){view="today";clientId=null;render();window.scrollTo(0,0);return}
  $("#exitT").textContent=T("Έξοδος από την εφαρμογή;");$("#exitS").textContent=T("Τα δεδομένα σου μένουν αποθηκευμένα.");
  $("#exitNo").textContent=T("Όχι");$("#exitYes").textContent=T("Ναι, έξοδος");$("#exitDlg").classList.add("open");
});
$("#exitNo").onclick=()=>{$("#exitDlg").classList.remove("open");topUp()};
let exitTried=false;
$("#exitYes").onclick=()=>{
  exitTried=true;leaving=true;$("#exitDlg").classList.remove("open");
  // 1) Αν η εφαρμογή άνοιξε από εμάς (εγκατεστημένη ή νέα καρτέλα), κλείνει κανονικά.
  try{window.close()}catch(e){}
  // 2) Αλλιώς γυρνάμε πίσω από όλες τις δικές μας εγγραφές, ώστε το επόμενο «πίσω»
  //    να βγάζει έξω από τη σελίδα, χωρίς να ξαναρωτήσει.
  const d=depth;
  setTimeout(()=>{try{history.go(-(d+1))}catch(e){}},30);
  setTimeout(()=>{
    leaving=false;               // ο φρουρός φεύγει, αλλά το exitTried μένει: δεν ξαναρωτάει
    if(!document.hidden)toast(T("Πάτα άλλη μια φορά «πίσω» για να βγεις, ή το κουμπί αρχικής οθόνης."));
  },900);
};

/* ---------- Πληκτρολόγιο: κρατάμε ορατά τα κουμπιά του φύλλου ---------- */
const vv=window.visualViewport;
function fitViewport(){
  const R=document.documentElement.style;
  R.setProperty("--vvh",(vv?vv.height:window.innerHeight)+"px");
  const m=$("#modal");
  if(vv&&m.classList.contains("open")){m.style.height=vv.height+"px";m.style.top=vv.offsetTop+"px";m.style.bottom="auto"}
  else{m.style.height="";m.style.top="";m.style.bottom=""}
  setTimeout(updateStickBar,60);setTimeout(updateKbBar,60);
}
// «Επόμενο»: πηδάει στο επόμενο πεδίο μέσα στο ίδιο αναδυόμενο, χωρίς να κλείνει το πληκτρολόγιο
function kbFields(){
  const scope=$("#shBody");if(!scope)return[];
  return[...scope.querySelectorAll("input,textarea")].filter(el=>
    el.type!=="hidden"&&el.type!=="checkbox"&&el.type!=="radio"&&!el.disabled&&!el.readOnly&&el.offsetParent!==null);
}
let kbCurrent=null;
document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t&&t.closest&&t.closest("#shBody")&&/^(INPUT|TEXTAREA)$/.test(t.tagName)&&t.type!=="hidden"&&t.type!=="checkbox"&&t.type!=="radio"&&!t.readOnly)kbCurrent=t;
});
function updateKbBar(){
  const bar=$("#kbBar");if(!bar)return;
  const modalOpen=$("#modal").classList.contains("open");
  const inField=modalOpen&&kbCurrent&&document.contains(kbCurrent)&&kbCurrent===document.activeElement;
  bar.hidden=!inField;
  if(inField){
    const f=kbFields(),i=f.indexOf(kbCurrent);
    $("#kbNext").innerHTML=(i>=0&&i<f.length-1)?(T("Επόμενο")+" →"):T("Έτοιμο");
    // δεν κάθεται ποτέ πάνω από τα κουμπιά Αποθήκευση/Άκυρο του φύλλου
    const fx=$("#shFoot");
    bar.style.bottom=(fx&&fx.offsetHeight?fx.offsetHeight:0)+"px";
  }
}
function focusNextField(){
  const f=kbFields(),i=f.indexOf(kbCurrent);
  const next=f[i+1];
  if(next){kbCurrent=next;next.focus();try{next.select&&next.select()}catch(e){}}
  else if(kbCurrent)kbCurrent.blur();
}
$("#kbNext").onmousedown=e=>e.preventDefault(); // δεν κλέβει την εστίαση πριν προλάβει να τρέξει το click
$("#kbNext").onclick=focusNextField;
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;
  if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){document.body.classList.remove("typing");updateStickBar();updateKbBar()}},60));
if(vv){vv.addEventListener("resize",fitViewport);vv.addEventListener("scroll",fitViewport)}
window.addEventListener("resize",fitViewport);
document.addEventListener("focusin",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){document.body.classList.add("typing");[80,250,500].forEach(t=>{setTimeout(updateStickBar,t);setTimeout(updateKbBar,t)})}
  if(!$("#modal").classList.contains("open"))return;
  fitViewport();
  const el=e.target;
  if(el&&el.closest&&el.closest("#shBody"))setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),280);
});
// στις κανονικές προβολές: το πεδίο που γράφεις ανεβαίνει πάνω από το πληκτρολόγιο
function keepVisible(el){
  if(!el||!el.getBoundingClientRect)return;
  fitViewport();
  const r=el.getBoundingClientRect(),vh=(vv?vv.height:innerHeight),hdr=$("header").getBoundingClientRect().height+8;
  if(r.bottom>vh-14||r.top<hdr)el.scrollIntoView({block:"center",behavior:"smooth"});
}
document.addEventListener("focusin",e=>{
  const el=e.target;
  if(!el||!el.closest||!el.closest("main"))return;
  if(!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return;
  [180,420,700].forEach(t=>setTimeout(()=>keepVisible(el),t));
});

/* ---------- «Θύμισέ μου όταν φτάσω κοντά» ---------- */
let watchId=null,myPos=null;
const nearTasks=()=>S.tasks.filter(x=>isOpen(x)&&x.nearAlert>0&&taskLoc(x));
function updateWatch(){
  const want=(nearTasks().length>0||S.settings.debtAlert)&&navigator.geolocation&&window.isSecureContext&&!geoBlockedByFrame();
  if(want&&watchId==null){
    watchId=navigator.geolocation.watchPosition(p=>{
      myPos={lat:p.coords.latitude,lng:p.coords.longitude};checkNear();
    },()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
  }else if(!want&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
}
function debtNear(){
  if(!myPos||!S.settings.debtAlert)return;
  S.clients.filter(alive).forEach(c=>{
    const L=clientLoc(c);if(!L)return;
    const m=cMoney(c);if(m.owed<=0.004)return;
    const d=km(myPos,L)/1.3*1000;
    if(d<=(S.settings.debtRadius||1000)){
      if(c.debtMute&&c.debtMute>Date.now())return;
      if(c.debtFired&&Date.now()-c.debtFired<6*3600000)return;
      c.debtFired=Date.now();write();
      const title=T("{n} σου χρωστάει {a}",{n:c.name,a:money(m.owed)});
      if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([180,90,180]);
      phoneNotify(title,T("Είσαι κοντά του τώρα."),"debt-"+c.id);
      alertQ.push({type:"debt",id:c.id,dist:Math.round(d)});if(!alertShown)showNextAlert();
    }else if(c.debtFired&&d>(S.settings.debtRadius||1000)*1.6){c.debtFired=0;write()}
  });
}
function checkNear(){
  debtNear();
  if(!myPos)return;
  nearTasks().forEach(x=>{
    const L=taskLoc(x),d=km(myPos,L)/1.3*1000; // πραγματική ευθεία απόσταση σε μέτρα
    if(d<=x.nearAlert){
      if(x.nearMute&&x.nearMute>Date.now())return;
      if(x.nearFired&&Date.now()-x.nearFired<2*3600000)return;
      x.nearFired=Date.now();write();
      const c=x.clientId&&getClient(x.clientId);
      const title=T("Είσαι κοντά: {a}",{a:L.label});
      const body=x.title+(c?" — "+c.name:"");
      if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
      phoneNotify(title,body,"near-"+x.id);
      alertQ.push({type:"near",id:x.id,dist:Math.round(d)});if(!alertShown)showNextAlert();
    }else if(x.nearFired&&d>x.nearAlert*1.6){x.nearFired=0;write()}
  });
}
setInterval(()=>{updateWatch();checkNear()},45000);

function offerDraft(){
  const d=getDraft();if(!d||d.kind!=="task"||!d.data)return;
  const t=d.data.title||T("χωρίς τίτλο");
  const ex=d.data._editId?S.tasks.find(x=>x.id===d.data._editId&&alive(x)):null;
  const msg=ex?T("Είχες ανοιχτή την εργασία «{t}» με αλλαγές που δεν αποθηκεύτηκαν. Να συνεχίσεις;",{t:t})
             :T("Είχες ξεκινήσει μια εργασία («{t}») και δεν αποθηκεύτηκε. Να συνεχίσεις;",{t:t});
  if(confirm(msg))taskForm(ex||null,null,d.data);
  else clearDraft();
}
// Οι επαναλαμβανόμενες που έχασαν την ώρα τους (κλειστή εφαρμογή) πάνε στην επόμενη φορά, σαν ξυπνητήρι
S.reminders.forEach(r=>{if(remActive(r)&&r.repeat&&r.repeat!=="none"&&r.when&&Date.now()-new Date(r.when)>12*3600000){
  r.when=nextOccurrence(r);r.alerted=false;r.preAlerted=false;r.snoozeUntil=null}});
write();
purgeOldTrash();
applyLook();render();checkDue();fitViewport();updateWatch();setTimeout(offerDraft,700);setTimeout(showInstallBar,900);
initSW();
setTimeout(fsAutoBackup,3000);
setInterval(checkDue,15000);
setInterval(unfade,2000);
</script>
