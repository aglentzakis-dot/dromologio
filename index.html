  <div class="sh-body" id="shBody"></div>
  <div class="sh-fixed" id="shFixed"></div>
  <div class="sh-foot" id="shFoot"></div>
</div></div>
<div class="alert" id="alert"><div class="alertbox zm" role="alertdialog" id="alertBody"></div></div>
<div class="alert" id="exitDlg"><div class="alertbox zm" role="alertdialog" aria-labelledby="exitT">

  <div class="al-btns"><button class="btn ghost" id="exitNo"></button><button class="btn primary" id="exitYes"></button></div>
</div></div>
<div class="mapdlg" id="jobsDlg">
  <div class="map-top"><b id="jmT"></b><button class="x" id="jmOwedToggle" title=""></button><button class="x" id="jmX">✕</button></div>

  <div class="filterstrip" id="jmFilters"></div>
  <div class="jmowed" id="jmOwed" hidden><span id="jmOwedTxt"></span><button id="jmOwedX">✕</button></div>
  <div id="jmBox"></div>
  <div class="map-bot"><span class="mlbl" id="jmLbl"></span><span class="tf" style="flex:1"><input type="date" id="jmDate"></span>
    <button class="btn ghost" id="jmMe"></button></div>
</div>

  <div class="map-bot" id="phBot"></div>
</div>
<div class="mapdlg" id="mapDlg"><div class="map-top"><b id="mapT"></b><button class="x" id="mapX">✕</button></div><div id="mapBox"></div>
  <div class="map-bot"><button class="btn ghost" id="mapMe"></button><button class="btn primary" id="mapUse"></button></div></div>

<div class="undobar" id="undoBar" hidden><span></span><button class="btn amber small">Αναίρεση</button></div>
<div class="alert" id="clockDlg"><div class="clockbox zm" role="dialog" aria-modal="true">
  <div class="cl-top"><button class="cl-num" id="clH"></button><span>:</span><button class="cl-num" id="clM"></button></div>
  <div class="cl-dial" id="clDial"></div>
  <div class="cl-foot"><button class="btn ghost" id="clNow"></button><span class="grow"></span>
    <button class="btn ghost" id="clCancel"></button><button class="btn primary" id="clOk"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<datalist id="areaList"></datalist>
<datalist id="placeList"></datalist>
