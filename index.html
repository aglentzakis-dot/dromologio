/* ---------- Στρογγυλό ρολόι (δικό μας, ίδιο παντού) ---------- */
let clV={h:9,m:0},clStage="h",clCb=null;
function clDraw(){
  const dial=$("#clDial"),R=135,cx=135,cy=135;
  let html=`<svg viewBox="0 0 270 270"><circle cx="135" cy="135" r="4" fill="var(--brand)"/>`;
  const sel=clStage==="h"?clV.h:clV.m;
  const ang=clStage==="h"?((clV.h%12)/12)*360:(clV.m/60)*360;
  const rr=clStage==="h"&&(clV.h===0||clV.h>12)?76:108;
  const x=cx+rr*Math.sin(ang*Math.PI/180),y=cy-rr*Math.cos(ang*Math.PI/180);
  html+=`<line x1="135" y1="135" x2="${x}" y2="${y}" stroke="var(--brand)" stroke-width="3"/>
    <circle cx="${x}" cy="${y}" r="21" fill="var(--brand)" opacity=".18"/></svg>`;
  const put=(v,label,r,cls)=>{const a=((clStage==="h"?(v%12)/12:(v/60))*360)*Math.PI/180;
    const px=cx+r*Math.sin(a),py=cy-r*Math.cos(a);
    return `<div class="cn ${cls} ${v===sel?"sel":""}" style="left:${px}px;top:${py}px" data-cv="${v}">${label}</div>`};
  if(clStage==="h"){
    for(let i=1;i<=12;i++)html+=put(i,i,108,"");
    for(let i=13;i<=23;i++)html+=put(i,i,76,"inner");
    html+=put(0,"00",76,"inner");
  }else{
    for(let i=0;i<60;i+=5)html+=put(i,String(i).padStart(2,"0"),108,"");
  }
  dial.innerHTML=html;
  $("#clH").textContent=pad(clV.h);$("#clM").textContent=pad(clV.m);
  $("#clH").classList.toggle("on",clStage==="h");$("#clM").classList.toggle("on",clStage==="m");
}
function clFromPoint(e){
  const d=$("#clDial").getBoundingClientRect();
  const dx=e.clientX-(d.left+d.width/2),dy=e.clientY-(d.top+d.height/2);
  let a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;
  const r=Math.hypot(dx,dy);
  if(clStage==="h"){
    let h=Math.round(a/30)%12;
    const inner=r<d.width*0.33;
    if(inner){h=h===0?0:h+12;if(h===24)h=0}else if(h===0)h=12;
    clV.h=h;
  }else{
    clV.m=Math.round(a/6)%60;
  }
  clDraw();
}
function openClock(value,cb){
  const now=new Date();
  const v=String(value||"").match(/(\d{1,2}):(\d{2})/);
  clV={h:v?+v[1]:now.getHours(),m:v?+v[2]:now.getMinutes()};
  clStage="h";clCb=cb;
  $("#clNow").textContent=T("Τώρα");$("#clCancel").textContent=T("Άκυρο");$("#clOk").textContent=T("Εντάξει");
  $("#clockDlg").classList.add("open");clDraw();
}
function closeClock(){$("#clockDlg").classList.remove("open");clCb=null}
$("#clH").onclick=()=>{clStage="h";clDraw()};
$("#clM").onclick=()=>{clStage="m";clDraw()};
$("#clNow").onclick=()=>{const n=new Date();clV={h:n.getHours(),m:n.getMinutes()};clDraw()};
$("#clCancel").onclick=closeClock;
$("#clOk").onclick=()=>{const cb=clCb,val=pad(clV.h)+":"+pad(clV.m);closeClock();if(cb)cb(val)};

  d.addEventListener("pointerdown",e=>{down=true;d.setPointerCapture(e.pointerId);clFromPoint(e)});
  d.addEventListener("pointermove",e=>{if(down)clFromPoint(e)});

function decorateTime(root){
  if(!root)return;
  root.querySelectorAll("input[type=datetime-local],input[type=date],input[type=time]").forEach(el=>{
    if(el.dataset.tf)return;
    if(el.closest(".dtrow")){el.dataset.tf="1";return}
    el.dataset.tf="1";
    const w=document.createElement("span");w.className="tf";el.parentNode.insertBefore(w,el);w.appendChild(el);
    const b=document.createElement("button");b.type="button";b.className="tfbtn";b.tabIndex=-1;
    b.setAttribute("aria-label",T("Άνοιγμα ημερολογίου"));b.innerHTML=ic("clock",22);
    b.onclick=()=>{
      if(el.type==="time"&&S.settings.clock!=="native"){
        openClock(el.value,v=>{el.value=v;el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))});
        return;
      }
      try{el.showPicker()}catch(e){el.focus()}
    };w.appendChild(b);
    if(el.type==="time"&&S.settings.clock!=="native"){
      el.readOnly=true;
      el.addEventListener("focus",ev=>{ev.target.blur();b.click()});
      el.addEventListener("click",()=>b.click());
    }
  });
}
function segBind(id,v){const el=$("#"+id);const set=x=>{el.dataset.v=x;el.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v==x))};

const digits=s=>String(s||"").replace(/[^\d+]/g,"").replace(/^(\+|00)30/,"");
// «Λεωφόρος Κηφισίας 4» -> οδός + αριθμός· ο αριθμός είναι πάντα η τελευταία «λέξη» αν είναι αριθμός
function splitStreetNumber(street){
  const m=String(street||"").trim().match(/^(.*\S)[,]?\s+(\d{1,4}[Α-Ωα-ωA-Za-z]?)$/);
  return m?{street:m[1].trim(),number:m[2].trim()}:{street:String(street||"").trim(),number:""};
}
// «Αθήνα 115 26» ή «Αθήνα, 11526» -> περιοχή + ΤΚ (ελληνικός ΤΚ: 5 ψηφία, με ή χωρίς κενό στη μέση)
function splitAreaZip(text){
  const m=String(text||"").trim().match(/^(.*?)[,]?\s*(\d{3}\s?\d{2})\s*$/);
  return m?{area:m[1].trim(),zip:m[2].replace(/\s+/g,"")}:{area:String(text||"").trim(),zip:""};
}
function contactToClient(ct){
  const d={name:((ct.name||[])[0]||"").trim(),email:((ct.email||[])[0]||"").trim(),mobile:"",phone:""};
  (ct.tel||[]).forEach(p=>{const n=digits(p);if(!n)return;if(/^69/.test(n)){if(!d.mobile)d.mobile=p.trim()}else if(!d.phone)d.phone=p.trim()});
  const addrs=(ct.address||[]).map(a=>{
    const lines=(a.addressLine||[]).map(x=>String(x||"").trim()).filter(Boolean);
    const firstLine=lines[0]||"";
    let{street,number}=splitStreetNumber(firstLine);
    let area=(a.dependentLocality||a.city||a.region||"").trim();
    let zip=(a.postalCode||"").trim();
    if(!area&&!zip){
      // δεν υπήρχαν χωριστά πεδία από την επαφή· ψάξε περιοχή/ΤΚ στις υπόλοιπες γραμμές ή μετά το κόμμα της ίδιας γραμμής
      let rest=lines.length>1?lines.slice(1).join(" "):"";
      if(!rest&&firstLine.includes(",")){
        const parts=firstLine.split(",");
        rest=parts.slice(1).join(",").trim();
        if(rest){const sn=splitStreetNumber(parts[0]);street=sn.street;number=sn.number}
      }
      if(rest){const az=splitAreaZip(rest);area=az.area;zip=az.zip}
    }
    return{street,number,area,zip,label:(a.type||"").toString().trim()};
  }).filter(a=>a.street||a.area||a.zip);

let micRec=null;
function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(T("Η υπαγόρευση δεν υποστηρίζεται εδώ. Πάτα το μικρόφωνο του πληκτρολογίου σου."));$("#ai_text").focus();return}
  const b=$("#ai_mic");
  // δεύτερο πάτημα ενώ ακούει = «τελείωσα», σταματάει και συμπληρώνει
  if(micRec){try{micRec.stop()}catch(e){}return}
  const r=micRec=new SR();
  r.lang=LOC();r.interimResults=false;r.maxAlternatives=1;r.continuous=true;
  b.classList.add("rec");b.setAttribute("aria-label",T("Πάτα ξανά όταν τελειώσεις"));
  toast(T("Μίλα τώρα… σταματάει μόνο του μόλις κάνεις μια μικρή παύση."));
  let said="",silenceT=null;
  const armSilence=()=>{clearTimeout(silenceT);silenceT=setTimeout(()=>{try{r.stop()}catch(e){}},2200)};
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)said+=(said?" ":"")+e.results[i][0].transcript;
    }
    $("#ai_text").value=said;
    armSilence();
  };
  armSilence();
  r.onerror=e=>{if(e.error!=="no-speech"&&e.error!=="aborted")toast(e.error==="not-allowed"?T("Δεν δόθηκε άδεια για το μικρόφωνο."):T("Δεν ακούστηκε κάτι. Δοκίμασε ξανά."))};
  r.onend=()=>{clearTimeout(silenceT);b.classList.remove("rec");b.setAttribute("aria-label",T("Υπαγόρευση"));micRec=null;if(val("ai_text"))aiFill()};
  try{r.start()}catch(e){b.classList.remove("rec");micRec=null}
}

// βρίσκει μόνη της συντεταγμένες από τη διεύθυνση, ώστε να μπαίνει στις διαδρομές
async function geocodeClientIfNeeded(c,silent){
  const targets=[];
  if(c.lat==null&&(c.street||c.area))targets.push({o:c,q:[[c.street,c.number].filter(Boolean).join(" "),c.area,c.zip].filter(Boolean).join(", ")});
  (c.places||[]).forEach(pl=>{if(pl.lat==null&&(pl.street||pl.area))targets.push({o:pl,q:[[pl.street,pl.number].filter(Boolean).join(" "),pl.area,pl.zip].filter(Boolean).join(", ")})});
  if(!targets.length||localFile())return;
  let found=0;
  for(const t of targets){
    if(!t.q)continue;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=gr&accept-language=${LANG}&q=${encodeURIComponent(t.q)}`);
      const js=await r.json();
      if(js&&js[0]){t.o.lat=+js[0].lat;t.o.lng=+js[0].lon;found++;if(t.o.area)learnArea(t.o.area,t.o.lat,t.o.lng)}
    }catch(e){}
  }
  if(found){write();render();if(!silent)toast(pl_(found))}
  function pl_(n){return n===1?T("Βρέθηκε η θέση από τη διεύθυνση. Μπήκε στις διαδρομές."):T("Βρέθηκαν {n} θέσεις από τις διευθύνσεις.",{n:found})}
}

let tef={tid:null,dir:"all",kinds:[],per:"all"};
function tefPass(e,skip){
  if(skip!=="dir"&&tef.dir!=="all"&&(tef.dir==="in"?!entIn(e):!isOutRow(e)))return false;

function wrapText(ctx,text,x,y,maxW,lh,measureOnly){
  const words=String(text||"").split(/\s+/).filter(Boolean);let line="";
  for(const w of words){
    const test=line?line+" "+w:w;
    if(ctx.measureText(test).width>maxW&&line){if(!measureOnly)ctx.fillText(line,x,y);line=w;y+=lh}
    else line=test;
  }
  if(line){if(!measureOnly)ctx.fillText(line,x,y);y+=lh}
  return y;
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawFit(ctx,im,x,y,bw,bh,r){
  const k=Math.min(bw/im.naturalWidth,bh/im.naturalHeight);
  const w=im.naturalWidth*k,h=im.naturalHeight*k,dx=x+(bw-w)/2,dy=y+(bh-h)/2;
  if(r){ctx.save();roundRect(ctx,dx,dy,w,h,Math.min(r,w/2,h/2));ctx.clip();ctx.drawImage(im,dx,dy,w,h);ctx.restore()}
  else ctx.drawImage(im,dx,dy,w,h);

}

function docWatermark(ctx,W,H,top){
  top=top==null?DOC_H:top;
  const c=docCfg();
  if(c.mark===false)return;
  const txt=String(c.text||"").trim(),im=markImg();
  if(!txt&&!okImg(im))return;
  const size=Math.max(0.25,Math.min(1,+c.size||0.75));
  const ang=(c.tilt===false?0:(c.angle==null?-20:+c.angle))*Math.PI/180;
  const ah=Math.max(120,H-top-40);
  const cx=W/2+W*((+c.mx||0)/100),cy=top+16+ah/2+ah*((+c.my||0)/100);
  ctx.save();
  ctx.globalAlpha=Math.max(0.02,Math.min(0.3,+c.op||0.12));
  ctx.beginPath();ctx.rect(0,top+8,W,ah+16);ctx.clip();
  if(txt){
    ctx.translate(cx,cy);ctx.rotate(ang);
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=docTheme().ink;
    let fs=240;ctx.font="bold "+fs+"px system-ui,sans-serif";
    const w=ctx.measureText(txt).width||1,room=W*size*(ang?0.86:0.96);
    fs=Math.max(18,Math.min(420,Math.round(fs*room/w)));
    if(fs>ah*size*1.25)fs=Math.round(ah*size*1.25);
    ctx.font="bold "+fs+"px system-ui,sans-serif";
    ctx.fillText(txt,0,0);
  }else{
    try{ctx.filter="grayscale(0.55)"}catch(e){}
    const bw=W*size,bh=ah*size;
    if(c.fill===false){
      ctx.translate(cx,cy);ctx.rotate(ang);
      drawFit(ctx,im,-bw/2,-bh/2,bw,bh,bw*0.05);
    }else{
      const iw=im.naturalWidth||1,ih=im.naturalHeight||1;
      const tw=Math.max(90,W*size*0.46),th=ih*(tw/iw),diag=Math.hypot(W,ah)*1.2;
      ctx.translate(cx,cy);ctx.rotate(ang);
      const gx=tw*1.22,gy=th*1.7;
      for(let y=-diag;y<=diag;y+=gy)for(let x=-diag;x<=diag;x+=gx)ctx.drawImage(im,x,y,tw,th);
    }
  }
  ctx.restore();ctx.textBaseline="alphabetic";ctx.textAlign="left";
}

// Προσφορά: τραβάει ό,τι υπάρχει ήδη (πελάτης, τίτλος, λεπτομέρειες, τιμή, διεύθυνση,
// στοιχεία επιχείρησης, υλικά από τη λίστα ελέγχου) ώστε να μη γράφεις σχεδόν τίποτα.
// ——— Προσφορά ———

const OFFER_TERMS_OLD="Η τιμή περιλαμβάνει εργασία και υλικά. Πληρωμή με την ολοκλήρωση.";
const OFFER_TERMS_DEF="Η προσφορά περιλαμβάνει τις εργασίες και τα υλικά που αναφέρονται παραπάνω.\nΤυχόν πρόσθετες εργασίες ή υλικά που δεν περιλαμβάνονται στην παρούσα προσφορά χρεώνονται κατόπιν συνεννόησης και έγκρισης του πελάτη.\nΗ εξόφληση πραγματοποιείται με την ολοκλήρωση της εργασίας.";
const OFFER_INCL_DEF=[
  {l:"Εργασία",t:"Εργασία κατασκευής και εκτέλεσης"},
  {l:"Υλικά",t:"Προμήθεια των απαιτούμενων υλικών"},
  {l:"Μεταφορά",t:"Μεταφορά υλικών στον χώρο του έργου"},

  {l:"Τοποθέτηση",t:"Τοποθέτηση και σύνδεση"},
  {l:"Εργαλεία και μικροϋλικά",t:"Χρήση απαραίτητων εργαλείων και μικροϋλικών"},
  {l:"Καθαρισμός μετά",t:"Παράδοση του χώρου καθαρού και ολοκληρωμένου"}];
const OFFER_EXCL_DEF=[
  {l:"Οικοδομικές εργασίες",t:"Οικοδομικές εργασίες που δεν αναφέρονται στην προσφορά",on:1},
  {l:"Απρόβλεπτα υλικά",t:"Πρόσθετα υλικά που θα απαιτηθούν λόγω απρόβλεπτων συνθηκών",on:1},
  {l:"Επιπλέον εργασίες",t:"Εργασίες που θα ζητηθούν επιπλέον από τον πελάτη",on:1},

const offerTermsDef=()=>T(OFFER_TERMS_DEF);

  if([OFFER_TERMS_OLD,OFFER_TERMS_DEF].some(d=>v===d.trim()||(EN[d]||"").trim()===v||((window.LANGPACK[LANG]||{})[d]||"").trim()===v))return true;

function offerLists(){

// Φέρνει την προσφορά της εργασίας σε σωστή μορφή· αν δεν έχει σταλεί, γεμίζει τα κενά από την εργασία.

  if(+o.no&&+o.no<OFFER_FIRST_NO)delete o.no;   // παλιά αρίθμηση από προηγούμενη έκδοση
  const cid=dr.clientId!=null&&dr.clientId!==""?dr.clientId:x.clientId;

  if(o.warrTerms==null)o.warrTerms=warrTermsDef();
  if(o.deposit==null)o.deposit=+S.settings.depositLast||0;
  // ΦΠΑ: προεπιλογή «δεν περιλαμβάνεται», με το ποσοστό που έχεις δηλώσει (Ελλάδα 24%)

    }

function pageImage(cv,sl,P,i){

function canvasToPdfBlob(cv){
  const P=docPages(cv),PW=P.PW,PH=P.PH,M=P.M,scale=P.scale;
  const imgs=[];
  for(const [si,sl] of P.slices.entries()){
    const t=pageImage(cv,sl,P,si),h=t.height;
    const b64=t.toDataURL("image/jpeg",0.9).split(",")[1];
    const bin=atob(b64),arr=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
    imgs.push({data:arr,w:t.width,h:h,lw:cvW(t),lh:cvH(t)});
  }
  const parts=[],offs=[];let len=0;
  const push=str=>{const arr=typeof str==="string"?new TextEncoder().encode(str):str;parts.push(arr);len+=arr.length};
  const obj=(n,body)=>{offs[n]=len;push(n+" 0 obj\n"+body+"\nendobj\n")};
  push("%PDF-1.4\n");
  const kids=imgs.map((_,i)=>(3+i*3)+" 0 R").join(" ");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids+"] /Count "+imgs.length+" >>");
  imgs.forEach((im,i)=>{
    const pid=3+i*3,cid=pid+1,iid=pid+2;
    const w=im.lw*scale,h=im.lh*scale,ox=(PW-w)/2,oy=PH-M-h;   // από την κορυφή της σελίδας
    obj(pid,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW.toFixed(2)+" "+PH.toFixed(2)+
      "] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>");
    const content="q "+w.toFixed(2)+" 0 0 "+h.toFixed(2)+" "+ox.toFixed(2)+" "+oy.toFixed(2)+" cm /Im0 Do Q";
    obj(cid,"<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream");
    offs[iid]=len;
    push(iid+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.data.length+" >>\nstream\n");
    push(im.data);push("\nendstream\nendobj\n");
  });
  const total=2+imgs.length*3;
  const xref=len;
  let x="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=total;i++)x+=String(offs[i]||0).padStart(10,"0")+" 00000 n \n";
  push(x+"trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}

function pagePreview(cv){
  const P=docPages(cv),pageH=P.pageH,mPx=P.mPx,pages=P.slices.length,CW=cvW(cv);
  const pw=CW+mPx*2,ph=pageH+mPx*2;
  const gap=Math.round(CW*0.05),lab=Math.round(CW*0.052);
  const OW=pw+gap*2,OH=pages*(ph+lab+gap)+gap;
  const[out,ctx]=hiCanvas(OW,OH,Math.max(1,Math.min(1.5,cvS(cv),Math.sqrt(14e6/(OW*OH)))));
  ctx.fillStyle="#E7ECEF";ctx.fillRect(0,0,OW,OH);
  for(let i=0;i<pages;i++){
    const y=gap+i*(ph+lab+gap);
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,.18)";ctx.shadowBlur=14;ctx.shadowOffsetY=4;
    ctx.fillStyle="#ffffff";ctx.fillRect(gap,y,pw,ph);
    ctx.restore();
    ctx.save();
    const sl=P.slices[i];
    ctx.beginPath();ctx.rect(gap,y,pw,ph);ctx.clip();
    const pim=pageImage(cv,sl,P,i);ctx.drawImage(pim,0,0,pim.width,pim.height,gap+mPx,y+mPx,cvW(pim),cvH(pim));

    ctx.fillStyle="#5E7185";ctx.font="bold "+Math.round(lab*0.62)+"px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText(T("Σελίδα {i} από {n}",{i:i+1,n:pages}),OW/2,y+ph+lab*0.78);
    ctx.textAlign="left";
  }
  return out;
}

    const blob=canvasToPdfBlob(cv),file=new File([blob],filename,{type:"application/pdf"});
    if(share!==false&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});return true}catch(e){if(e.name==="AbortError")return false}

    setTimeout(()=>URL.revokeObjectURL(url),4000);

    return true;
  }catch(e){toast(T("Το PDF δεν δημιουργήθηκε."));return false}
}

function stopSound(){

function playSound(kind,repeatFor){
  stopSound();
  const key=kind||S.settings.sound;
  const custom=customSoundById(key);
  if(custom){
    try{
      audioEl=audioEl||new Audio();
      audioEl.src=custom.dataUrl;audioEl.currentTime=0;audioEl.loop=false;
      audioEl.play().catch(()=>{});
      if(custom.persistent&&repeatFor!==false){
        audioEl.loop=true;
        const until=Date.now()+(typeof repeatFor==="number"?repeatFor:45000);
        loopT=setInterval(()=>{if(Date.now()>until||!$("#alert").classList.contains("open"))stopSound()},500);
      }
    }catch(e){}
    return;
  }
  const s=SOUNDS[key]||SOUNDS.chime;if(!s.notes.length)return;

    const until=Date.now()+(typeof repeatFor==="number"?repeatFor:45000);
    playOnce(s);loopT=setInterval(()=>{if(Date.now()>until||!$("#alert").classList.contains("open"))stopSound();else playOnce(s)},s.loop*1000);
    return;
  }
  playOnce(s);
}
function playOnce(s){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    s.notes.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+t;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.start(t0);o.stop(t0+d+.05)});
  }catch(e){}
}

function fmSetOwner(ids,owner){
  return new Promise(res=>{
    let r;try{r=indexedDB.open("fotometra",1)}catch(e){return res(0)}
    r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};
    r.onerror=()=>res(0);
    r.onsuccess=()=>{const d=r.result;
      if(!d.objectStoreNames.contains("p")){d.close();return res(0)}
      const tx=d.transaction("p","readwrite"),st=tx.objectStore("p");let n=0;
      ids.forEach(id=>{const g=st.get(id);g.onsuccess=()=>{const rec=g.result;if(rec){rec.owner=owner;st.put(rec);n++}}});
      tx.oncomplete=()=>{d.close();res(n)};tx.onerror=()=>{d.close();res(n)}};
  });
}

async function urlToDataUrl(u){
  if(!u)return null;
  if(String(u).startsWith("data:"))return u;
  const r=await fetch(u);const bl=await r.blob();
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(bl)});
}
function shrinkDataUrl(dataUrl,maxDim,q){
  return new Promise((res,rej)=>{const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",q))};
    img.onerror=()=>rej(new Error("img"));img.src=dataUrl});
}
// Θέλουμε την ΤΕΛΙΚΗ εικόνα, με τις μετρήσεις και τις σημειώσεις πάνω της,
// όχι τη γυμνή φωτογραφία. Δοκιμάζουμε με σειρά προτεραιότητας ό,τι δίνει η ΦωτοΜέτρα.
async function fotoFlatSource(rec){
  // 1) συναρτήσεις που επιστρέφουν την «ψημένη» εικόνα
  for(const fn of ["flat","flatten","render","export","image","full","composite"]){
    if(typeof FotoMetra[fn]==="function"){
      try{const v=await Promise.resolve(FotoMetra[fn](rec));if(v)return v}catch(e){}
    }
  }
  // 2) πεδία μέσα στην ίδια την εγγραφή
  for(const k of ["flatUrl","flat","composite","annotated","rendered","exportUrl","full","image","png","jpeg","dataUrl","url"]){
    if(rec&&rec[k])return rec[k];
  }
  // χωρίς ενδείξεις δεν την κρατάμε: η γυμνή μικρογραφία δεν βοηθάει
  return null;
}
let fmBusy=false,fmOwner=null,fmOpenAt=0;

async function syncFotoPhotos(owner,loud){

  const tgt=fotoTarget(owner);if(!tgt)return 0;

function fmRender(owner,tgt){render();if(owner.startsWith("ergasia:")&&$("#phogrid"))try{drawTaskPhotos(tgt)}catch(e){}}
async function syncFotoInner(owner,tgt,loud){
  if(!Array.isArray(tgt.photos))tgt.photos=[];
  let recs=[];
  try{recs=await Promise.resolve(FotoMetra.list(owner))||[]}catch(e){return 0}
  const have=new Map(tgt.photos.filter(p=>p.fmId).map(p=>[p.fmId,p]));
  const stamp=r=>String(r&&(r.updated||r.updatedAt||r.edited||r.date||"")||"");
  const todo=recs.filter(rec=>{const rid=String(rec&&(rec.id||rec.key||rec.name)||"");if(!rid)return false;
    const old=have.get(rid);return !old||old.pending||(stamp(rec)&&old.fmDate&&old.fmDate!==stamp(rec))});
  if(!todo.length)return 0;
  if(loud)toast(pl(todo.length,"Αποθηκεύεται {n} φωτογραφία με τις ενδείξεις…","Αποθηκεύονται {n} φωτογραφίες με τις ενδείξεις…"));
  let added=0,updated=0,failed=0;
  const who=tgt.name||tgt.title||T("Φωτογραφίες");
  // 1) αμέσως: προσωρινή μικρογραφία, για να φαίνεται ότι ήρθε
  for(const rec of todo){
    const rid=String(rec.id||rec.key||rec.name);if(have.get(rid))continue;
    try{let u=null;if(typeof FotoMetra.thumb==="function")u=await urlToDataUrl(FotoMetra.thumb(rec));
      const ph={id:uid(),fmId:rid,fmDate:"",dataUrl:u?await shrinkDataUrl(u,360,.6):"",label:"",at:Date.now(),fromFoto:true,pending:true};
      tgt.photos.push(ph);have.set(rid,ph)}catch(e){}
  }
  write();fmRender(owner,tgt);
  // 2) η τελική εικόνα με τις ενδείξεις, μία μία
  for(const rec of todo){
    const rid=String(rec.id||rec.key||rec.name);
    try{
      const src=await fotoFlatSource(rec);
      const raw=await urlToDataUrl(src);if(!raw){failed++;continue}
      const small=await shrinkDataUrl(raw,1280,.72);
      const old=have.get(rid);
      if(old){const wasNew=old.pending&&!old.fmDate;old.dataUrl=small;old.fmDate=stamp(rec)||"1";old.at=Date.now();delete old.pending;fsSavePhoto(old,who,"perm");if(wasNew)added++;else updated++}
      else{const ph={id:uid(),fmId:rid,fmDate:stamp(rec)||"1",dataUrl:small,label:"",at:Date.now(),fromFoto:true};tgt.photos.push(ph);fsSavePhoto(ph,who,"perm");added++}
      write();fmRender(owner,tgt);
    }catch(e){failed++}
  }
  // ό,τι δεν μπόρεσε να βγει με ενδείξεις δεν μένει ως γυμνή φωτογραφία
  const before=tgt.photos.length;tgt.photos=tgt.photos.filter(p=>!(p.pending&&!p.fmDate));if(tgt.photos.length!==before){write();fmRender(owner,tgt)}
  if(added||updated){if(!write())toast(T("Δεν χωράνε άλλες φωτογραφίες στη μνήμη της εφαρμογής. Σβήσε κάποιες παλιές."));else{fmRender(owner,tgt);
    toast([added?pl(added,"Αποθηκεύτηκε στον πελάτη {n} φωτογραφία με τις ενδείξεις.","Αποθηκεύτηκαν στον πελάτη {n} φωτογραφίες με τις ενδείξεις."):"",updated?pl(updated,"Ενημερώθηκε {n} φωτογραφία.","Ενημερώθηκαν {n} φωτογραφίες."):""].filter(Boolean).join(" "))}}
  else if(failed&&loud)toast(T("Η φωτογραφία δεν μπόρεσε να αποθηκευτεί με τις ενδείξεις. Δοκίμασε να ανοίξεις και να κλείσεις ξανά τη ΦωτοΜέτρα."));
  return added+updated;
}

  openSheet({title:isBase?T("Σπίτι ή έδρα"):idx!=null?T("Επεξεργασία τοποθεσίας"):T("Νέα τοποθεσία"),cancelLabel:back?T("Πίσω"):T("Άκυρο"),onCancel:back||null,

      const o={name,area,address:val("lw_addr"),lat:LW.loc?LW.loc.lat:null,lng:LW.loc?LW.loc.lng:null};
      if(isBase){S.settings.base=o;if(!route.fromGeo)route.from=""}

/* ---------- Άδεια χρήσης: δοκιμή, Pro, κλειδιά ----------
   Τοπικός έλεγχος, χωρίς διακομιστή και χωρίς λογαριασμό. Τα δεδομένα μένουν πάντα του χρήστη:
   ακόμη κι όταν λήξει η άδεια, τα βλέπει όλα — απλώς δεν βγάζει νέα επαγγελματικά έγγραφα. */
// Κλειστή δοκιμή: αν γίνει true, η εφαρμογή ανοίγει μόνο με κλειδί.
// Τώρα είναι ανοιχτή για όλους: μπαίνεις κατευθείαν, με 30 μέρες δοκιμή.
const INVITE_MODE=false;
const INVITE_MASTER="DROMOLOGIO";   // ο δικός σου κωδικός, μπαίνει στο πεδίο «Κλειδί»
const TRIAL_DAYS=30;
/* Κρυφός διακόπτης του κατασκευαστή: δείχνει τη «Δοκιμή κλειδώματος» στην οθόνη της άδειας,
   για να βλέπεις την εφαρμογή σαν να τελείωσε η δοκιμή. Κανείς άλλος δεν τον βλέπει:
   ανοίγει μόνο αν πατήσεις 7 φορές τη γραμμή με την έκδοση, στις Ρυθμίσεις → Δεδομένα. */
const licDev=()=>!!(S.settings&&S.settings.devOn),LIC_TEST_CODE="1234";
const licTestOn=()=>licDev()&&!!S.settings.licTestOn;
const LIC_SALT="dromologio-2026-kleidi";
const PRICE={year:"12 €",two:"20 €",three:"27 €",ever:"45 €"};
// Συμπλήρωσε εδώ πώς θα σε πληρώνουν· εμφανίζεται μέσα στην εφαρμογή.
const PAY_INFO={
  email:"aglentzakis.apps@gmail.com",
  phone:"",
  iban:"",
  link:""
};
const licNorm=s=>String(s||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩΆΈΉΊΌΎΏ]/g,"");
function licHash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
const lic36=(n,len)=>n.toString(36).toUpperCase().padStart(len,"0").slice(-len);
function licMake(name,until){
  const base=licNorm(name)+"|"+until+"|"+LIC_SALT;
  const d=until.slice(2,4)+until.slice(5,7)+until.slice(8,10);
  return "DR-"+d+"-"+lic36(licHash(base),6)+"-"+lic36(licHash(base+"#2"),4);
}
// Ελέγχει το κλειδί και επιστρέφει την ημερομηνία λήξης, ή κενό αν δεν ταιριάζει.
function licCheck(name,key){
  const k=String(key||"").toUpperCase().replace(/\s+/g,"");
  const m=/^DR-(\d{6})-([0-9A-Z]{6})-([0-9A-Z]{4})$/.exec(k);
  if(!m)return "";
  const until="20"+m[1].slice(0,2)+"-"+m[1].slice(2,4)+"-"+m[1].slice(4,6);
  return licMake(name,until)===k?until:"";
}
const licDays=until=>Math.ceil((new Date(until+"T23:59:59").getTime()-Date.now())/86400000);
function licState(){
  const l=S.settings.lic||{};
  if(licTestOn()){
    if(l.test)return{pro:true,kind:"test",until:"2099-12-31",name:l.name||"",left:9999};
    if(!(l.key&&l.until&&licCheck(l.name,l.key)===l.until&&licDays(l.until)>0))return{pro:false,kind:"free",had:false};
  }
  if(l.key&&l.until&&licCheck(l.name,l.key)===l.until&&licDays(l.until)>0)
    return{pro:true,kind:"lic",until:l.until,name:l.name,left:licDays(l.until)};
  if(!S.meta.firstRun)S.meta.firstRun=Date.now();
  const left=Math.ceil((S.meta.firstRun+TRIAL_DAYS*86400000-Date.now())/86400000);
  if(left>0)return{pro:true,kind:"trial",left};
  return{pro:false,kind:"free",had:!!l.key};
}
const isPro=()=>licState().pro;
// Ποιος μπορεί να ανοίξει την εφαρμογή όσο είναι σε κλειστή δοκιμή
function inviteOK(){
  if(!INVITE_MODE)return true;
  const l=S.settings.lic||{};
  if(l.master)return true;
  if(l.test&&licTestOn())return true;
  return !!(l.key&&l.until&&licCheck(l.name,l.key)===l.until&&licDays(l.until)>0);
}
function gatePaint(){

    if(key&&key===INVITE_MASTER.toUpperCase()){S.settings.lic=Object.assign({},S.settings.lic,{master:true,name:name||""});write();gatePaint();render();toast(T("Καλώς ήρθες."));return}
    if(!name){toast(T("Γράψε το όνομα με το οποίο πήρες το κλειδί."));return}
    const until=licCheck(name,key);
    if(!until){toast(T("Το κλειδί δεν ταιριάζει με αυτό το όνομα."));return}
    if(licDays(until)<=0){toast(T("Αυτό το κλειδί έχει λήξει."));return}
    S.settings.lic={name,key,until};write();gatePaint();render();
    toast(T("Ενεργοποιήθηκε έως {d}.",{d:new Date(until+"T12:00").toLocaleDateString(LOC())}));
  };
  $("#g_ask").onclick=()=>{
    const sub="Route Planner — "+T("Δεν έχω κλειδί — ζήτησέ το");
    location.href=`mailto:${DEV_EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(T("Όνομα ή επωνυμία")+": "+(val("g_name")||""))}`;
  };
}

/* ---------- Αντίγραφο ασφαλείας ---------- */
const ejCfg=()=>({service:S.settings.ejService||EJ_SERVICE,template:S.settings.ejTemplate||EJ_TEMPLATE,key:S.settings.ejKey||EJ_KEY});
const mailReady=()=>{const c=ejCfg();return !!(c.service&&c.template&&c.key)};
function backupStatus(){const m=S.meta;return(m.lastBackup?T("Τελευταίο αντίγραφο: {d}.",{d:fmt(m.lastBackup)}):T("Δεν έχει κρατηθεί ακόμα αντίγραφο από αυτή τη συσκευή."))+" "+T("Αλλαγές από τότε: {n}.",{n:m.changes})}
function markBackup(){S.meta.changes=0;S.meta.lastBackup=new Date().toISOString();write();render();if($("#bkStatus"))$("#bkStatus").textContent=backupStatus()}
const backupPayload=()=>JSON.stringify(Object.assign({efarmogi:"dromologio",ekdosi:2,dimiourgia:new Date().toISOString()},S));
const fileName=ext=>`dromologio-antigrafo-${toLocalInput(new Date()).slice(0,10)}.${ext}`;
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupPayload()],{type:"application/json"}));
  a.download=fileName("json");document.body.appendChild(a);a.click();a.remove();markBackup();fsSaveBackup("perm");toast(T("Το αρχείο αποθηκεύτηκε στις «Λήψεις» του κινητού."))}
async function sendEmailBackup(silent){
  const s=S.settings;
  if(!mailReady()){if(!silent)toast(T("Η αποστολή στο ταχυδρομείο δεν έχει ενεργοποιηθεί ακόμα στην εφαρμογή."));return false}
  if(!/^\S+@\S+\.\S+$/.test(s.backupEmail)){if(!silent)toast(T("Γράψε σωστή διεύθυνση ηλεκτρονικού ταχυδρομείου."));return false}
  const data=backupPayload(),date=new Date().toLocaleString(LOC());
  if(data.length>45000){
    if(!silent)toast(T("Τα δεδομένα ξεπέρασαν το όριο του ταχυδρομείου. Χρησιμοποίησε «Κοινοποίηση» ή «Αποθήκευση αρχείου»."));
    return false;
  }
  try{
    const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({service_id:ejCfg().service,template_id:ejCfg().template,user_id:ejCfg().key,template_params:{user_email:s.backupEmail,to_email:s.backupEmail,
        name:"Δρομολόγιο",time:date,message:data,
        from_name:"Δρομολόγιο",app_name:"Δρομολόγιο",reply_to:"aglentzakis.apps@gmail.com",
        subject:"Δρομολόγιο – Backup δεδομένων",title:"Δρομολόγιο – Backup δεδομένων",
        date,file_name:fileName("json"),backup_data:data}})});
    if(r.ok){markBackup();if(!silent)toast(T("Το αντίγραφο στάλθηκε στο {e}.",{e:s.backupEmail}));return true}
    let why="";try{why=((await r.text())||"").slice(0,120)}catch(e){}
    if(!silent)toast(r.status===413?T("Τα δεδομένα είναι πολλά για αποστολή. Χρησιμοποίησε την κοινοποίηση αρχείου.")
      :r.status===403?T("Το EmailJS απέρριψε το αίτημα. Έλεγξε το δημόσιο κλειδί και ότι επιτρέπονται οι αποστολές από τον φυλλομετρητή.")
      :r.status===400?T("Λάθος κωδικός υπηρεσίας ή προτύπου. {w}",{w:why})
      :T("Η αποστολή απέτυχε, κωδικός σφάλματος {c}. {w}",{c:r.status,w:why}));
  }catch(e){if(!silent)toast(T("Δεν υπάρχει σύνδεση στο διαδίκτυο. Δοκίμασε ξανά ή αποθήκευσε αρχείο."))}
  return false;
}
let autoTimer=null;
function scheduleAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(async()=>{
  const s=S.settings,m=S.meta;if(!s.autoEmail||!s.backupEmail||!mailReady()||m.changes<s.backupEvery||!navigator.onLine)return;
  if(Date.now()-(m.lastAuto||0)<30*60000)return;m.lastAuto=Date.now();write();
  if(await sendEmailBackup(true))toast(T("Στάλθηκε αυτόματα αντίγραφο στο ταχυδρομείο σου."))},4000)}
function parseBackup(text){
  let s=String(text||"").trim();const i=s.indexOf("{"),j=s.lastIndexOf("}");if(i<0||j<i)return null;s=s.slice(i,j+1);
  let d;try{d=JSON.parse(s)}catch(e){try{d=JSON.parse(s.replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/&#39;/g,"'"))}catch(e2){return null}}
  const find=(o,depth=0)=>{if(!o||typeof o!=="object"||depth>4)return null;
    if(Array.isArray(o.clients)||Array.isArray(o.tasks)||Array.isArray(o.reminders))return o;
    for(const k of Object.keys(o)){let x=o[k];if(typeof x==="string"&&x.trim().startsWith("{")){try{x=JSON.parse(x)}catch(e){x=null}}const r=find(x,depth+1);if(r)return r}return null};
  return find(d);
}

function backupDiff(d){
  const cur=new Map(S.ledger.map(e=>[e.id,e])),curT=new Map(S.tasks.map(x=>[x.id,x]));
  const L=(d.ledger||[]).filter(e=>e&&e.id&&!e.trashed);
  const miss=L.filter(e=>!cur.has(e.id));
  const bin=L.filter(e=>cur.has(e.id)&&cur.get(e.id).trashed);
  const chg=L.filter(e=>{const c=cur.get(e.id);return c&&!c.trashed&&(Math.abs((+c.amount||0)-(+e.amount||0))>0.004||(c.kind!==e.kind)||(c.note||"")!==(e.note||""))});
  const T0=(d.tasks||[]).filter(x=>x&&x.id&&!x.trashed);
  const tmiss=T0.filter(x=>!curT.has(x.id)||curT.get(x.id).trashed);
  return {d,miss,bin,chg,tmiss,cur,curT};
}

function exportFrom(per){
  const d=new Date();d.setHours(0,0,0,0);
  if(per==="day")return d;
  if(per==="week"){const x=new Date(d);x.setDate(x.getDate()-7);return x}
  if(per==="month"){const x=new Date(d);x.setMonth(x.getMonth()-1);return x}
  if(per==="quarter"){const x=new Date(d);x.setMonth(x.getMonth()-3);return x}
  if(per==="half"){const x=new Date(d);x.setMonth(x.getMonth()-6);return x}
  if(per==="year")return new Date(d.getFullYear(),0,1);
  if(/^\d{4}$/.test(per))return new Date(+per,0,1);
  return null;
}
function exportRows(per,cid){
  const from=exportFrom(per),to=/^\d{4}$/.test(per)?new Date(+per+1,0,1):null;
  const inR=t=>{const x=new Date(t);return(!from||x>=from)&&(!to||x<to)};
  const rows=[[T("Ημερομηνία"),T("Είδος"),T("Έσοδο/Έξοδο"),T("Ποσό"),T("Πελάτης"),T("Εργασία"),T("Σημείωση"),T("Κατάσταση")]];
  S.ledger.filter(alive).filter(e=>inR(e.date)).filter(e=>!cid||e.clientId===cid)
    .sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(e=>{
    const c=getClient(e.clientId),tk=S.tasks.find(x=>x.id===e.taskId);
    rows.push([new Date(e.date).toLocaleDateString("el-GR"),kindName(e.kind),entIn(e)?T("Έσοδο"):T("Έξοδο"),
      String(e.amount).replace(".",","),c?c.name:"",tk?tk.title:"",e.note||"",e.cancelled?T("ακυρώθηκε"):""]);
  });
  return rows;
}
function doExport(per,cid){
  const rows=exportRows(per,cid);
  if(rows.length<2)return toast(T("Δεν υπάρχουν κινήσεις για αυτή την επιλογή."));
  const inSum=rows.slice(1).filter(r=>r[2]===T("Έσοδο")).reduce((s,r)=>s+(+String(r[3]).replace(",","."))||0,0);
  const outSum=rows.slice(1).filter(r=>r[2]===T("Έξοδο")).reduce((s,r)=>s+(+String(r[3]).replace(",","."))||0,0);
  rows.push([]);rows.push([T("Σύνολο εσόδων"),"","",String(rnd(inSum)).replace(".",",")]);
  rows.push([T("Σύνολο εξόδων"),"","",String(rnd(outSum)).replace(".",",")]);
  rows.push([T("Καθαρό"),"","",String(rnd(inSum-outSum)).replace(".",",")]);
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const c=cid&&getClient(cid);
  const name=`kiniseis-${c?c.name.replace(/\s+/g,"-"):per}-${toLocalInput(new Date()).slice(0,10)}.csv`;
  const file=new File([csv],name,{type:"text/csv"});
  fsSave("export",name,new Blob([csv],{type:"text/csv"}),"perm");
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:T("Κινήσεις")}).then(()=>toast(T("Στάλθηκε."))).catch(()=>{});
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();toast(T("Το αρχείο αποθηκεύτηκε στις «Λήψεις» του κινητού."));
}

/* ---------- Κοινός φάκελος στη συσκευή ----------
   Ένας φάκελος που τον διαλέγεις μία φορά και τον μοιράζονται όλες οι εφαρμογές.
   Το Δρομολόγιο γράφει μόνο μέσα στον δικό του υποφάκελο: αντίγραφα, προσφορές,
   αποδείξεις, φωτογραφίες, εξαγωγές. Από εκεί γίνεται και η επαναφορά. */
const FS_DB="shared-backups",FS_STORE="handles",FS_KEY="root",FS_APP="Dromologio";
const FS_SUB={backup:"Αντίγραφα",offer:"Προσφορές",receipt:"Αποδείξεις",photo:"Φωτογραφίες",export:"Εξαγωγές"};
const fsOK=()=>typeof window.showDirectoryPicker==="function"&&window.isSecureContext;
function fsIdb(){return new Promise((res,rej)=>{const r=indexedDB.open(FS_DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(FS_STORE))d.createObjectStore(FS_STORE)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fsIdbDo(mode,fn){try{const db=await fsIdb();return await new Promise((res,rej)=>{
  const tx=db.transaction(FS_STORE,mode),st=tx.objectStore(FS_STORE),rq=fn(st);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}catch(e){return null}}
const fsGetHandle=()=>fsIdbDo("readonly",st=>st.get(FS_KEY));
const fsPutHandle=h=>fsIdbDo("readwrite",st=>st.put(h,FS_KEY));
const fsDelHandle=()=>fsIdbDo("readwrite",st=>st.delete(FS_KEY));
async function fsPerm(h,ask){
  try{const o={mode:"readwrite"};let p=await h.queryPermission(o);if(p==="granted")return true;
    if(!ask)return false;p=await h.requestPermission(o);return p==="granted"}catch(e){return false}
}
// ask=true μόνο όταν το ζητάει ο χρήστης με το χέρι· αλλιώς δουλεύει σιωπηλά ή δεν κάνει τίποτα.
async function fsRoot(ask){
  if(!fsOK())return null;
  let h=await fsGetHandle();
  if(h&&await fsPerm(h,!!ask))return h;
  if(ask!==true)return null;
  try{h=await window.showDirectoryPicker({id:"backups",mode:"readwrite",startIn:"downloads"})}catch(e){return null}
  if(!await fsPerm(h,true))return null;
  await fsPutHandle(h);return h;
}
// Πού μπαίνουν τα αρχεία: αν ο φάκελος που διάλεξες λέγεται ήδη «Δρομολόγιο», μπαίνουν κατευθείαν εκεί·
// αλλιώς σε υποφάκελο «Δρομολόγιο» (ελληνικά). Ό,τι είχε μπει παλιά στον λατινικό «Dromologio» αντιγράφεται μία φορά εκεί.
const FS_APP_GR="Δρομολόγιο";
const fsIsApp=n=>/^(δρομολογιο|dromologio)$/.test(norm(n));
async function fsTryDir(parent,name){try{return await parent.getDirectoryHandle(name)}catch(e){return null}}
async function fsCopyTree(src,dst){
  let n=0;
  for await(const [name,h] of src.entries()){
    try{
      if(h.kind==="directory"){const d2=await dst.getDirectoryHandle(name,{create:true});n+=await fsCopyTree(h,d2)}
      else{let exists=false;try{await dst.getFileHandle(name);exists=true}catch(e){}
        if(!exists){const f=await h.getFile();const fh=await dst.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(f);await w.close();n++}}
    }catch(e){}
  }
  return n;
}
// Ονόματα φακέλων: βγαίνουν από τη γλώσσα την πρώτη φορά και μετά κλειδώνουν,
// ώστε μια αλλαγή γλώσσας να μη μοιράσει τα αρχεία σε δύο φακέλους.
const FS_SUB_EN={backup:"Backups",offer:"Offers",receipt:"Receipts",photo:"Photos",export:"Exports"};
function fsNames(){
  const st=S.settings;
  if(!st.fsNames){st.fsNames=LANG!=="el"?{app:FS_APP,sub:FS_SUB_EN}:{app:FS_APP_GR,sub:FS_SUB};write()}
  return st.fsNames;
}
const fsSubName=k=>(fsNames().sub||FS_SUB)[k]||FS_SUB[k]||String(k);
let fsMigrating=false;
async function fsBase(root){
  const N=fsNames();let base;
  if(fsIsApp(root.name))base=root;
  else base=await fsTryDir(root,N.app)||await root.getDirectoryHandle(N.app,{create:true});
  // μία φορά: μεταφορά από τον παλιό λατινικό υποφάκελο (μόνο όταν ο νέος έχει άλλο όνομα)
  if(!S.meta.fsMoved&&!fsMigrating){
    const old=N.app===FS_APP?null:(await fsTryDir(base,FS_APP)||(base!==root?await fsTryDir(root,FS_APP):null));
    if(old){
      fsMigrating=true;
      try{const n=await fsCopyTree(old,base);if(n)toast(pl(n,"Μεταφέρθηκε {n} αρχείο στον φάκελο «Δρομολόγιο».","Μεταφέρθηκαν {n} αρχεία στον φάκελο «Δρομολόγιο»."))}catch(e){}
      fsMigrating=false;
    }
    S.meta.fsMoved=true;write();
  }
  return base;
}
async function fsAppDir(kind,ask){
  const root=await fsRoot(ask);if(!root)return null;
  try{const app=await fsBase(root);
    return kind?await app.getDirectoryHandle(fsSubName(kind),{create:true}):app}catch(e){return null}
}
// Η διαδρομή όπως τη βλέπεις στον διαχειριστή αρχείων του κινητού
// Ο Chrome δεν λέει πού βρίσκεται ο φάκελος που διάλεξες· το πρώτο κομμάτι (π.χ. «Λήψεις») το ορίζεις εσύ, αν διαφέρει.
const fsPrefix=()=>S.settings.fsPrefix!=null?S.settings.fsPrefix:T("Λήψεις");
async function fsPathLabel(kind,noPrefix){
  const root=await fsRoot(false);if(!root)return "";
  const parts=[];if(!noPrefix&&fsPrefix())parts.push(fsPrefix());
  parts.push(root.name);if(!fsIsApp(root.name))parts.push(fsNames().app);
  if(kind)parts.push(fsSubName(kind));
  return parts.join(" › ");
}
// Ρυθμίσεις → Δεδομένα: πού είναι ο φάκελος
async function fsPathPaint(){
  const el=$("#set_fspath");if(!el)return;
  if(!fsOK()){el.textContent=T("Σε αυτό το κινητό τα αρχεία πάνε στις «Λήψεις».");return}
  const on=await fsConnected(),chosen=on||await fsChosen();
  el.innerHTML=on?`<b style="font-size:15.5px">${esc(await fsPathLabel(""))}</b><br><span>${T("Μέσα του: {l}",{l:["backup","offer","receipt","photo","export"].map(fsSubName).join(", ")})}</span>`
    :chosen?T("Ο φάκελος είναι αποθηκευμένος, αλλά χρειάζεται ξανά άδεια. Πάτα για να τον ανοίξεις."):T("Δεν έχει συνδεθεί φάκελος. Πάτα για να διαλέξεις.");
}
function fsPrefixSheet(back){

  openSheet({title:T("Πού είναι ο φάκελος"),cancelLabel:T("Πίσω"),onCancel:back||null,saveLabel:T("Αποθήκευση"),

      <div class="chips" id="fp_chips">${opts.map(o=>`<button type="button" class="chip" data-fp="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <label for="fp_val">${T("Ξεκινάει από")}</label><input id="fp_val" value="${esc(fsPrefix())}" autocomplete="off">`,

  $("#fp_chips").onclick=e=>{const b=e.target.closest("[data-fp]");if(!b)return;$("#fp_val").value=b.dataset.fp;sheetDirty=true};

const fsSlug=s=>String(s||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,60)||"-";
const fsToday=()=>toLocalInput(new Date()).slice(0,10);
// Γράφει ένα αρχείο. Σιωπηλά: αν δεν υπάρχει φάκελος ή άδεια, απλώς δεν κάνει τίποτα.
async function fsSave(kind,name,blob,ask){
  try{const dir=await fsAppDir(kind,!!ask);if(!dir)return false;
    const fh=await dir.getFileHandle(fsSlug(name),{create:true});
    const w=await fh.createWritable();await w.write(blob);await w.close();
    S.meta.fsLast=Date.now();write();
    if(kind!=="backup"&&Date.now()-(S.meta.fsBackup||0)>12*3600000)setTimeout(()=>fsSaveBackup(false),400);
    return true}catch(e){return false}
}
async function fsList(kind){
  try{const dir=await fsAppDir(kind,false);if(!dir)return[];const out=[],seen=new Set();
    const dirs=[dir];
    // αν τα ονόματα είναι στα αγγλικά, δείχνουμε και ό,τι είχε μπει παλιά στον ελληνικό υποφάκελο
    if(kind&&fsSubName(kind)!==FS_SUB[kind]){try{const app=await fsAppDir("",false);const od=app&&await fsTryDir(app,FS_SUB[kind]);if(od)dirs.push(od)}catch(e){}}
    for(const d of dirs)for await(const [name,h] of d.entries()){if(h.kind!=="file"||seen.has(name))continue;seen.add(name);
      const f=await h.getFile();out.push({name,at:f.lastModified,size:f.size,handle:h})}
    return out.sort((a,b)=>b.at-a.at)}catch(e){return[]}
}
const fsConnected=async()=>!!(await fsRoot(false));
const fsChosen=async()=>!!(await fsGetHandle());
async function fsSaveBackup(ask){
  const ok=await fsSave("backup",`dromologio-antigrafo-${fsToday()}.json`,new Blob([backupPayload()],{type:"application/json"}),ask);
  if(ok){S.meta.fsBackup=Date.now();markBackup();fsPruneBackups()}
  return ok;
}
// Στον φάκελο μένουν τα 5 πιο πρόσφατα αντίγραφα (ένα τη μέρα)· σβήνονται μόνο αρχεία που έφτιαξε η εφαρμογή.
async function fsPruneBackups(){
  try{const dir=await fsAppDir("backup",false);if(!dir)return;
    const mine=[];for await(const [name,h] of dir.entries()){if(h.kind==="file"&&/^dromologio-antigrafo-\d{4}-\d{2}-\d{2}\.json$/.test(name))mine.push(name)}
    mine.sort().reverse();
    for(const n of mine.slice(KEEP_BACKUPS)){try{await dir.removeEntry(n)}catch(e){}}
  }catch(e){}
}
// Φωτογραφία: μπαίνει και ως κανονικό αρχείο εικόνας στον φάκελο, με το όνομα του πελάτη ή της δουλειάς.
async function fsSavePhoto(ph,owner,ask){
  if(!ph||!ph.dataUrl)return false;
  const name=`foto-${fsToday()}-${fsSlug(owner)}-${String(ph.id||"").slice(-5)}.jpg`;
  const ok=await fsSave("photo",name,dataUrlToBlob(ph.dataUrl),ask);
  if(ok){ph.fsName=name;write()}
  return ok;
}
// Αντιγράφει το PDF της προσφοράς στον φάκελο και λέει καθαρά αν δεν τα κατάφερε.
async function fsOfferCopy(o,cv){
  if(!await fsChosen())return false;

}
async function fsSaveOffer(o,cv,ask){
  const name=`prosfora-${o.no||"—"}-${fsSlug(o.client||"")}-${fsToday()}.pdf`;
  const ok=await fsSave("offer",name,canvasToPdfBlob(cv),ask);

}
// Στέλνει στον φάκελο ό,τι δεν έχει σταλεί ακόμα: αντίγραφο, φωτογραφίες, σταλμένες προσφορές.
async function fsSyncAll(){
  const root=await fsRoot(true);
  if(!root){toast(T("Δεν διαλέχτηκε φάκελος."));return}
  toast(T("Αποθήκευση στον φάκελο…"));await ensureLogo();
  let ph=0,of=0;
  await fsSaveBackup(true);
  for(const c of S.clients)for(const p of (c.photos||[]))if(!p.fsName&&await fsSavePhoto(p,c.name,true))ph++;
  for(const x of S.tasks){
    for(const p of (x.photos||[]))if(!p.fsName&&await fsSavePhoto(p,x.title||T("Εργασία"),true))ph++;

// Αυτόματο αντίγραφο στον φάκελο, χωρίς να ρωτάει, το πολύ μία φορά την ώρα.
async function fsAutoBackup(){
  if(!fsOK()||S.settings.fsAuto===false)return;
  if(Date.now()-(S.meta.fsBackup||0)<60*60000)return;
  if(!await fsConnected())return;
  await fsSaveBackup(false);
}
/* Αντίγραφα μέσα στην ίδια την εφαρμογή: δεν ζητούν άδεια, δεν φαίνονται στον διαχειριστή αρχείων,
   αλλά σώζουν τη δουλειά αν κάτι πάει στραβά. Κρατάμε τα 5 τελευταία. */
const KEEP_BACKUPS=5;
async function opfsDir(){
  try{if(!navigator.storage||!navigator.storage.getDirectory)return null;
    const root=await navigator.storage.getDirectory();
    return await root.getDirectoryHandle("antigrafa",{create:true})}catch(e){return null}
}
async function opfsSave(){
  const dir=await opfsDir();if(!dir)return false;
  try{
    const name="dromologio-"+toLocalInput(new Date()).slice(0,10)+".json";
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable();await w.write(new Blob([backupPayload()],{type:"application/json"}));await w.close();
    const list=await opfsList();
    for(const f of list.slice(KEEP_BACKUPS)){try{await dir.removeEntry(f.name)}catch(e){}}
    S.meta.opfsLast=Date.now();write();return true;
  }catch(e){return false}
}
async function opfsList(){
  const dir=await opfsDir();if(!dir)return[];
  try{const out=[];
    for await(const [name,h] of dir.entries()){if(h.kind!=="file")continue;
      const f=await h.getFile();out.push({name,at:f.lastModified,size:f.size,handle:h})}
    return out.sort((a,b)=>b.at-a.at)}catch(e){return[]}
}
async function opfsAuto(){
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}

function opfsPaint(){

        <div class="avatar">${ic("shield",18)}</div><div class="grow"><div class="title">${esc(f.name)}${i===0?` <b class="newest">${T("νεότερο")}</b>`:""}</div>
        <div class="meta"><span>${fmt(f.at)}</span><span>${Math.max(1,Math.round(f.size/1024))} KB</span></div></div></div>`).join("")):`<div class="empty">${T("Δεν υπάρχει ακόμα αντίγραφο.")}</div>`}
      <button type="button" class="btn ghost wide gobtn" id="opfsNow" style="margin-top:8px;border:1.5px solid var(--line)">${ic("shield",20)}${T("Κράτα αντίγραφο τώρα")}</button>`;

const BUF=3;let depth=0,leaving=false;
history.replaceState({g:0},"");
function topUp(){if(leaving||$("#exitDlg").classList.contains("open"))return;while(depth<BUF){depth++;history.pushState({g:depth},"")}}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,topUp,true));

  depth=e.state&&typeof e.state.g==="number"?e.state.g:0;
  if(leaving)return;
  if(exitTried)return;   // δεύτερο πάτημα: αφήνουμε το Chrome να κάνει τη δουλειά του
  if($("#exitDlg").classList.contains("open")){$("#exitDlg").classList.remove("open");return}
  if(photoOpen()){closePhotoView();return}
  if(jobsMapOpen()){closeJobsMap();return}
  if(mapOpen()){closeMap();return}
  if($("#alert").classList.contains("open"))return;
  if($("#modal").classList.contains("open")){cancelSheet();return}
  if(view==="client"){view="clients";clientId=null;render();return}
  if(view!=="today"){view="today";clientId=null;render();window.scrollTo(0,0);return}
  $("#exitT").textContent=T("Έξοδος από την εφαρμογή;");$("#exitS").textContent=T("Τα δεδομένα σου μένουν αποθηκευμένα.");
  $("#exitNo").textContent=T("Όχι");$("#exitYes").textContent=T("Ναι, έξοδος");$("#exitDlg").classList.add("open");
});
$("#exitNo").onclick=()=>{$("#exitDlg").classList.remove("open");topUp()};
let exitTried=false;
$("#exitYes").onclick=()=>{
  exitTried=true;leaving=true;$("#exitDlg").classList.remove("open");
  // 1) Αν η εφαρμογή άνοιξε από εμάς (εγκατεστημένη ή νέα καρτέλα), κλείνει κανονικά.
  try{window.close()}catch(e){}
  // 2) Αλλιώς γυρνάμε πίσω από όλες τις δικές μας εγγραφές, ώστε το επόμενο «πίσω»
  //    να βγάζει έξω από τη σελίδα, χωρίς να ξαναρωτήσει.
  const d=depth;
  setTimeout(()=>{try{history.go(-(d+1))}catch(e){}},30);
  setTimeout(()=>{
    leaving=false;               // ο φρουρός φεύγει, αλλά το exitTried μένει: δεν ξαναρωτάει
    if(!document.hidden)toast(T("Πάτα άλλη μια φορά «πίσω» για να βγεις, ή το κουμπί αρχικής οθόνης."));
  },900);
};

/* ---------- Πληκτρολόγιο: κρατάμε ορατά τα κουμπιά του φύλλου ---------- */
const vv=window.visualViewport;
function fitViewport(){
  const R=document.documentElement.style;
  R.setProperty("--vvh",(vv?vv.height:window.innerHeight)+"px");
  const m=$("#modal");
  if(vv&&m.classList.contains("open")){m.style.height=vv.height+"px";m.style.top=vv.offsetTop+"px";m.style.bottom="auto"}
  else{m.style.height="";m.style.top="";m.style.bottom=""}
  setTimeout(updateStickBar,60);setTimeout(updateKbBar,60);
}
// «Επόμενο»: πηδάει στο επόμενο πεδίο μέσα στο ίδιο αναδυόμενο, χωρίς να κλείνει το πληκτρολόγιο
function kbFields(){
  const scope=$("#shBody");if(!scope)return[];
  return[...scope.querySelectorAll("input,textarea")].filter(el=>
    el.type!=="hidden"&&el.type!=="checkbox"&&el.type!=="radio"&&!el.disabled&&!el.readOnly&&el.offsetParent!==null);
}
let kbCurrent=null;
document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t&&t.closest&&t.closest("#shBody")&&/^(INPUT|TEXTAREA)$/.test(t.tagName)&&t.type!=="hidden"&&t.type!=="checkbox"&&t.type!=="radio"&&!t.readOnly)kbCurrent=t;
});
function updateKbBar(){
  const bar=$("#kbBar");if(!bar)return;
  const modalOpen=$("#modal").classList.contains("open");
  const inField=modalOpen&&kbCurrent&&document.contains(kbCurrent)&&kbCurrent===document.activeElement;
  bar.hidden=!inField;
  if(inField){
    const f=kbFields(),i=f.indexOf(kbCurrent);
    $("#kbNext").innerHTML=(i>=0&&i<f.length-1)?(T("Επόμενο")+" →"):T("Έτοιμο");
    // δεν κάθεται ποτέ πάνω από τα κουμπιά Αποθήκευση/Άκυρο του φύλλου
    const fx=$("#shFoot");
    bar.style.bottom=(fx&&fx.offsetHeight?fx.offsetHeight:0)+"px";
  }
}
function focusNextField(){
  const f=kbFields(),i=f.indexOf(kbCurrent);
  const next=f[i+1];
  if(next){kbCurrent=next;next.focus();try{next.select&&next.select()}catch(e){}}
  else if(kbCurrent)kbCurrent.blur();
}
$("#kbNext").onmousedown=e=>e.preventDefault(); // δεν κλέβει την εστίαση πριν προλάβει να τρέξει το click
$("#kbNext").onclick=focusNextField;
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;
  if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){document.body.classList.remove("typing");updateStickBar();updateKbBar()}},60));
if(vv){vv.addEventListener("resize",fitViewport);vv.addEventListener("scroll",fitViewport)}
window.addEventListener("resize",fitViewport);
document.addEventListener("focusin",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){document.body.classList.add("typing");[80,250,500].forEach(t=>{setTimeout(updateStickBar,t);setTimeout(updateKbBar,t)})}
  if(!$("#modal").classList.contains("open"))return;
  fitViewport();
  const el=e.target;
  if(el&&el.closest&&el.closest("#shBody"))setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),280);
});
// στις κανονικές προβολές: το πεδίο που γράφεις ανεβαίνει πάνω από το πληκτρολόγιο
function keepVisible(el){
  if(!el||!el.getBoundingClientRect)return;
  fitViewport();
  const r=el.getBoundingClientRect(),vh=(vv?vv.height:innerHeight),hdr=$("header").getBoundingClientRect().height+8;
  if(r.bottom>vh-14||r.top<hdr)el.scrollIntoView({block:"center",behavior:"smooth"});
}
document.addEventListener("focusin",e=>{
  const el=e.target;
  if(!el||!el.closest||!el.closest("main"))return;
  if(!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return;
  [180,420,700].forEach(t=>setTimeout(()=>keepVisible(el),t));
});
const _openSheet=openSheet,_closeSheet=closeSheet;
openSheet=function(o){_openSheet(o);fitViewport()};
closeSheet=function(){_closeSheet();fitViewport()};

/* ---------- «Θύμισέ μου όταν φτάσω κοντά» ---------- */
let watchId=null,myPos=null;
const nearTasks=()=>S.tasks.filter(x=>isOpen(x)&&x.nearAlert>0&&taskLoc(x));
function updateWatch(){
  const want=(nearTasks().length>0||S.settings.debtAlert)&&navigator.geolocation&&window.isSecureContext&&!geoBlockedByFrame();
  if(want&&watchId==null){
    watchId=navigator.geolocation.watchPosition(p=>{
      myPos={lat:p.coords.latitude,lng:p.coords.longitude};checkNear();
    },()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
  }else if(!want&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
}
function debtNear(){
  if(!myPos||!S.settings.debtAlert)return;
  S.clients.filter(alive).forEach(c=>{
    const L=clientLoc(c);if(!L)return;
    const m=cMoney(c);if(m.owed<=0.004)return;
    const d=km(myPos,L)/1.3*1000;
    if(d<=(S.settings.debtRadius||1000)){
      if(c.debtMute&&c.debtMute>Date.now())return;
      if(c.debtFired&&Date.now()-c.debtFired<6*3600000)return;
      c.debtFired=Date.now();write();
      const title=T("{n} σου χρωστάει {a}",{n:c.name,a:money(m.owed)});
      if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([180,90,180]);
      phoneNotify(title,T("Είσαι κοντά του τώρα."),"debt-"+c.id);
      alertQ.push({type:"debt",id:c.id,dist:Math.round(d)});if(!alertShown)showNextAlert();
    }else if(c.debtFired&&d>(S.settings.debtRadius||1000)*1.6){c.debtFired=0;write()}
  });
}
function checkNear(){
  debtNear();
  if(!myPos)return;
  nearTasks().forEach(x=>{
    const L=taskLoc(x),d=km(myPos,L)/1.3*1000; // πραγματική ευθεία απόσταση σε μέτρα
    if(d<=x.nearAlert){
      if(x.nearMute&&x.nearMute>Date.now())return;
      if(x.nearFired&&Date.now()-x.nearFired<2*3600000)return;
      x.nearFired=Date.now();write();
      const c=x.clientId&&getClient(x.clientId);
      const title=T("Είσαι κοντά: {a}",{a:L.label});
      const body=x.title+(c?" — "+c.name:"");
      if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
      phoneNotify(title,body,"near-"+x.id);
      alertQ.push({type:"near",id:x.id,dist:Math.round(d)});if(!alertShown)showNextAlert();
    }else if(x.nearFired&&d>x.nearAlert*1.6){x.nearFired=0;write()}
  });
}
setInterval(()=>{updateWatch();checkNear()},45000);

function offerDraft(){
  const d=getDraft();if(!d||d.kind!=="task"||!d.data)return;
  const t=d.data.title||T("χωρίς τίτλο");
  const ex=d.data._editId?S.tasks.find(x=>x.id===d.data._editId&&alive(x)):null;
  const msg=ex?T("Είχες ανοιχτή την εργασία «{t}» με αλλαγές που δεν αποθηκεύτηκαν. Να συνεχίσεις;",{t:t})
             :T("Είχες ξεκινήσει μια εργασία («{t}») και δεν αποθηκεύτηκε. Να συνεχίσεις;",{t:t});
  if(confirm(msg))taskForm(ex||null,null,d.data);
  else clearDraft();
}
// Οι επαναλαμβανόμενες που έχασαν την ώρα τους (κλειστή εφαρμογή) πάνε στην επόμενη φορά, σαν ξυπνητήρι
S.reminders.forEach(r=>{if(remActive(r)&&r.repeat&&r.repeat!=="none"&&r.when&&Date.now()-new Date(r.when)>12*3600000){
  r.when=nextOccurrence(r);r.alerted=false;r.preAlerted=false;r.snoozeUntil=null}});
if(typeof pStartup==="function")pStartup(); // Προσωπικά: προεπιλογή Ταμείου και συγχρονισμός πάγιων
write();
purgeOldTrash();
applyLook();render();gatePaint();checkDue();fitViewport();updateWatch();
if(inviteOK()){setTimeout(offerDraft,700);setTimeout(showInstallBar,900)}
initSW();
setTimeout(fsAutoBackup,3000);
setTimeout(opfsAuto,1500);
setTimeout(showFolderBar,2200);
setInterval(checkDue,15000);
setInterval(unfade,2000);
</script>
